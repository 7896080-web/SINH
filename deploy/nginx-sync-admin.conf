# /etc/nginx/sites-available/sync-admin
# После создания: ln -s /etc/nginx/sites-available/sync-admin /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.ru;

    # Certbot (Let's Encrypt) перепишет этот блок сам при выпуске
    # бесплатного SSL — можно и через панель reg.ru, если сервер куплен
    # с их DNS. До этого момента сайт будет работать по HTTP.

    client_max_body_size 20M;  # для загрузки Excel-файлов на страницах мэппинга/товаров

    location /static/ {
        alias /opt/sync_admin/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сессии/cookie идут через SessionMiddleware — важно передавать
        # оригинальный протокол, иначе secure-cookie может не выставляться
        proxy_redirect off;
    }
}
