      properties:
        info:
          type: string
          example: "М18"
          description: "Модель транспортного средства"
        licensePlate:
          type: string
          example: "А010АУ199"
          description: "Государственный номер в формате: 1 буква, 3 цифры, 2 буквы, 2–3 цифры региона"

    Carrier:
      type: object
      nullable: false
      additionalProperties: false
      description: "Компания-перевозчик"
      required:
