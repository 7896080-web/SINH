            `IN_PROGRESS` — склад настраивается;
            `KAM_AWAITING` — ожидает действий менеджера Lamoda;
            `CREATED` — склад создан;
            `ARCHIVED` — склад деактивирован.
          enum: [ IN_PROGRESS, KAM_AWAITING, CREATED, ARCHIVED ]
        address:
          type: string
          description: Адрес склада.
        baseWarehouseId:
          type: string
          nullable: true
          description: Идентификатор базового склада Lamoda. `null`, если базовый склад не назначен.
        baseWarehouseCode:
          type: string
          nullable: true
          description: Код базового склада Lamoda. `null`, если базовый склад не назначен.
        baseWarehouseAddress:
          type: string
          nullable: true
          description: Адрес базового склада Lamoda. `null`, если базовый склад не назначен.
        isActive:
          type: boolean
          description: Признак активности склада.

    PickupRequestListResult:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PickupRequest"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PickupRequest:
      type: object
      nullable: false
      additionalProperties: false
      description: "Заявка на доставку товаров со склада/возврат товаров на склад"
      required:
        - requestId
        - status
        - date
        - type
        - cancellationAvailability
      properties:
        arrivalAt:
          type: string
          format: date-time
          example: "2025-05-18T05:04:44.000Z"
          description: "Время прибытия курьера. Может отсутствовать если заявка еще не запланирована на исполнение курьером"
        departureAt:
          type: string
          format: date-time
          example: "2025-05-18T05:04:44.000Z"
          description: "Время отбытия курьера. Может отсутствовать если заявка еще не запланирована на исполнение курьером"
        requestId:
          type: string
          format: uuid
          example: "e192af71-f2f0-4c55-9b72-bb4573d94aa1"
          description: "Идентификатор заявки"
        date:
          type: string
          format: date
          example: "2025-05-18"
          description: "Дата заявки"
        arrivalTimeIntervalStart:
          type: string
          example: "12:00"
          description: "Начало интервала прибытия"
        arrivalTimeIntervalEnd:
          type: string
          example: "17:00"
          description: "Конец интервала прибытия"
        cancellationAvailability:
          type: string
          enum:
            - ALLOWED
            - PAID_ALLOWED
            - FORBIDDEN_HAS_SHIPMENT
            - FORBIDDEN_DEPARTURE_SOON
          description: |
            Возможность отмены заявки:
            - ALLOWED — можно отменить
            - PAID_ALLOWED — можно отменить на платной основе
            - FORBIDDEN_HAS_SHIPMENT — к заявке привязана отгрузка
            - FORBIDDEN_DEPARTURE_SOON — до убытия авто осталось 1 час или меньше
        status:
          $ref: "#/components/schemas/PickupRequestStatus"
        type:
          $ref: "#/components/schemas/PickupRequestType"
        couriers:
          type: array
          items:
            $ref: "#/components/schemas/Courier"

    Courier:
      type: object
      nullable: false
      additionalProperties: false
      description: "Курьер. Может отсутствовать если курьер еще не назначен на заявку"
      required:
        - vehicle
        - carrier
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        carrier:
          $ref: "#/components/schemas/Carrier"

    Vehicle:
      type: object
      nullable: false
      additionalProperties: false
      description: "Транспортное средство"
      required:
