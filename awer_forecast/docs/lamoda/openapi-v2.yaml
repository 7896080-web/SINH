      summary: Сформировать этикетки по товарам
      description: |
        Используется для получения ссылки на PDF-документ с этикетками
        определённого размера по товарам (FBS).

        Принимает список `itemNr` (идентификаторов позиций заказа) — до 100 за запрос.
        Позиции, для которых этикетка не может быть сформирована,
        возвращаются в `excludedItems`.

        Если для всех переданных позиций этикетки не могут быть сформированы,
        `fileUrl` будет пустой строкой.

        `sellerId` обязателен в запросе.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.post.labels.order-items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemLabelsRequest'
            example:
              sellerId: "12345"
              labelFormat: "M"
              items:
                - "RU250216-884060-001-1"
                - "RU250216-884061-002-1"
      responses:
        "200":
          description: Ссылка на PDF с этикетками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemLabelsResponse'
              example:
                data:
                  fileUrl: "https://storage.yandexcloud.net/.../item-labels.pdf"
                  excludedItems:
                    - "RU250216-884061-002-1"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'

  /v2/labels/order-packs:
    post:
      tags:
        - FBS Labels
      summary: Сформировать этикетки по упаковкам
      description: |
        Используется для получения ссылки на PDF-документ с этикетками
        определённого размера по упаковкам (FBS).

        Принимает список `packNumber` (баркодов упаковок) — до 100 за запрос.
        Упаковки, для которых этикетка не может быть сформирована,
        возвращаются в `excludedPacks`.

        Если для всех переданных упаковок этикетки не могут быть сформированы,
        `fileUrl` будет пустой строкой.

        `sellerId` обязателен в запросе.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.post.labels.order-packs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPackLabelsRequest'
            example:
              sellerId: "12345"
              labelFormat: "L"
              packs:
                - "FBS086D4F40P"
                - "FBS086D4F40Q"
      responses:
        "200":
          description: Ссылка на PDF с этикетками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPackLabelsResponse'
              example:
                data:
                  fileUrl: "https://storage.yandexcloud.net/.../pack-labels.pdf"
                  excludedPacks:
                    - "FBS086D4F40Q"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'

  /v2/labels/pallets:
    post:
      tags:
        - FBS Labels
      summary: Сформировать этикетки по паллетам
      description: |
        Используется для получения ссылки на PDF-документ с этикетками
        определённого размера по паллетам.

        Принимает список баркодов паллет — до 100 за запрос.
        Паллеты, для которых этикетка не может быть сформирована,
        возвращаются в `excludedPallets`.

        Если для всех переданных паллет этикетки не могут быть сформированы,
        `fileUrl` будет пустой строкой.

        `sellerId` обязателен в запросе.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.post.labels.pallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PalletLabelsRequest'
            example:
              sellerId: "12345"
              labelFormat: "M"
              palletBarcodes:
                - "PALLET-001"
                - "PALLET-002"
      responses:
        "200":
          description: Ссылка на PDF с этикетками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PalletLabelsResponse'
              example:
                data:
                  fileUrl: "https://storage.yandexcloud.net/.../pallet-labels.pdf"
                  excludedPallets:
                    - "PALLET-002"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'
  /v2/fbs/shipments:
    get:
      tags:
        - FBS Shipments
      summary: Получить список отгрузок FBS
      description: |
        Возвращает список отгрузок, созданных партнером

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.get.fbs.shipments
      parameters:
        - $ref: '#/components/parameters/SellerIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/FBSShipmentSortQuery'
        - $ref: '#/components/parameters/FBSShipmentSearchQuery'
        - $ref: '#/components/parameters/ShipmentStatusesQuery'
        - $ref: '#/components/parameters/FromDateQuery'
        - $ref: '#/components/parameters/ToDateQuery'
      responses:
        "200":
          description: Список FBS отгрузок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FBSShipmentsResponse"
              example:
                items:
                  - shipmentId: "F30115303"
                    palletsQuantity: 2
                    packQuantity: 5
                    itemsQuantity: 12
                    price:
                      amount: 129944
                      currency: "RUB"
                    createdAt: "2025-05-12T22:01:02.000Z"
                    baseWarehouse: "BYKOVO"
                    canBeCancelled: true
                meta:
                  total: 5
                  page: 1
                  limit: 1
                  totalPages: 5
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "VALIDATION_FAILED"
                  message: "Invalid data"
        '401':
          description: Токен отсутствует или невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "UNAUTHORIZED"
                  message: "Unauthorized"
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "FORBIDDEN"
                  message: "Forbidden"
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "SERVICE_UNAVAILABLE"
                  message: "Service Unavailable"

    post:
      tags:
        - FBS Shipments
      summary: Создать FBS отгрузку
      description: |
        Создаёт FBS отгрузку с указанными паллетами, паками и позициями.
        Отгрузка создается на основании паковых номеров.
        `sellerId` обязателен в body

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.post.fbs.shipments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FBSShipmentCreateRequest"
            examples:
              basic:
                summary: Создание поставки
                value:
                  sellerId: "123"
                  shipAt: "2026-07-07T09:30:00Z"
                  pallets:
                    - packs:
                        - packId: "PACK-123"
                          items:
                            - unitload: "UNITLOAD-123"
      responses:
        "201":
          description: Отгрузка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FBSShipmentCreatedResponse"
              examples:
                success:
                  summary: Успешное создание отгрузки
                  value:
                    shipmentId: "FBS12312412"
                    status: "NEW"
                    baseWarehouse: "BYKOVO"
                    canBeCancelled: true
                    createdAt: "2023-12-01T10:30:00Z"
                    pallets:
                      - palletId: "PALLET123"
                        packs:
                          - packId: "PACK123"
                            items:
                              - unitload: "UNITLOAD-123"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'

  /v2/fbs/shipments/{shipmentId}:
    get:
      tags:
        - FBS Shipments
      summary: FBS отгрузка.
      description: |
        Возвращает FBS отгрузку с информацией о паллетах.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.get.fbs.shipment
      parameters:
        - $ref: '#/components/parameters/FBSShipmentIdPath'
        - $ref: '#/components/parameters/SellerIdQuery'
      responses:
        "200":
          description: FBS отгрузка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FBSShipmentResponse"
              example:
                shipmentId: "F30115303"
                palletsQuantity: 2
                packQuantity: 5
                itemsQuantity: 12
                price:
                  amount: 129944
                  currency: "RUB"
                createdAt: "2025-05-12T22:01:02.000Z"
                baseWarehouse: "BYKOVO"
                canBeCancelled: true
                pallets:
                  - palletId: "PALLFF001"
                    packs:
                      - packId: "FBS0491E996E"
                        items:
                          - "SKU123456"
                          - "SKU789012"
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "VALIDATION_FAILED"
                  message: "Invalid data"
        '401':
          description: Токен отсутствует или невалиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "UNAUTHORIZED"
                  message: "Unauthorized"
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "FORBIDDEN"
                  message: "Forbidden"
        '404':
          $ref: '#/components/responses/Response.404'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: "SERVICE_UNAVAILABLE"
                  message: "Service Unavailable"

  /v2/fbs/prepared-shipments:
    post:
      tags:
        - FBS Shipments
      summary: Создать подготовленную вручную отгрузку FBS
      description: |
        Создаёт FBS отгрузку вручную с указанными данными о паллетах, паках и позициях.
        `sellerId` обязателен в body

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.post.fbs.prepared-shipments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FBSPreparedShipmentCreateRequest"
            examples:
              basic:
                summary: Создание ручной отгрузки
                value:
                  shipmentId: "JLX0000000200"
                  docNumber: "DOC-001"
                  sellerId: "123"
                  pallets:
                    - palletId: "PALLET-001"
                      packs:
                        - packId: "PACK-001"
                          weight: "1.5"
                          length: "30"
                          width: "20"
                          height: "10"
                          items:
                            - sku: "SKU-001"
                              unitload: "UNITLOAD-001"
                              orderId: "ORDER-001"
                              weight: "0.5"
                              length: "10"
                              width: "5"
                              height: "3"
      responses:
        "201":
          description: Ручная отгрузка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FBSPreparedShipmentCreatedResponse"
              example:
                shipmentId: "JLX0000000200"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'

components:
  schemas:
    TokensCreateResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: "Токен доступа к api. Передается в заголовке -  Authorization: Bearer <token>"
        expires_in:
          type: integer
          description: Время жизни токена в секундах
        token_type:
          type: string
          description: Тип OAuth токена
        scope:
          type: string
          description: скоуп доступов

    TokensCreateRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          description: Тип OAuth авторизации. Доступен только client_credentials
          type: string
          enum:
            - client_credentials
        client_id:
          description: Id клиента авторизации
          type: string
          example: "4_872hjdfhgih3ufe9h"
        client_secret:
          description: Secret клиента авторизации
          type: string
          example: "sdfhjxnmx898jxk0xf8fj"

    ApiErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          description: Путь к полю, вызвавшему ошибку
        issue:
          type: string
          description: Описание проблемы
      required: [ field, issue ]

    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          enum: [VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, TOO_MANY_REQUESTS, SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR]
        message:
          type: string
          description: Краткое описание ошибки
        details:
          type: array
          description: Подробности валидационных ошибок (если применимо)
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required: [ code, message ]

    ApiErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      required: [ error ]

    EmptyObject:
      type: object
      nullable: false
      example: {}

    GenderEnum:
      type: string
      enum:
        - BOYS
        - KIDS
        - GIRLS
        - MEN
        - UNISEX
        - WOMEN
      description: |
        Пол
        Возможные значения:
        - `BOYS` - Мальчики
        - `KIDS` - Дети
        - `GIRLS` - Девочки
        - `MEN` - Мужчины
        - `UNISEX` - Унисекс
        - `WOMEN` - Женщины

    NomenclatureImagesPostRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - images
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        images:
          type: array
          description: Список изображений товара, максимум 8 элементов.
          items:
            $ref: '#/components/schemas/NomenclatureImageUpdate'
          minItems: 1
          maxItems: 8

    NomenclatureImageUpdate:
      type: object
      additionalProperties: false
      required:
        - index
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 8
          description: Порядковый номер изображения в галерее товара (начиная с 1), максимальное значение индекса - 8.
        imageId:
          type: string
          description: Идентификатор существующего изображения. Используется для повторного использования уже загруженного изображения.
          nullable: true
        file:
          type: string
          format: byte
          description: |
            Base64 строка с изображением. Используется для загрузки нового изображения.
            Максимальный размер изображения 5 МБ.
            Допустимый формат изображения - jpg и jpeg.
          nullable: true
          example: "/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLD"
      description: |
        Параметры устанавливаемого изображения
        imageId может быть null при загрузке нового изображения, при этом `file` должен быть не null
        file может быть null при использовании уже загруженного изображения, при этом `imageId` должен быть не null

    NomenclatureImagesUpdateResponse:
      type: object
      additionalProperties: false
      description: Пустой объект при успешном обновлении изображений

    OrderItemStatusesResponse:
      type: object
      additionalProperties: false
      required:
        - statuses
        - meta
      properties:
        statuses:
          type: array
          description: История статусов заказа
          items:
            $ref: '#/components/schemas/OrderItemStatus'
        meta:
          description: Данные пагинации.
          $ref: '#/components/schemas/PaginationMeta'

    OrderStatusHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - statuses
        - meta
      properties:
        statuses:
          type: array
          description: Массив статусов заказа.
          items:
            $ref: '#/components/schemas/OrderStatusItem'
        meta:
          description: Данные пагинации.
          $ref: '#/components/schemas/PaginationMeta'

    OrdersListResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - orders
      properties:
        meta:
          description: Данные пагинации.
          $ref: '#/components/schemas/PaginationMeta'
        orders:
          type: array
          description: Список заказов.
          items:
            $ref: '#/components/schemas/OrdersListOrder'

    OrdersListPayments:
      type: object
      additionalProperties: false
      required:
        - amount
        - method
        - status
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Price'
          description: Сумма оплаты (в копейках).
          example:
            amount: 2000
            currency: "RUB"
        method:
          type: string
          description: Способ оплаты.
          example: "BertelsmannCod"
        status:
          $ref: '#/components/schemas/OrdersListPaymentStatusEnum'
          description: Статус оплаты.
          example: "NEW"

    OrdersListDeliveryMethod:
      type: object
      additionalProperties: false
      required:
        - deliveryIntervalId
        - deliveryDate
        - deliveryIntervalFrom
        - deliveryIntervalTo
        - deliveryPrice
        - shippingMethodName
        - shippingMethodCode
        - serviceLevelTypeCode
        - serviceLevelTypeName
        - cutOff
        - hasIntervals
        - deliveryDateMax
        - deliveryDateMin
        - storageDays
      properties:
        deliveryIntervalId:
          type: string
          nullable: true
          description: Идентификатор интервала доставки.
          example: "563990086"
        deliveryDate:
          type: string
          nullable: true
          description: Дата доставки в формате ISO 8601 UTC с суффиксом Z.
          example: "2018-07-08T00:00:00Z"
        deliveryIntervalFrom:
          type: string
          nullable: true
          description: Начало интервала доставки.
          example: "10:00"
        deliveryIntervalTo:
          type: string
          nullable: true
          description: Конец интервала доставки.
          example: "12:00"
        deliveryPrice:
          allOf:
            - $ref: '#/components/schemas/Price'
          description: Стоимость доставки (в копейках).
          example:
            amount: 15000
            currency: "RUB"
        shippingMethodName:
          type: string
          description: Наименование метода отгрузки.
          example: "Курьерская доставка Lamoda Express"
        shippingMethodCode:
          type: string
          description: Код метода отгрузки.
          example: "lamoda"
        serviceLevelTypeCode:
          type: string
          nullable: true
          description: Код сервиса уровня доставки.
          example: "plus"
        serviceLevelTypeName:
          type: string
          nullable: true
          description: Наименование сервиса уровня доставки.
          example: "С примеркой"
        cutOff:
          type: string
          description: Дата и время cut-off для доставки в формате ISO 8601 UTC с суффиксом Z.
          example: "2019-04-06T09:00:00Z"
        hasIntervals:
          type: boolean
          description: Признак наличия интервалов доставки.
          example: true
        deliveryDateMax:
          type: string
          nullable: true
          description: Максимальная доступная дата доставки в формате ISO 8601 UTC с суффиксом Z.
          example: "2018-07-10T00:00:00Z"
        deliveryDateMin:
          type: string
          nullable: true
          description: Минимальная доступная дата доставки в формате ISO 8601 UTC с суффиксом Z.
          example: "2018-07-08T00:00:00Z"
        storageDays:
          type: integer
          nullable: true
          description: Количество дней хранения заказа.
          example: 4

    OrdersListOrder:
      type: object
      additionalProperties: false
      required:
        - id
        - orderId
        - status
        - paymentMethod
        - comment
        - createdAt
        - updatedAt
        - deliveryPrice
        - fullSum
        - hasDiscrepancyActs
        - isConfirmed
        - payments
        - deliveryMethod
      properties:
        id:
          type: string
          description: Внутренний идентификатор заказа.
          example: "LM140101-123456"
        orderId:
          type: string
          description: Идентификатор заказа.
          example: "140101-123456"
        status:
          $ref: '#/components/schemas/OrderResponseStatusEnum'
          description: Статус заказа.
          example: "CONFIRMED"
        jewellerySpecification:
          description: Результат проверки ювелирной спецификации в ГИИС ДМДК. Поле отсутствует, если для заказа не создана проверка спецификации.
          $ref: '#/components/schemas/OrderJewellerySpecificationResponse'
        paymentMethod:
          type: string
          description: Способ оплаты заказа.
          example: "COD"
        comment:
          type: string
          description: Комментарий к заказу.
          example: "Call me later"
        createdAt:
          type: string
          description: Дата создания заказа в формате ISO 8601 UTC с суффиксом Z.
          example: "2018-04-10T00:00:00Z"
        updatedAt:
          type: string
          description: Дата и время последнего обновления заказа в формате ISO 8601 UTC с суффиксом Z.
