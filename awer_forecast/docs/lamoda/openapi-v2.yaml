  /v2/nomenclatures:
    get:
      tags:
        - Nomenclatures
      description: |
        Поиск товаров

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      summary: Получить детализированный список товаров
      operationId: v2.get.nomenclatures
      parameters:
        - $ref: '#/components/parameters/SellerIdQuery'
        - $ref: '#/components/parameters/SkusQuery'
        - $ref: '#/components/parameters/ExternalSkusQuery'
        - $ref: '#/components/parameters/ParentSkusQuery'
        - $ref: '#/components/parameters/ExternalParentSkusQuery'
        - $ref: '#/components/parameters/CountryQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/NomenclaturesLimitQuery'
        - $ref: '#/components/parameters/NomenclaturesSortQuery'
      responses:
        "200":
          description: Список искомых размерных товаров
          content:
            application/json:
              schema:
                required:
                  - nomenclatures
                  - meta
                type: object
                properties:
                  nomenclatures:
                    $ref: '#/components/schemas/NomenclaturesResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                empty:
                  summary: Пустой список товаров
                  value:
                    nomenclatures: []
                    meta:
                      total: 0
                      page: 1
                      limit: 25
                      totalPages: 0
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'
    post:
      tags:
        - Nomenclatures
      operationId: v2.post.nomenclatures
      summary: Создать или обновить товар
      description: |
        Запрос на создание или обновление товара по атрибутам партнёра.
        Требует обязательный `sellerId` для проверки прав доступа.

        **Как собрать тело запроса.** Состав `nomenclature.attributes` не фиксирован контрактом — он зависит от категории товара:
        1. Возьмите `categoryId` из <a href="https://academy.lamoda.ru/articles/api/10_v2_spec/#/Categories/v2.get.nomenclature-categories">GET /v2/nomenclature-categories</a>.
        2. Получите атрибуты категории — <a href="https://academy.lamoda.ru/articles/api/10_v2_spec/#/Nomenclatures/v2.get.nomenclature-categories.attributes">GET /v2/nomenclature-categories/{categoryId}/attributes</a>. У каждого атрибута есть код (`code`), тип (`type`) и признаки обязательности: по бизнес-модели (`requiredForShipmentTypes`), полу/возрастной группе (`requiredForGenders`) и шаблону создания (`requiredForTemplates`). Заполните все атрибуты, обязательные для вашего сочетания.
        3. Для атрибутов типа `DICTIONARY_ENTRY` / `ARRAY_OF_DICTIONARY_ENTRY` значения берите из связанного справочника (поле `dictionary`; значения — <a href="https://academy.lamoda.ru/articles/api/10_v2_spec/#/Dictionaries/v2.get.dictionaries.attributes">GET /v2/dictionaries/attributes</a>). Допустимые сочетания значений (категории сайта, ТН ВЭД, наименования, размерные шкалы, бренды) — <a href="https://academy.lamoda.ru/articles/api/10_v2_spec/#/Nomenclatures/v2.get.nomenclature-categories.attributes-mappings">GET /v2/nomenclature-categories/{categoryId}/attributes-mappings</a>.
        4. Соберите `nomenclature.attributes`: ключ — код атрибута, значение — объект `{type, value}`.
        5. Соберите `nomenclature.variationAttributes`: один элемент массива — одна вариация (например, размер) в той же структуре; идентификаторы вариации (например, `supplierSku`) передаются здесь.
        6. Укажите `requestType`: `CREATE` — новая карточка, `UPDATE` — обновление существующей. Цены `prices` опциональны, суммы — в минорных единицах валюты (копейки для RUB/BYN, тиыны для KZT).

        **Важно.** Метод не атомарен: карточка сохраняется в контент-сервисе до простановки цен — при повторе после сбоя `503` отправляйте `requestType=UPDATE`, иначе создадите дубль. Ответ `200` не означает полный успех: проверяйте в теле ответа `errors[]` (ошибки по элементам), `priceStatuses` (статусы цен) и `fraudValidationResult` (фрод-проверка цены, срабатывает только при `UPDATE`).

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomenclatureStoreRequest'
            example:
              sellerId: "471392924"
              country: RU
              nomenclature:
                requestType: CREATE
                categoryId: "5637156660"
                attributes:
                  gender:
                    type: STRING
                    value: "women"
                  brand:
                    type: DICTIONARY_ENTRY
                    value: "Nike"
                variationAttributes:
                  - supplierSku:
                      type: STRING
                      value: "SUPPLIER_SKU_1"
                    productIdentifier:
                      type: STRING
                      value: "2000041459377"
              prices:
                - country: RU
                  price:
                    amount: 199900
                    currency: RUB
                  salePrice:
                    amount: 149900
                    currency: RUB
                  saleStart: "2025-06-01T00:00:00.000Z"
                  saleEnd: "2025-06-30T23:59:59.000Z"
      responses:
        "200":
          description: Результат создания/обновления товара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclatureStoreResponse'
              examples:
                success:
                  summary: Товар успешно создан
                  value:
                    storedNomenclatures:
                      - sku: "MP002XW0QCHCR360"
                        parentSku: "MP002XW0QCHCR"
                        externalSku: "SUPPLIER_SKU_1"
                    errors: [ ]
                    priceStatuses:
                      - country: RU
                        priceStatus:
                          code: OK
                validationError:
                  summary: Ошибки валидации атрибутов товара
                  value:
                    storedNomenclatures: [ ]
                    errors:
                      - index: 0
                        attribute: "brand"
                        message: "Значение атрибута brand не найдено в словаре"
                    priceStatuses: [ ]
                fraudRestriction:
                  summary: Товар создан, цена не обновлена из-за fraud-валидации
                  value:
                    storedNomenclatures:
                      - sku: "MP002XW0QCHCR360"
                        parentSku: "MP002XW0QCHCR"
                        externalSku: "SUPPLIER_SKU_1"
                    errors: [ ]
                    priceStatuses: [ ]
                    fraudValidationResult:
                      parentSku: "MP002XW0QCHCR"
                      invalidValue: "RED_PRICE"
                      status: "RESTRICTION"
                      promotions:
                        - promotionId: 15646
                          name: "promo restriction"
                          activeFrom: "2024-04-02T00:00:00.000Z"
                          activeTo: "2024-06-04T00:00:00.000Z"
                          discountPercent: 20
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "503":
          $ref: '#/components/responses/Response.503'

