  /v2/orders/{orderId}/item-statuses:
    get:
      tags:
        - Orders
      summary: Получить историю изменений статусов элементов заказа
      description: |
          Получение истории изменений статусов элементов заказа.
          Ответ сортирован - первичная сортировка по sku по возрастанию, вторичная - по createdAt по возрастанию. Элементы, у которых sku = null помещаются в конец.
          Требует обязательный `sellerId` для проверки прав доступа.

          Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_fbs/">Продажа со своего склада (FBS)</a>.
      operationId: v2.get.order.item-statuses
      parameters:
              - $ref: '#/components/parameters/OrderIdPath'
              - $ref: '#/components/parameters/SellerIdQuery'
              - $ref: '#/components/parameters/PageQuery'
              - $ref: '#/components/parameters/LimitQuery'
      responses:
        "200":
          description: Успешный ответ с историей изменений статусов элементов заказа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItemStatusesResponse"
              examples:
                success:
                  summary: Успешный ответ с историей изменений статусов элементов заказа
                  value:
                    statuses:
                      - sku: "MP002XG033BDCM5254"
                        externalSku: "4660207715631"
                        status:
                          code: "RETURN"
                          description: "Claimed ok"
                        createdAt: "2018-04-10T14:49:00Z"
                    meta:
                      total: 1
                      page: 1
                      limit: 100
                      totalPages: 1
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/nomenclature-price:
    post:
      tags:
        - Nomenclatures
      operationId: v2.post.nomenclature-price
      summary: Установка цены для товара
      description: |
        Обновление цены по SKU товара для указанной страны.
        Требует обязательный `sellerId` для проверки прав доступа.
        Суммы указываются в минорных единицах валюты (для RUB — копейки).

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomenclaturePricePostRequest'
            example:
              sellerId: "242541217"
              country: "RU"
              parentSku: "MP002XW0J7E6R"
              price:
                amount: 199900
                currency: "RUB"
              salePrice:
                amount: 149900
                currency: "RUB"
              saleStart: "2025-06-01T00:00:00.000Z"
              saleEnd: "2025-06-30T23:59:59.000Z"
              force: false
      responses:
        "200":
          description: Результат обновления цены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclaturePricePostResponse'
              examples:
                success:
                  summary: Цена успешно обновлена
                  value:
                    priceStatus:
                      code: "OK"
                successWithQuarantine:
                  summary: Цена обновлена, товар отправлен в карантин
                  value:
                    priceStatus:
                      code: "QUARANTINE"
                      details:
                        createdAt: "2025-09-24T12:53:50+03:00"
                        reason: "BLACK_PRICE_DIFF"
                        dropPercent: 70.1
                        newBlackPrice: 299
                        oldBlackPrice: 1000
                        thresholdPercent: 70
                fraudRestriction:
                  summary: Цена не обновлена из-за fraud-валидации (RESTRICTION)
                  value:
                    fraudValidationResult:
                      parentSku: "MP002XYZXCVBN"
                      invalidValue: "RED_PRICE"
                      status: "RESTRICTION"
                      promotions:
                        - promotionId: 15646
                          name: "promo restriction"
