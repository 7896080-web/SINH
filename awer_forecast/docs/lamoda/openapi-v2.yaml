        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Название категории товара
        path:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
          description: Путь категории товара (массив идентификаторов от корневой до текущей категории)
        allowedForNomenclatureTemplateGeneration:
          type: boolean
