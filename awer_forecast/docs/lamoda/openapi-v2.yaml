    OrderJewellerySpecificationCheckStatusEnum:
      type: string
      description: |
        Статус проверки ювелирной спецификации в ГИИС ДМДК:
        - `PENDING` - проверка сохранена, задача проверки еще не создана;
        - `CREATED` - задача проверки создана;
        - `IN_PROGRESS` - проверка выполняется;
        - `FINISHED` - проверка завершена;
        - `FAILED` - проверка не пройдена;
        - `PROCESSING_ERROR` - техническая ошибка обработки проверки.
      enum: [ PENDING, CREATED, IN_PROGRESS, FINISHED, FAILED, PROCESSING_ERROR ]
      example: "IN_PROGRESS"

    OrderJewellerySpecificationUinCheckStatusEnum:
      type: string
      description: |
        Статус проверки УИН в ГИИС ДМДК:
        - `IN_PROGRESS` - проверка выполняется;
        - `SUCCESS` - УИН успешно найден в спецификации;
        - `FAILED` - УИН не прошел проверку;
        - `NOT_FOUND` - УИН отсутствует в спецификации;
        - `PROCESSING_ERROR` - техническая ошибка обработки проверки.
      enum: [ IN_PROGRESS, SUCCESS, FAILED, NOT_FOUND, PROCESSING_ERROR ]
      example: "IN_PROGRESS"

