        saleEnd:
          type: string
          format: date-time
          description: Дата и время окончания скидки (ISO 8601 UTC с суффиксом Z). Отсутствует, если скидки нет.
          example: "2022-05-25T21:00:00.000Z"
        isRestricted:
          type: boolean
          description: |
            Ограничение на показ/экспорт на сайт.
        priceUpdateStatus:
          type: string
          enum: [ PROCESSING, ERROR, OK, QUARANTINE ]
          description: |
            Статус обработки цены.
            `PROCESSING` — в процессе обновления.
            `ERROR` — ошибка обновления.
            `OK` — актуальное состояние.
            `QUARANTINE` — цена на карантине, требуется подтверждение.
        restrictionUpdateStatus:
          type: string
          enum: [ PROCESSING, ERROR, OK, QUARANTINE ]
          description: |
            Статус обработки цены.
            `PROCESSING` — в процессе обновления.
            `ERROR` — ошибка обновления.
            `OK` — актуальное состояние.
        isNeedAutoConversion:
          type: boolean
          description: Требуется ли автоконвертация цены

    NomenclatureSellValueCurrencyRate:
      type: object
      additionalProperties: false
      required:
        - country
        - autoConversionRate
        - autoConvertedAt
        - price
      properties:
        country:
          $ref: '#/components/schemas/Country'
        autoConversionRate:
          type: string
          description: Курс автоконвертации
          example: "5.12164"
        autoConvertedAt:
          type: string
          format: date-time
          description: Дата и время фиксации курса автоконвертации
          example: "2024-06-13T22:00:44.000Z"
        price:
          $ref: '#/components/schemas/Price'
        salePrice:
          $ref: '#/components/schemas/Price'

    NomenclatureSellValuesResponse:
      type: object
      additionalProperties: false
      required:
        - nomenclatures
        - meta
      properties:
        nomenclatures:
          type: array
          items:
            $ref: '#/components/schemas/NomenclatureSellValuesListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    NomenclatureSellValuesListItem:
      type: object
      additionalProperties: false
      required:
        - parentSku
        - sku
        - quantity
        - partner
        - sellValues
        - sellValuesCurrencyRates
      properties:
        externalSku:
          type: string
          description: Размерный идентификатор товара продавца
        parentSku:
          type: string
          description: Идентификатор товара Lamoda
        sku:
          type: string
          description: Размерный идентификатор товара Lamoda
        externalParentSku:
          type: string
          description: Идентификатор товара продавца
        name:
          type: string
          description: Название товара
        quantity:
          type: integer
          description: Доступный остаток товара
        partner:
          $ref: '#/components/schemas/NomenclatureSellValuesPartner'
        sellValues:
          type: array
          description: Цены и ограничения по странам продажи
          items:
            $ref: '#/components/schemas/NomenclatureSellValue'
        sellValuesCurrencyRates:
          type: array
          description: Автоконвертация цен
          items:
            $ref: '#/components/schemas/NomenclatureSellValueCurrencyRate'

    QcModeration:
      type: object
      additionalProperties: false
      required:
        - stage
      properties:
        stage:
          type: string
          enum: [NONE, PRIMARY, SECONDARY]
          description: Этап модерации (PRIMARY - первичная, SECONDARY - вторичная модерация, NONE - отсутствует активная модерация)
        rejectReasons:
          type: array
          nullable: true
          description: Причины отказа
          items:
            type: string
        rejectComment:
          type: string
          nullable: true
          description: Комментарий к причине отказа

    PriceStatus:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          nullable: false
          enum: [ OK, ERROR, PROCESSING, QUARANTINE ]
          description: Статус обновления заказа (OK - цена в актуальном состоянии, ERROR - ошибка обновления цены, PROCESSING - цена в процессе обновления, QUARANTINE - цена попала на карантин, требуется подтверждение цены)
        details:
          $ref: '#/components/schemas/PriceDetails'

    PriceDetails:
      type: object
      nullable: true
      properties:
        reason:
          description: Причина попадания в карантин.
          type: string
          enum: [CURRENT_PRICE_DIFF, BLACK_PRICE_DIFF]
          nullable: false
        createdAt:
          description: Дата попадания изменения цены в карантин
          type: string
          format: date-time
          example: "2025-05-18T05:04:44.000Z"
          nullable: false
        dropPercent:
          description: Процент снижения цены, по сравнению с прошлым значением
          type: number
          format: float
          example: 70.1
          nullable: true
        thresholdPercent:
          description: Пороговый процент изменения цены, при превышении требуется подтверждение цены
          type: number
          format: float
          example: 70
          nullable: true
        newBlackPrice:
          description: Новая цена без скидки
          type: number
          example: 299
          nullable: true
        oldBlackPrice:
          description: Старая цена без скидки
          type: number
          example: 1000
          nullable: true
    NomenclatureStoreRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - nomenclature
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "471392924"
        country:
          $ref: '#/components/schemas/Country'
        nomenclature:
          $ref: '#/components/schemas/NomenclatureForStore'
        prices:
          type: array
          description: Список цен по странам продажи.
          items:
            $ref: '#/components/schemas/NomenclatureStorePriceInfo'

    NomenclatureForStore:
      type: object
      additionalProperties: false
      description: |
        Товар для сохранения или обновления
      required:
        - requestType
        - categoryId
        - attributes
        - variationAttributes
      properties:
        requestType:
          type: string
          nullable: false
          enum: [ CREATE, UPDATE ]
          description: |
            Тип операции над товаром.
            CREATE — создание нового товара.
            UPDATE — обновление существующего товара.
          example: CREATE
        categoryId:
          type: string
          nullable: false
          description: Идентификатор категории товара.
          example: "5637156660"
        attributes:
          type: object
          description: |
            Атрибуты товарной карточки (родительского товара).
            Ключ — код атрибута, значение — объект с типом и значением атрибута.
          additionalProperties:
            $ref: '#/components/schemas/NomenclatureAttributeValue'
        variationAttributes:
          type: array
          description: |
            Список атрибутов размерных вариаций товара. Каждый элемент массива описывает одну вариацию.
            Ключ — код атрибута, значение — объект с типом и значением атрибута.
          items:
            type: object
            description: Атрибуты одной вариации товара.
            additionalProperties:
              $ref: '#/components/schemas/NomenclatureAttributeValue'

    NomenclatureAttributeValue:
      type: object
      required:
        - value
        - type
      description: Значение атрибута товара.
      properties:
        type:
          type: string
          enum:
            - NUMBER
            - STRING
            - BOOLEAN
            - DICTIONARY_ENTRY
            - ARRAY_OF_DICTIONARY_ENTRY
            - LOCALIZED_STRING
          description: |
            Тип значения атрибута.
            Возможные значения:
            - `NUMBER` — число (целое или дробное)
            - `STRING` — строка
            - `BOOLEAN` — логическое значение (true/false)
            - `DICTIONARY_ENTRY` — значение из справочника (один элемент)
            - `ARRAY_OF_DICTIONARY_ENTRY` — список значений из справочника
            - `LOCALIZED_STRING` — локализованная строка
          example: STRING
        value:
          description: Значение атрибута.

    NomenclatureStorePriceInfo:
      type: object
      additionalProperties: false
      required:
        - country
        - price
      description: |
        Цена товара для указанной страны.
        Суммы указываются в минорных единицах валюты (для RUB — копейки, для BYN — копейки, для KZT — тиыны).
      properties:
        country:
          $ref: '#/components/schemas/Country'
        price:
          $ref: '#/components/schemas/Price'
        salePrice:
          $ref: '#/components/schemas/Price'
        saleStart:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата и время начала скидки (ISO 8601 UTC с суффиксом Z). `saleStart` устанавливается null при отсутствии скидки, либо при отсутствии ограничения на дату начала скидки.
        saleEnd:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата и время окончания скидки (ISO 8601 UTC с суффиксом Z). `saleEnd` устанавливается null при отсутствии скидки, либо при отсутствии ограничения на дату окончания скидки.

    NomenclatureStoreResponse:
      type: object
      additionalProperties: false
      required:
        - storedNomenclatures
        - errors
        - priceStatuses
      properties:
        storedNomenclatures:
          type: array
          description: Список сохранённых вариаций товара.
          items:
            $ref: '#/components/schemas/StoredNomenclature'
        errors:
          type: array
          description: Список ошибок валидации атрибутов товара. Пустой массив при отсутствии ошибок.
          items:
            $ref: '#/components/schemas/NomenclatureStoreError'
        fraudValidationResult:
          $ref: '#/components/schemas/FraudValidationResult'
        priceStatuses:
          type: array
          description: Статусы обновления цен по странам. Пустой массив если не передаются цены `prices` для установки цены.
          items:
            $ref: '#/components/schemas/NomenclatureStorePriceStatus'

    StoredNomenclature:
      type: object
      required:
        - sku
        - parentSku
        - externalSku
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Размерный идентификатор товара Lamoda.
          example: "MP002XW0QCHCR360"
        parentSku:
          type: string
          description: Родительский идентификатор товара Lamoda.
          example: "MP002XW0QCHCR"
        externalSku:
          type: string
          description: Размерный идентификатор товара продавца.
          example: "SUPPLIER_SKU_1"

    NomenclatureStoreError:
      type: object
      required:
        - index
        - message
      additionalProperties: false
      properties:
        index:
          type: integer
          description: |
            Индекс элемента в `variationAttributes`, к которому относится ошибка.
            Отсутствует если ошибка относится к родительским атрибутам (`attributes`).
          example: 0
        attribute:
          type: string
          description: Код атрибута, по которому возникла ошибка.
          example: "brand"
        message:
          type: string
          description: Текстовое описание ошибки.
          example: "Значение атрибута brand не найдено в словаре"

    NomenclatureStorePriceStatus:
      type: object
      additionalProperties: false
      required:
        - country
      description: Статус обновления цены для конкретной страны.
      properties:
        priceStatus:
          $ref: '#/components/schemas/PriceStatus'
        country:
          $ref: '#/components/schemas/Country'

    PromotionsListResponse:
      type: object
      additionalProperties: false
      required:
        - promotions
        - meta
      properties:
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/PromotionsListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PromotionsListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - activeFrom
        - activeTo
        - isRegistrationClosed
        - status
        - promotionVariants
        - addProductsFromDate
        - addProductsToDate
        - deleteProductsToDate
        - advantages
        - type
        - deletedAt
        - hasLamodaDiscount
        - segmentBlocks
        - isInAbExperiment
      properties:
        id:
          type: string
          nullable: true
          description: Базовый идентификатор акции
        name:
          type: string
          nullable: false
          description: Название акции, под которым сгруппированы вложенные варианты этой акции
        activeFrom:
          type: string
          format: date-time
          nullable: false
          description: Дата и время начала акции (включительно, в формате ISO 8601 UTC с суффиксом Z)
        activeTo:
          type: string
          format: date-time
          nullable: false
          description: Дата и время окончания акции (включительно, в формате ISO 8601 UTC с суффиксом Z)
        status:
          $ref: '#/components/schemas/PromotionStatusEnum'
        isRegistrationClosed:
          type: boolean
          nullable: false
          description: Флаг окончания регистрации товаров
        advantages:
          type: array
          nullable: false
          items:
            type: string
          description: Преимущества
        promotionVariants:
          type: array
          items:
            $ref: '#/components/schemas/PromotionsListPromotionVariant'
          description: Варианты акции, определяемые процентом скидки, ограничениями на добавляемые товары, и т.п.
        addProductsFromDate:
          type: string
          format: date
          nullable: false
          description: Дата начала добавления товаров
        addProductsToDate:
          type: string
          format: date
          nullable: false
          description: Дата окончания добавления товаров
        deleteProductsToDate:
          type: string
          format: date
          nullable: false
          description: Дата окончания удаления товаров
        type:
          $ref: '#/components/schemas/PromotionTypeEnum'
        deletedAt:
          type: string
          format: date
          nullable: true
          description: |
            Дата мягкого удаления акции
            Некоторое время после мягкого удаления акция доступна для отображения, но управление товарами в ней становится недоступным
        hasLamodaDiscount:
          type: boolean
          nullable: false
          description: Наличие дополнительной скидки от Lamoda
        segmentBlocks:
          type: array
          nullable: false
          description: Сегменты аудитории
          items:
            $ref: '#/components/schemas/PromotionSegmentBlock'
        isInAbExperiment:
          type: boolean
          nullable: false
          default: false
          description: Флаг участия акции в AB-эксперименте

    PromotionsListPromotionVariant:
      type: object
      additionalProperties: false
      required:
        - promotionVariantId
        - hasProducts
        - productMinPrice
        - discountAmount
        - advantages
        - gender
        - businessModels
        - categories
      properties:
        promotionVariantId:
          type: string
          nullable: false
          description: Идентификатор варианта акции
        hasProducts:
          type: boolean
          nullable: false
          description: Добавлены ли уже в акцию товары селлера
        productMinPrice:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Price'
          description: Минимальная цена товара
        discountAmount:
          type: integer
          nullable: false
          description: Размер скидки в процентах
        advantages:
          type: array
          nullable: false
          items:
            type: string
          description: Преимущества
        gender:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/GenderEnum'
          description: |
            Участвовать в акции могут только товары указанных gender
            Пустой массив означает что акция не имеет ограничений на gender
        businessModels:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/DictionariesBusinessModel'
        discountMinPercent:
          type: integer
          nullable: true
          minimum: 1
          maximum: 99
          description: |
            Минимальный процент скидки, который продавец может установить для данного варианта акции с гибкой скидкой
            Поле присутствует только для акций типа onsite_float
        discountMaxPercent:
          type: integer
          nullable: true
          minimum: 1
          maximum: 99
          description: |
            Максимальный процент скидки, который продавец может установить для данного варианта акции с гибкой скидкой
            Поле присутствует только для акций типа onsite_float
        categories:
          type: array
          nullable: false
          items:
            type: string
          description: |
            Участвовать в акции могут только товары указанных категорий
            Пустой массив означает что акция не имеет ограничений на категории

    PromotionSegmentBlock:
      type: object
      additionalProperties: false
      required:
        - startedAt
        - segments
      properties:
        startedAt:
          type: string
          format: date-time
          nullable: false
          description: Дата открытия сегментного блока в формате ISO 8601 UTC с суффиксом Z
        segments:
          type: array
          nullable: false
          description: Список сегментов внутри блока
          items:
            $ref: '#/components/schemas/PromotionSegmentItem'

    PromotionSegmentItem:
      type: object
      additionalProperties: false
      required:
        - title
        - ruTitle
      properties:
        title:
          type: string
          nullable: false
          description: Название сегмента (латиница)
        ruTitle:
          type: string
          nullable: false
          description: Название сегмента (кириллица)
        description:
          type: string
          nullable: true
          description: Описание сегмента

    PromotionStatusEnum:
      type: string
      nullable: false
      enum: [ IDLE, OPEN, PLANNED, ACTIVE, PASSED, FINISHED ]
      description: |
        Статус акции
        Возможные значения:
        - `IDLE` - акция создана, но ещё не открыта
        - `OPEN` - открыта для регистрации
        - `PLANNED` - запланирована
        - `ACTIVE` - активна
        - `PASSED` - завершена
        - `FINISHED` - полностью завершена

    PromotionTypeEnum:
      type: string
      nullable: false
      enum: [ ONSITE, ONSITE_FLOAT, COUPON ]
      description: |
        Тип акции
        Возможные значения:
        - `ONSITE` - стандартная onsite акция
        - `ONSITE_FLOAT` - onsite акция с плавающей скидкой
        - `COUPON` - акция с купоном

    PromotionsProductsListResponse:
      type: object
      additionalProperties: false
      required:
        - products
        - meta
      properties:
        products:
          type: array
          description: Массив товаров, участвующих в акции
          items:
            $ref: '#/components/schemas/PromotionsProductsListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PromotionsProductsListItem:
      type: object
      required:
        - name
        - parentSku
        - externalParentSku
        - brand
        - subCategoryName
        - blackPrice
        - redPrice
        - discountPercent
        - promocodePrice
        - productMinPrice
        - lamodaDiscountPercent
        - isLamodaDiscountPercentActive
        - country
        - promotionVariantId
      properties:
        name:
          type: string
          nullable: true
          description: "Наименование товара"
        parentSku:
          type: string
          nullable: false
          description: "Lamoda parent SKU"
        externalParentSku:
          type: string
          nullable: true
          description: "Seller parent SKU"
        brand:
          type: string
          nullable: false
          description: "Бренд"
        subCategoryName:
          type: string
          nullable: true
          description: "Наименование подкатегории"
        blackPrice:
          nullable: false
          description: "Цена"
          allOf:
            - $ref: '#/components/schemas/Price'
        redPrice:
          nullable: true
          description: "Цена со скидкой"
          allOf:
            - $ref: '#/components/schemas/Price'
        discountPercent:
          type: integer
          nullable: true
          description: "Процент скидки по акции"
        promocodePrice:
          nullable: false
          description: "Расчётная цена товара после применения скидки выбранной акции"
          allOf:
            - $ref: '#/components/schemas/Price'
        productMinPrice:
          nullable: true
          description: "Ограничение минимальной цены товара в копейках"
          allOf:
            - $ref: '#/components/schemas/Price'
        isLamodaDiscountPercentActive:
          type: boolean
          nullable: true
          description: "Действует ли в данный момент дополнительная скидка от Lamoda"
        lamodaDiscountPercent:
          type: integer
          nullable: true
          description: "Дополнительная скидка от Ламода"
        country:
          $ref: '#/components/schemas/Country'
        promotionVariantId:
          type: string
          nullable: true
          description: "ID варианта акции, в которую добавлен товар"

    PromotionVariantsAvailableProductsListResponse:
      type: object
      additionalProperties: false
      required:
        - availableProducts
        - meta
      properties:
        availableProducts:
          type: array
          description: Массив товаров, доступных для добавления в вариант акции
          items:
            $ref: '#/components/schemas/PromotionVariantsAvailableProductsListResponseItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PromotionVariantsAvailableProductsListResponseItem:
      type: object
      nullable: true
      required:
        - name
        - parentSku
        - externalParentSku
        - brand
        - subCategoryName
        - blackPrice
        - redPrice
        - discountPercent
        - promocodePrice
        - isFraudThresholdExceeded
        - recommendedBlackPrice
        - recommendedRedPrice
        - salePeriodStartedAt
        - salePeriodFinishedAt
        - salePeriodCoversPromoPeriod
        - country
      properties:
        name:
          type: string
          nullable: true
          description: "Наименование товара"
        parentSku:
          type: string
          nullable: false
          description: "Lamoda parent SKU"
        externalParentSku:
          type: string
          nullable: true
          description: "Seller parent SKU"
        brand:
          type: string
          nullable: false
          description: "Бренд"
        subCategoryName:
          type: string
          nullable: true
          description: "Наименование подкатегории"
        blackPrice:
          description: "Цена"
          allOf:
            - $ref: '#/components/schemas/Price'
        redPrice:
          nullable: true
          description: "Цена со скидкой"
          allOf:
            - $ref: '#/components/schemas/Price'
        discountPercent:
          type: integer
          nullable: true
          description: "Процент скидки по акции"
        promocodePrice:
          description: "Расчётная цена товара после применения скидки выбранной акции"
          allOf:
            - $ref: '#/components/schemas/Price'
        isFraudThresholdExceeded:
          type: boolean
          nullable: false
          description: |
            Признак того, что расчётная цена товара после применения скидки выбранной акции превышает антифрод-порог
            Значение false означает, что цена не превышает допустимый порог для добавления в вариант акции
            Значение true означает, что цена превышает допустимый порог для добавления в вариант акции
        recommendedBlackPrice:
          nullable: true
          description: |
            Рекомендуемая цена, позволяющая пройти антифрод-проверку для выбранной акции
            Заполняется только если превышен антифрод-порог и проблему нельзя решить изменением redPrice
          allOf:
            - $ref: '#/components/schemas/Price'
        recommendedRedPrice:
          nullable: true
          description: |
            Рекомендуемая цена со скидкой, позволяющая пройти антифрод-проверку для выбранной акции
            Заполняется только если превышен антифрод-порог
          allOf:
            - $ref: '#/components/schemas/Price'
        salePeriodStartedAt:
          type: string
          nullable: true
          format: date-time
          example: "2025-04-17T07:05:00Z"
          description: "Начало действия цены со скидкой (redPrice) в формате ISO 8601 UTC с суффиксом Z"
        salePeriodFinishedAt:
          type: string
          nullable: true
          format: date-time
          example: "2025-04-20T07:05:00Z"
          description: "Конец действия цены со скидкой (redPrice) в формате ISO 8601 UTC с суффиксом Z"
        salePeriodCoversPromoPeriod:
          type: string
          nullable: false
          enum: [ FULLY_COVERED, TIME_NOT_COVERED, DATES_NOT_COVERED ]
          description: |
            Как период красной цены перекрывает срок действия акции:
            FULLY_COVERED - период скидки полностью перекрывает период акции
            TIME_NOT_COVERED - период скидки перекрывает период акции, если не учитывать время в конечной дате периодов
            DATES_NOT_COVERED - период скидки не перекрывает период акции
            Если красная цена отсутствует, то значение будет FULLY_COVERED
        country:
          $ref: '#/components/schemas/Country'
        addedToAdjacentVariant:
          type: object
          nullable: true
          description: |
            Информация о другом варианте этой же акции в котором уже участвует товар.
            Заполняется если товар уже участвует в одном из других вариантов этой же акции.
            Товар может находиться только в одном варианте акции, поэтому
            перед добавлением товара в целевой вариант нужно удалить его из варианта, в котором он находится сейчас.
          required:
            - promotionVariantId
            - discountPercent
            - promocodePrice
          properties:
            promotionVariantId:
              type: string
              nullable: false
              description: "Идентификатор варианта акции"
            discountPercent:
              type: integer
              nullable: true
              description: "Процент скидки по акции"
            promocodePrice:
              description: "Расчётная цена товара после применения скидки выбранной акции"
              allOf:
                - $ref: '#/components/schemas/Price'
            lamodaDiscountPercent:
              type: integer
              nullable: true
              description: "Дополнительная скидка от Ламода"

