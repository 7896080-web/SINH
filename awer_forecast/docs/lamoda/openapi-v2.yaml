  /v2/gift-certificates:
    get:
      tags:
        - Gift Certificates
      summary: Получить список подарочных сертификатов
      description: |
        Возвращает сертификаты продавца с фильтрами и пагинацией.
        `sellerId` обязателен в query.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/additional/07_gift_certificates/">Подарочные сертификаты</a>.
      operationId: v2.get.giftCertificates
      parameters:
        - $ref: '#/components/parameters/SellerIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CreatedFromQuery'
        - $ref: '#/components/parameters/CreatedToQuery'
        - name: certificateId
          in: query
          description: Фильтр по коду сертификата.
          schema:
            type: string
        - name: paymentStatus
          in: query
          description: |
            Статус оплаты. Возможные значения:
              - `NEW` - Новый статус платежа
              - `PAID` - Оплата прошла успешно
              - `FAILED` - Ошибка при оплате
              - `RETURNED` - Платеж был возвращен
          schema:
            type: string
            enum: [ NEW, PAID, FAILED, RETURNED ]
        - name: processingStatus
          in: query
          description: |
            Статус сертификата. Возможные значения:
              - `NEW` - Новый
              - `ACTIVE` - Активирован
              - `SPENT` - Потрачен
              - `EXPIRED` - Истек срок действия
              - `BLOCKED` - Заблокирован
          schema:
            type: string
            enum: [ NEW, ACTIVE, SPENT, EXPIRED, BLOCKED ]
      responses:
        "200":
          description: Список сертификатов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCertificatesListResponse"
              examples:
                success:
                  summary: Успешный ответ со списком сертификатов
                  value:
                    certificates:
                      - id: "GC-1234567890"
                        activationCode: "ACT-987654"
                        price:
                          amount: 19990
                          currency: "RUB"
                        country: "RU"
                        expirationDate: "2024-05-28T09:12:00Z"
                        paymentStatus: "NEW"
                        processingStatus: "NEW"
                        createdAt: "2024-05-28T09:12:00Z"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '404':
          $ref: '#/components/responses/Response.404'
        '503':
          $ref: '#/components/responses/Response.503'
    post:
      tags:
        - Gift Certificates
      summary: Сгенерировать подарочные сертификаты
      description: |
        Генерация сертификатов указанного номинала и количества.
        `sellerId` обязателен в body. SellerId должен соответствовать JWT токену.

