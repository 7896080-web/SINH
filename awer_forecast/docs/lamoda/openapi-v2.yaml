            amount: 269000
            currency: "RUB"
        salePrice:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Цена товара со скидкой, установленной партнером (в копейках).
          example:
            amount: 249000
            currency: "RUB"
        paidPrice:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Цена продажи товара (в копейках).
          example:
            amount: 239000
            currency: "RUB"
        sellerAgreedPrice:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Цена товара, согласованная с продавцом (в копейках).
          example:
            amount: 230000
            currency: "RUB"
        couponDiscount:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Скидка по купону (в копейках).
          example:
            amount: 10000
            currency: "RUB"
        loyaltyDiscount:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Скидка по программе лояльности (в копейках).
          example:
            amount: 5000
            currency: "RUB"
        sellerAgreedDiscount:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Размер скидки, которую компенсирует продавец (в копейках).
          example:
            amount: 9000
            currency: "RUB"
        otherDiscounts:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Прочие скидки. Например, скидка за предоплату на сайте (в копейках).
          example:
            amount: 6000
            currency: "RUB"
        totalDiscount:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Сумма всех скидок, применённых к заказу, включая партнерскую скидку (в копейках).
          example:
            amount: 30000
            currency: "RUB"
        platformDiscounts:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: "Скидка платформы (в копейках). Расчетная часть общей скидки по товару: totalDiscount - (basePrice - salePrice) - couponDiscount - loyaltyDiscount - otherDiscounts."
          example:
            amount: 11000
            currency: "RUB"
        statusChangeReason:
          allOf:
            - $ref: '#/components/schemas/OrderDetailsItemStatusChangeReasonEnum'
          nullable: true
          description: Причина изменения статуса товара.
          example: "NOMENCLATURE_BY_SKU_NOT_FOUND"
        size:
          type: string
          nullable: true
          description: Размер товара.
          example: "42"
        status:
          $ref: '#/components/schemas/OrderItemResponseStatusEnum'
          description: Статус позиции заказа.
          example: "CONFIRMED"
        discrepancyAct:
          allOf:
            - $ref: '#/components/schemas/OrderDetailsItemDiscrepancyAct'
          nullable: true
          description: Акт расхождений по позиции.
          example:
