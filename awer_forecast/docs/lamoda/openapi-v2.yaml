      enum:
        - STORAGE_LIMIT_EXCEEDED
        - DELIVERY_ATTEMPTS_EXCEEDED
        - OUT_OF_DELIVERY_ZONE
        - REQUESTED_BY_CLIENT
        - DELIVERY_OVERDUE
        - CLIENT_UNREACHABLE
        - DELIVERY_DELAY

    OrderItemResponseStatusEnum:
      type: string
