    OrderDetailsItem:
      type: object
      additionalProperties: false
      required:
        - id
        - datamatrix
        - datamatrixCode
        - sku
        - externalSku
        - description
        - basePrice
        - salePrice
        - paidPrice
        - sellerAgreedPrice
        - couponDiscount
        - loyaltyDiscount
        - sellerAgreedDiscount
        - otherDiscounts
        - totalDiscount
        - platformDiscounts
        - statusChangeReason
