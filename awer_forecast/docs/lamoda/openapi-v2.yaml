      summary: Создать задачу добавления или отвязки разрешительных документов
      description: |
        Создаёт асинхронную задачу (job) на добавление разрешительных документов к товарам
        (`type: ADD`) или их отвязку (`type: REMOVE`).
        `sellerId` обязателен в body. SellerId должен соответствовать JWT токену.

        Для задач `type: REMOVE` связка идентифицируется полями:
        - `CERTIFICATE`, `DECLARATION`, `SGR_CERTIFICATE`, `CERTIFICATE_MEDICAL_DEVICE`: `sku` + `type` + `number` + `startDate` (обязательны); `endDate`, если передан, дополнительно уточняет поиск;
        - `DOCUMENT_NOT_REQUIRED`: `sku` + `type` + `noDocumentReason`.


        Повторный идентичный запрос (совпадают sellerId, type и items), отправленный пока
        такая же задача ещё не завершена (PENDING/EXECUTING), не создаёт новую задачу —
        в ответе вернётся jobId уже существующей. После завершения задачи такой же запрос
        создаст новую задачу; повторное применение того же пакета не изменяет итоговое
        состояние привязок.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/product_certificates/">Работа с разрешительными документами</a>.
      operationId: v2.post.productCertificates.jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCertificatesJobCreateRequest"
            examples:
              add:
                summary: Привязка декларации и отметка «документ не требуется»
                value:
                  sellerId: "12345"
                  type: "ADD"
                  items:
                    - sku: "MP002XW0000CR320"
                      type: "DECLARATION"
                      number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
                      startDate: "2025-01-01"
                      endDate: "2125-12-31"
                    - sku: "MP002XW0000CR330"
                      type: "DOCUMENT_NOT_REQUIRED"
                      noDocumentReason: 5
              remove:
                summary: Отвязка декларации от товара
                value:
                  sellerId: "12345"
                  type: "REMOVE"
                  items:
                    - sku: "MP002XW0000CR320"
                      type: "DECLARATION"
                      number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
                      startDate: "2025-01-01"
              removeDocumentNotRequired:
                summary: Отвязка отметки «документ не требуется»
                value:
                  sellerId: "12345"
                  type: "REMOVE"
                  items:
                    - sku: "MP002XW0000CR320"
                      type: "DOCUMENT_NOT_REQUIRED"
                      noDocumentReason: 5
      responses:
        "202":
          description: Задача принята в обработку
          headers:
            Location:
              description: |
                Путь для получения статуса задачи. При запросе добавьте обязательный
                query-параметр sellerId.
              schema:
                type: string
                example: /api/v2/product-certificates/jobs/7f3a2b1c-9d4e-4f5a-b1c2-d3e4f5a6b7c8
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCertificatesJobResponse"
              examples:
                success:
                  summary: Задача принята в обработку
                  value:
                    jobId: "7f3a2b1c-9d4e-4f5a-b1c2-d3e4f5a6b7c8"
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '404':
          $ref: '#/components/responses/Response.404'
        '503':
          $ref: '#/components/responses/Response.503'

    get:
