          $ref: '#/components/schemas/PaginationMeta'

    FBOShipmentSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - externalShipmentId
        - status
        - plannedDate
        - createdAt
        - statistics
      properties:
        id:
          type: string
          description: Lamoda code поставки (основной идентификатор в бизнес‑API).
          example: "MPG197447"
        externalShipmentId:
          type: string
          description: Пользовательский код поставки (значение `shipmentId` от партнёра).
          example: "SHP-2024-0001"
        status:
          $ref: '#/components/schemas/FBOShipmentStatusEnum'
        plannedDate:
          type: string
          format: date
          description: Дата поставки (ISO 8601, YYYY-MM-DD).
