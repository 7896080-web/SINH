openapi: 3.0.3
info:
  version: 1.0.0
  title: Lamoda Seller REST API
  description: External REST API for Lamoda Seller partners
servers:
  - url: https://public-api-seller.lamoda.ru/api
tags:
  - name: Авторизация
    description: Управление токеном авторизации.
  - name: Nomenclatures
    description: Управление товарами.
  - name: Categories
    description: Категории товаров.
  - name: Prices
    description: Цены и ограничения продажи.
  - name: Promotions
    description: Акции.
  - name: Orders
    description: Управление заказами.
  - name: FBO Shipments
    description: Управление поставками FBO.
  - name: FBO Stocks
    description: Управление остатками складов FBO.
  - name: FBS Stocks
    description: Управление остатками складов продавца (FBS).
  - name: FBS Shipments
    description: Управление отгрузками FBS.
  - name: FBS Returns
    description: Управление возвратами FBS.
  - name: FBS Transport Requests
    description: Управление транспортными заявками FBS.
  - name: FBS Warehouses
    description: Управление складами продавца (FBS).
  - name: FBS Labels
    description: Этикетки для товаров, упаковок и паллет.
  - name: Dictionaries
    description: Справочники
  - name: Gift Certificates
    description: Подарочные сертификаты.
  - name: Feedback Questions
    description: Управление вопросами от клиентов о товарах.
  - name: Product Certificates
    description: Работа с разрешительными документами.

security:
  - bearerToken: []
paths:
  /v2/auth-token:
    post:
      tags:
        - Авторизация
      summary: Получение токена
      description: |
        Получение авторизационного токена для работы с методами API c помощью ключей client_id и client_secret.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/intro/01_getting_started/">Начало работы и авторизация</a>.
      operationId: v2.tokens
      security: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokensCreateRequest'
            example:
              grant_type: "client_credentials"
              client_id: "4_872hjdfhgih3ufe9h"
              client_secret: "sdfhjxnmx898jxk0xf8fj"

      responses:
        "201":
          description: Успешное создание токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensCreateResponse'
              examples:
                success:
                  summary: Успешный ответ
                  value: { }
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'


  /v2/nomenclatures/{sku}/images:
    post:
      tags:
        - Nomenclatures
      summary: Обновить изображения товара
      description: |
        Запрос на установку изображений для указанного товара партнера.
        Возможно загрузить новое изображение, либо использовать существующее.
        Требует обязательный `sellerId` для проверки прав доступа.
        Доступна установка jpg и jpeg файлов размером не более 5 МБ.
        При нарушении требований к изображению возвращается ошибка валидации.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      operationId: v2.post.nomenclature.images
      parameters:
        - $ref: '#/components/parameters/SkuPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomenclatureImagesPostRequest'
            examples:
              upload:
                summary: Загрузка нового изображения
                value:
                  sellerId: "242541217"
                  images:
                    - index: 1
                      file: "/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLD"
              update:
                summary: Установка изображения товара из уже существующих изображений
                value:
                  sellerId: "242541217"
                  images:
                    - index: 1
                      imageId: "23821"
      responses:
        "200":
          description: Успешное обновление изображений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclatureImagesUpdateResponse'
              examples:
                success:
                  summary: Успешный ответ
                  value: { }
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/nomenclatures-prices:
    post:
      tags:
        - Nomenclatures
      operationId: v2.post.nomenclatures-prices
      summary: Массовая установка цен для товаров
      description: |
        Массовое обновление цен по родительским SKU для указанной страны.
        Требует обязательный `sellerId` для проверки прав доступа.
        Суммы указываются в минорных единицах валюты (для RUB — копейки).

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomenclaturesPricesPostRequest'
            example:
              sellerId: "242541217"
              country: "RU"
              prices:
                - parentSku: "MP002XW0QCHC"
                  price:
                    amount: 199900
                    currency: "RUB"
                  salePrice:
                    amount: 149900
                    currency: "RUB"
                  saleStart: "2025-06-01T00:00:00.000Z"
                  saleEnd: "2025-06-30T23:59:59.000Z"
                - parentSku: "MP002XW0ZJWM"
                  price:
                    amount: 299900
                    currency: "RUB"
                - parentSku: "MP002XW0ZJW1"
                  needAutoConversion: true
              force: false
      responses:
        "200":
          description: Результат обновления цен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclaturesPricesPostResponse'
              examples:
                success:
                  summary: Успешное обновление цен
                  value:
                    successCount: 3
                    errorCount: 0
                    errors: []
                    fraudValidationResults: []
                withErrors:
                  summary: Ответ с ошибками по части товаров
                  value:
                    successCount: 1
                    errorCount: 1
                    errors:
                      - sku: "MP002XW0ZJWM"
                        parentSku: "MP002XW0QCHC"
                        code: "VALIDATION_ERROR"
                        messages:
                          - "Validation error"
                    fraudValidationResults: []
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/nomenclature-categories:
    get:
      tags:
        - Categories
      operationId: v2.get.nomenclature-categories
      summary: Получить список категорий товаров
      description: |
        Возвращает список категорий товаров

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      security: []
      parameters:
        - name: X-No-Cache
          in: header
          description: Любое непустое значение отключает использование кеша при получении списка категорий.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        "200":
          description: Список категорий товаров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NomenclatureCategoriesListResponse"
              examples:
                success:
                  summary: Успешный ответ со списком категорий товаров
                  value:
                    data:
                      - categoryId: "5637156359"
                        name: "ACCESSORIES"
                        path:
                          - "5637153542"
                          - "5637156359"
                        allowedForNomenclatureTemplateGeneration: true
                        translationRu: "Аксессуары"
                      - categoryId: "5637156360"
                        name: "CLOTHES"
                        path:
                          - "5637153542"
                          - "5637156360"
                        allowedForNomenclatureTemplateGeneration: true
                        translationRu: "Одежда"
                    meta:
                      total: 3676
                      page: 1
                      limit: 2
                      totalPages: 1838
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/nomenclature-categories/{categoryId}/attributes:
    get:
      tags:
        - Nomenclatures
      operationId: v2.get.nomenclature-categories.attributes
      summary: Получить список атрибутов товара по категории
      description: |
        Возвращает список атрибутов товара для указанной категории.
        Требует обязательный `sellerId` для проверки прав доступа.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      parameters:
        - $ref: '#/components/parameters/CategoryIdPath'
        - $ref: '#/components/parameters/SellerIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        "200":
          description: Список атрибутов для указанной категории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclatureCategoryAttributesListResponse'
              examples:
                success:
                  summary: Успешный ответ со списком атрибутов
                  value:
                    data:
                      - code: "season_wear"
                        label: "Сезон ношения"
                        type: "DICTIONARY_ENTRY"
                        dictionary: "season_wear"
                        requiredForShipmentTypes: ["FBO", "FBS"]
                        requiredForGenders: ["MEN", "WOMEN"]
                        requiredForTemplates: ["FULL", "REDUCED"]
                        allowedForTemplates: ["FULL", "REDUCED"]
                        comment: ""
                        allowEditForSeller: true
                    meta:
                      total: 2
                      page: 1
                      limit: 1
                      totalPages: 2
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/orders:
    get:
      tags:
        - Orders
      summary: Получить список заказов
      description: |
        Возвращает список заказов.
        Требует обязательный `sellerId` для проверки прав доступа.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/intro/02_sync_and_events/">Синхронизация и события</a>.
      operationId: v2.get.orders
      parameters:
        - $ref: '#/components/parameters/SellerIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/OrderSortQuery'
        - $ref: '#/components/parameters/StatusGroupQuery'
        - $ref: '#/components/parameters/OrderIdQuery'
        - $ref: '#/components/parameters/ExternalOrderIdQuery'
        - $ref: '#/components/parameters/OrdersCountryQuery'
        - $ref: '#/components/parameters/HasDiscrepancyActsQuery'
        - $ref: '#/components/parameters/DeliveryDateQuery'
