          type: array
          description: Страница атрибутов товара для указанной категории
          items:
            $ref: '#/components/schemas/NomenclatureCategoryAttribute'
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NomenclatureCategoryAttribute:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - type
        - requiredForShipmentTypes
        - requiredForGenders
        - requiredForTemplates
        - allowedForTemplates
        - comment
        - allowEditForSeller
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 255
          description: Код атрибута
          example: "season_wear"
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Название атрибута
        type:
          type: string
          enum:
            - NUMBER
            - STRING
            - BOOLEAN
            - DICTIONARY_ENTRY
            - ARRAY_OF_DICTIONARY_ENTRY
            - LOCALIZED_STRING
            - PRODUCT_COMPOSITION
            - IMAGE_PATH
            - ARRAY_OF_IMAGE_PATH
            - ARRAY_OF_SKU
            - MIXED
          description: |
            Тип данных атрибута:
            - `NUMBER` — числовое значение
            - `STRING` — строковое значение
            - `BOOLEAN` — булевое значение
            - `DICTIONARY_ENTRY` — одно значение из справочника (см. `dictionary`)
            - `ARRAY_OF_DICTIONARY_ENTRY` — список значений из справочника (см. `dictionary`)
            - `LOCALIZED_STRING` — локализуемая строка
            - `PRODUCT_COMPOSITION` — состав продукта
            - `IMAGE_PATH` — путь изображения
            - `ARRAY_OF_IMAGE_PATH` — список путей к изображениям
            - `ARRAY_OF_SKU` — список идентификаторов товара
            - `MIXED` — смешанный тип атрибута
          example: DICTIONARY_ENTRY
        dictionary:
          type: string
          maxLength: 255
          description: Имя связанного справочника, возвращается для атрибутов типа `DICTIONARY_ENTRY` и `ARRAY_OF_DICTIONARY_ENTRY`
        requiredForShipmentTypes:
          type: array
          description: |
            Бизнес-модели, для которых атрибут обязателен.
          items:
            $ref: '#/components/schemas/DictionariesBusinessModel'
        requiredForGenders:
          type: array
          description: |
            Пол/возрастная группа, для которых атрибут обязателен.
          items:
            type: string
            enum:
              - BOYS
              - GIRLS
              - KIDS
              - MEN
              - WOMEN
              - UNISEX
            description: |
              - `BOYS` — мальчики
              - `GIRLS` — девочки
              - `KIDS` — дети
              - `MEN` — мужчины
              - `WOMEN` — женщины
              - `UNISEX` — унисекс
        requiredForTemplates:
          type: array
          description: Шаблоны создания товара, для которых атрибут обязателен к заполнению.
          items:
            $ref: '#/components/schemas/NomenclatureCategoryAttributeTemplateItem'
        allowedForTemplates:
          type: array
          description: Шаблоны создания товара, в которых атрибут доступен для заполнения.
          items:
            $ref: '#/components/schemas/NomenclatureCategoryAttributeTemplateItem'
        comment:
          type: string
          description: Комментарий к атрибуту
        allowEditForSeller:
          type: boolean
          description: Разрешено ли партнёру редактировать значение атрибута

    NomenclatureCategoryAttributeTemplateItem:
      type: string
      enum:
        - FULL
        - REDUCED
        - FULL_UPDATE
        - REDUCED_UPDATE
      description: |
        - `FULL` — заполнение всех атрибутов товара
        - `REDUCED` — заполнение части атрибутов для последующего описания товара в фотостудии
        - `FULL_UPDATE` — полное обновление товара
        - `REDUCED_UPDATE` — частичное обновление товара

    FBOShipmentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - externalShipmentId
        - warehouseCode
        - plannedDate
        - items
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
        warehouseCode:
          type: string
          description: |
            Код склада FBO.
            Возможные значения:
            - `BYKOVO` — склад Быково
            - `SOFINO` — склад Софино
        externalShipmentId:
          type: string
          description: Пользовательский код поставки.
          example: "SHP-2024-0001"
        documentNumber:
          type: string
          description: Номер сопроводительного документа (UUID).
          example: "1aa2706f-cacd-4040-b094-c5f9fd844b2b"
        plannedDate:
          type: string
          format: date
          description: Дата плановой поставки (ISO 8601, YYYY-MM-DD).
          example: "2024-05-30"
        items:
          type: array
          description: Список товаров в поставке.
          minItems: 1
          items:
            $ref: '#/components/schemas/FBOShipmentCreateItem'
        pallets:
          type: array
          description: Список паллет в поставке.
          items:
            $ref: '#/components/schemas/FBOShipmentCreatePallet'

    FBOShipmentCreateItem:
      type: object
      additionalProperties: false
      required:
        - externalSku
        - quantity
        - price
      properties:
        externalSku:
          type: string
          description: SKU продавца (sellerSku).
          example: "CSM02425/grey-S"
        quantity:
          type: integer
          minimum: 1
          description: Количество товара.
          example: 1
        price:
          $ref: '#/components/schemas/PriceAmount'
        ean:
          type: string
          nullable: true
          description: EAN код товара. Может быть null.
          example: "4670245370334"
        markingCodes:
          type: array
          nullable: true
          description: Список кодов маркировки. Может быть null.
          items:
            type: string

    FBOShipmentCreatePallet:
      type: object
      additionalProperties: false
      properties:
        palletCode:
          type: string
          description: Код паллеты.
          example: "PALLET-1"

    FBOShipmentCreateResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - externalShipmentId
        - plannedDate
      properties:
        id:
          type: string
          description: Lamoda code созданной поставки
          example: "MPG197447"
        externalShipmentId:
          type: string
          description: Пользовательский код поставки
          example: "SHP-2024-0001"
        plannedDate:
          type: string
          format: date
          description: Дата поставки (ISO 8601, YYYY-MM-DD).
          example: "2024-10-14"

    FBOShipmentListResponse:
      type: object
      additionalProperties: false
      required:
        - shipments
