        id:
          type: string
          description: Идентификатор позиции заказа.
          example: "IX432-001"
        datamatrix:
          type: string
          nullable: true
          description: UIT. 31 или 38 символов (c ТНВЭД)
          example: "010290000002492231Qz%=?!1w??K-H"
        datamatrixCode:
          type: string
          nullable: true
          description: Полный код маркировки товара.
          example: "0100100101337433215cFxinJ)cpmQs91EE1092C7CLq8p+S2ddhQvInUrYFy6DVvq9tfSW3ZCC/xy5Tfg="
        sku:
          type: string
          description: SKU товара в Lamoda.
          example: "MP002XW1CELUR520"
        externalSku:
          type: string
          description: SKU товара в системе продавца.
          example: "RS-ND1920432"
        description:
          type: string
          description: Описание товара.
          example: "Кроссовки"
        basePrice:
          allOf:
            - $ref: '#/components/schemas/Price'
          nullable: true
          description: Цена товара без скидки (в копейках).
