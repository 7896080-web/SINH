              - REDUCED_UPDATE
            description: |
              - `FULL` — заполнение всех атрибутов товара
              - `REDUCED` — заполнение части атрибутов для последующего описания товара в фотостудии
              - `FULL_UPDATE` — полное обновление товара
              - `REDUCED_UPDATE` — частичное обновление товара
        allowedForTemplates:
          type: array
          description: Шаблоны создания товара, в которых атрибут доступен для заполнения.
