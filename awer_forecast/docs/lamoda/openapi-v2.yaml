      properties:
        url:
          type: string
          description: Ссылка на скачивание накладной заказа в формате PDF.
          example: "https://storage.yandexcloud.net/documents-folder/filename.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=value&X-Amz-Date=20260319T101053Z&X-Amz-Expires=136146&X-Amz-SignedHeaders=host&x-id=GetObject&X-Amz-Signature=value"

    FBOShipmentStatusEnum:
      type: string
      description: |
        Статус поставки.
        Возможные значения:
        - `NEW` — новая
        - `SENT` — отправлена
        - `CONFIRMED` — подтверждена
        - `DRAFT` — черновик
        - `CANCELLED` — отменено
        - `CHANGING_WAREHOUSE` — перевод на другой склад
        - `VALIDATION` — проверка
        - `VALIDATION_ERROR` — ошибка проверки
        - `READY_FOR_SHIPMENT` — готова к отгрузке
        - `UNLOADING_NEEDED` — требуется разгрузка
        - `UNLOADING` — разгрузка
        - `UNLOADED` — разгружена
        - `PROCESSING` — обработка
        - `CLOSED` — закрыта
        - `REJECTED` — отклонена
        - `RECEIVED` — получено
        - `CANCEL_PENDING` — ожидание отмены
      enum:
        - NEW
        - SENT
        - CONFIRMED
        - DRAFT
        - CANCELLED
        - CHANGING_WAREHOUSE
        - VALIDATION
        - VALIDATION_ERROR
        - READY_FOR_SHIPMENT
        - UNLOADING_NEEDED
        - UNLOADING
        - UNLOADED
        - PROCESSING
        - CLOSED
        - REJECTED
        - RECEIVED
        - CANCEL_PENDING

    FBOShipment:
      type: object
      additionalProperties: false
      required:
        - id
        - externalShipmentId
        - status
        - sellerId
        - plannedDate
        - createdAt
        - priceSum
        - statistics
        - warehouseCode
      properties:
        id:
          type: string
          description: Lamoda code поставки (основной идентификатор в бизнес‑API).
          example: "MPG197447"
        externalShipmentId:
          type: string
          description: Пользовательский код поставки (значение `shipmentId` от партнёра).
          example: "SHP-2024-0001"
        status:
          $ref: '#/components/schemas/FBOShipmentStatusEnum'
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "1"
        plannedDate:
          type: string
          format: date
          description: Дата поставки (ISO 8601, YYYY-MM-DD).
          example: "2024-10-14"
        createdAt:
          type: string
          format: date-time
          description: Дата и время создания поставки (UTC, ISO 8601).
          example: "2018-04-10T00:00:00Z"
        priceSum:
          $ref: '#/components/schemas/PriceAmount'
        statistics:
          $ref: '#/components/schemas/FBOShipmentStatistics'
        warehouseCode:
          type: string
          nullable: true
          description: |
            Код склада FBO.
            Возможные значения:
            - `BYKOVO` — склад Быково
            - `SOFINO` — склад Софино

    OrderStatusEnum:
      type: string
      description: Статус заказа или товара в заказе.
      enum:
        - READY_FOR_SHIPMENT
        - SHIPPED
        - NOT_DELIVERED
        - DELIVERED
        - RETURNED
        - CANCELED

    OrderResponseStatusEnum:
      type: string
      description:  |
        Статус заказа.
        Возможные значения:
        - `NEW` — Новый
        - `NEW_TO_BE_CONFIRMED` — Ожидает подтверждения
        - `CONFIRMED` — Подтвержден
        - `IN_DELIVERY` — В доставке
        - `REJECTED` — Не выкуплен
        - `CANCELED` — Отменен
        - `DELIVERED` — Доставлен
        - `SENT_BACK_TO_PARTNER` - Отправлен партнеру
        - `ARRIVED_TO_LME` - Прибыл на склад LM Express
        - `LEFT_LME` - Отправлен из склада LM Express
        - `DELIVERY_INCIDENCE` - Требует уточнения
        - `POSTPONED` - Перенесен
        - `TRANSPORT_INCIDENCE` - Не успели доставить
        - `NOT_DELIVERED` - Не доставлен
        - `FAILED_DELIVERY` - Доставка не удалась
        - `RETURNED` - Возвращен на склад
        - `CLAIMED` - Поступил на склад для проверки
        - `CLAIMED_DEFECTIVE` - Принят к возврату как брак
        - `CLAIMED_OK` - Принят к возврату
        - `CLAIMED_USED` - Не подлежит возврату как использованный
        - `READY_FOR_SHIPMENT` - Готов к отгрузке
        - `GIVEN_TO_DELIVERY` - Передан в службу доставки
        - `SHIPPED` - Отправлен со склада
        - `ON_SHELF` - Прибыл в пункт выдачи заказов
        - `SHIPPED_TO_WH` - Отправлен на основной склад
        - `ARRIVED_TO_WH` - Прибыл на основной склад
        - `AWAITING_SHIPMENT` - Ждет отгрузки
      enum:
        - NEW
        - NEW_TO_BE_CONFIRMED
        - CONFIRMED
        - IN_DELIVERY
        - REJECTED
        - CANCELED
        - DELIVERED
        - SENT_BACK_TO_PARTNER
        - ARRIVED_TO_LME
        - LEFT_LME
        - DELIVERY_INCIDENCE
        - POSTPONED
        - TRANSPORT_INCIDENCE
        - NOT_DELIVERED
        - FAILED_DELIVERY
        - RETURNED
        - CLAIMED
        - CLAIMED_DEFECTIVE
        - CLAIMED_OK
        - CLAIMED_USED
        - READY_FOR_SHIPMENT
        - GIVEN_TO_DELIVERY
        - SHIPPED
        - ON_SHELF
        - SHIPPED_TO_WH
        - ARRIVED_TO_WH
        - AWAITING_SHIPMENT

    OrdersListPaymentStatusEnum:
      type: string
