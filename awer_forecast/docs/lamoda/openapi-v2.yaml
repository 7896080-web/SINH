  /v2/fbs/dropoff-requests:
    post:
      tags:
        - FBS Transport Requests
      description: |
        Создание заявки drop-off и передача данных транспортного пропуска.

        Если обязательные данные для формирования ЭТрН заполнены не полностью,
        заявка создается в статусе NEW, иначе в статусе ACTIVE.

        `sellerId` обязателен в body и должен соответствовать JWT токену.
        Для `requestType=DELIVERY` список `shipmentIds` должен быть непустым.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_1_fbs_transport_requests/">Заявки на транспорт (FBS)</a>.
      operationId: v2.post.fbs.dropoffRequest
      summary: Создать заявку drop-off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDropoffRequest'
            example:
              sellerId: "242541217"
              warehouseId: "6f29cd46-bb6f-4d14-9d35-b1dc2a34588f"
              shipmentIds:
                - "IAP0000001"
              date: "2030-03-21"
              thirdPartyCarrierInvolvement: "INVOLVED"
              etrnSignedByExpeditor: true
              requestType: "DELIVERY"
              shipperType: "OWN"
              linkedRequestOption: "WITH_RETURN"
              couriers:
                - firstName: "Ivan"
                  lastName: "Ivanov"
                  middleName: "Ivanovich"
                  phoneNumber: "+79990000000"
              vehicle:
                licensePlate: "A001AA77"
                brand: "Ford"
      responses:
        "200":
          description: Заявка успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDropoffRequestResult'
              example:
                id: "e192af71-f2f0-4c55-9b72-bb4573d94aa1"
                status: "ACTIVE"
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "429":
          $ref: '#/components/responses/Response.429'
        "503":
          $ref: '#/components/responses/Response.503'

  /v2/fbs/dropoff-requests/{requestId}:
    post:
      tags:
        - FBS Transport Requests
      description: |
        Редактирование заявки drop-off и данных транспортного пропуска.

        `sellerId` обязателен в body и должен соответствовать JWT токену.
        `date` обязателен и всегда применяется к заявке.

        Запрос задает новое целевое состояние данных транспортного пропуска,
        а не частичный patch. Не переданные необязательные поля данных
        транспортного пропуска считаются незаполненными. Не переданные
        `documents`, `couriers`, `companies` и явно переданные пустые массивы
        обновляют соответствующие списки на пустые. Не переданный `vehicle`
        означает отсутствие данных транспортного средства. `etrnSignedByExpeditor: null`
        обрабатывается как незаполненное значение.

        Если после применения payload обязательные данные для формирования ЭТрН
        заполнены не полностью, NEW-заявка остается в статусе NEW. ACTIVE-заявка
        не может стать неполной: WDM вернет ошибку валидации.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/fbs/04_1_fbs_transport_requests/">Заявки на транспорт (FBS)</a>.
      operationId: v2.post.fbs.dropoffRequest.update
      summary: Редактировать заявку drop-off
      parameters:
        - $ref: '#/components/parameters/DropoffRequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropoffRequestUpdateRequest'
            example:
              sellerId: "242541217"
              date: "2030-03-21"
              thirdPartyCarrierInvolvement: "INVOLVED"
              etrnSignedByExpeditor: true
              shipperType: "OWN"
              linkedRequestAction: "UNLINK"
              documents:
                - type: "SELLER_EXPEDITOR_CONTRACT"
                  number: "DOC-1"
                  date: "2030-03-01"
              couriers:
                - firstName: "Ivan"
                  lastName: "Ivanov"
                  middleName: "Ivanovich"
                  phoneNumber: "+79990000000"
                  documentSeries: "1234"
                  documentNumber: "567890"
                  documentDate: "2020-01-01"
                  documentIssuer: "GIBDD"
              vehicle:
                licensePlate: "A001AA77"
                brand: "Ford"
                loadCapacity: 20.07
                volume: 82.5
                ownershipType: "RENT"
                transportContract:
                  number: "TC-1"
                  date: "2030-02-01"
                  partyInn: "7701234567"
              companies:
                - type: "CARRIER"
                  inn: "7701234567"
                  name: "ООО Перевозчик"
                  email: "carrier@example.com"
                  phoneNumber: "+79991111111"
      responses:
        "200":
          description: Заявка успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropoffRequestUpdateResponse'
              example:
                id: "e192af71-f2f0-4c55-9b72-bb4573d94aa1"
                status: "ACTIVE"
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

