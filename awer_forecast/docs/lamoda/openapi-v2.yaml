  /v2/nomenclatures-activation-status:
    post:
      tags:
        - Nomenclatures
      summary: Установить статус продажи товаров
      description: |
          Запрос на активацию или деактивацию продажи товаров партнера по указанным идентификаторам товара.
          Требует обязательный `sellerId` для проверки прав доступа.
          В теле ответа возвращается пустой объект при успешном обновлении статуса активации всех указанных товаров.
          Для товаров, для которых не удалось обновить статус активации, возвращается подробная информация об ошибке.

          Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/03_catalog_prices/">Каталог: карточки товаров и цены</a>.
      operationId: v2.post.nomenclatures-activation-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomenclaturesActivationStatusRequest'
            examples:
              fullWithSkus:
                summary: Пример запроса на установку статуса продажи товаров по размерным идентификаторам товаров
                value:
                  sellerId: "12345"
                  status: true
                  country: "RU"
                  skus: [ "MP1291831MX1", "MP1224531MX2", "MP2321814MX3" ]
              fullWithExternalSkus:
                summary: Пример запроса на установку статуса продажи товаров по размерным идентификаторам товара селлера
                value:
                  sellerId: "12345"
                  status: true
                  country: "RU"
                  externalSkus: [ "4660207715631", "4660207715632", "4660207715633" ]
      responses:
        "200":
          description: |
            Возвращается пустой объект при успешном обновлении статуса активации всех указанных товаров.
            Для товаров, для которых не удалось обновить статус активации, возвращается подробная информация об ошибке.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomenclaturesActivationStatusResponse'
              examples:
                success:
                  summary: Успешный ответ без ошибок
                  value: { }
                with_errors:
                  summary: Ответ с ошибкой поиска товара
                  value:
                    errors:
                      - sku: "MP002XW1CJV9R360"
                        code: 400
                        messages:
                          - "Товар не найден"
        "400":
          $ref: '#/components/responses/Response.400'
        "401":
          $ref: '#/components/responses/Response.401'
        "403":
          $ref: '#/components/responses/Response.403'
        "404":
          $ref: '#/components/responses/Response.404'
        "503":
          $ref: '#/components/responses/Response.503'

