        - `STORE` - Магазин
        - `POST` - Почта России
        - `PICKUP` - ПВЗ / постаматы
        - `DELIVERY_SERVICE` - Курьерская доставка
      enum:
        - STORE
        - POST
        - PICKUP
        - DELIVERY_SERVICE

    OrdersStatusRequest:
      type: object
      required:
        - sellerId
        - status
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        reason:
          type: string
          description: Причина смены статуса. Обязательна для CANCELED и NOT_DELIVERED.
          example: "Товар не прошёл проверку качества"

    OrderItemStatusRequest:
      type: object
      required:
        - sellerId
        - status
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        reason:
          type: string
          description: Причина смены статуса. Обязательна для CANCELED и NOT_DELIVERED.
          example: "Отмена по инициативе клиента"

    OrderAssemblyRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - packs
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        giisSpecId:
          type: string
          nullable: true
          maxLength: 255
          description: Идентификатор спецификации ГИИС. Может быть null, если спецификация не передана.
          example: "T-00-21-000000037"
        giisUins:
          type: array
          description: Список УИН ювелирных изделий.
          items:
            $ref: '#/components/schemas/OrderAssemblyGiisUin'
        packs:
          type: array
          description: Список паков.
          items:
            $ref: '#/components/schemas/OrderAssemblyPack'

    OrderAssemblyGiisUin:
      type: object
      additionalProperties: false
      required:
        - itemId
        - giisUin
      properties:
        itemId:
          type: string
          minLength: 1
          maxLength: 255
          description: Идентификатор позиции заказа.
          example: "ITEM-001"
        giisUin:
          type: string
          pattern: "^[0-9]{16}$"
          description: Уникальный идентификационный номер ювелирного изделия.
          example: "6432200962734116"

    OrderAssemblyPack:
      type: object
      additionalProperties: false
      required:
        - itemIds
      properties:
        itemIds:
          type: array
          description: Список идентификаторов позиций заказа.
          items:
            type: string
          example:
            - "ITEM-001"

    FBOShipmentStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - createdAt
      properties:
        status:
          $ref: '#/components/schemas/FBOShipmentStatusEnum'
        createdAt:
          type: string
          format: date-time
          description: Дата и время изменения статуса (UTC, ISO 8601).
          example: "2018-04-10T00:00:00Z"

    FBOShipmentStatusHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          description: История изменения статусов поставки.
          items:
            $ref: '#/components/schemas/FBOShipmentStatus'

    FBOShipmentItem:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - quantityPlanned
      properties:
        id:
          type: string
          description: Идентификатор товара в поставке (из partner `id`).
          example: "35814457"
        sku:
          type: string
          description: Lamoda SKU товара.
          example: "MP002XW0ZJWMR4042"
        ean:
          type: string
          nullable: true
          description: EAN код товара. Может быть null.
          example: "4670245370334"
        name:
          type: string
          nullable: true
          description: Наименование товара. Может быть null.
          example: "Костюм спортивный"
        quantityPlanned:
          type: integer
          description: Количество к поставке (из partner quantity).
          example: 1
        quantityAccepted:
          type: integer
          description: Количество принято.
          example: 1
        quantityReceived:
          type: integer
          description: Количество полученных.
          example: 0
        quantityMissing:
          type: integer
          description: Количество недостачи.
          example: 0
        quantitySurplus:
          type: integer
          description: Количество излишков.
          example: 0
        quantityDamaged:
          type: integer
          description: Количество брака.
          example: 0
        price:
          $ref: '#/components/schemas/PriceAmount'

    FBOShipmentItemsResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: Страница товаров поставки.
          items:
            $ref: '#/components/schemas/FBOShipmentItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PriceAmount:
      type: object
      additionalProperties: false
      required: [ amount, currency ]
      properties:
        amount:
          type: integer
          description: Сумма в минорных единицах (копейки). Точность — 2 знака. Правило округления — bankers (half-even).
          example: 19990
        currency:
          $ref: '#/components/schemas/Currency'

    Currency:
      type: string
      description: |
        Валюта по стандарту ISO 4217.
        Возможные значения:
          - `RUB` - Российский рубль
          - `BYN` - Белорусский рубль
          - `KZT` - Казахстанский тенге
      enum: [ RUB, BYN, KZT ]
      example: "RUB"

    GiftCertificatesListResponse:
      type: object
      additionalProperties: false
      required:
        - certificates
      properties:
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/GiftCertificatesSummary'

    ProductCertificateType:
      type: string
      description: |
        Тип разрешительного документа.
          - `CERTIFICATE` - сертификат соответствия
          - `DECLARATION` - декларация о соответствии
          - `DOCUMENT_NOT_REQUIRED` - документ не требуется
          - `SGR_CERTIFICATE` - свидетельство о государственной регистрации (СГР)
          - `CERTIFICATE_MEDICAL_DEVICE` - Регистрационное удостоверение на медицинское изделие
      enum: [ CERTIFICATE, DECLARATION, DOCUMENT_NOT_REQUIRED, SGR_CERTIFICATE, CERTIFICATE_MEDICAL_DEVICE ]

    ProductCertificatesJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - type
        - items
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
        type:
          $ref: '#/components/schemas/ProductCertificatesJobType'
        items:
          type: array
          description: Список позиций. От 1 до 1000 элементов.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProductCertificateJobItem'

    ProductCertificatesJobType:
      type: string
      description: |
        Тип задачи.
          - `ADD` - добавить разрешительные документы и привязать к товарам
          - `REMOVE` - отвязать разрешительные документы от товаров
      enum: [ ADD, REMOVE ]

    ProductCertificatesJobStatus:
      type: string
      description: |
        Статус задачи.
          - `PENDING` - ожидает обработки
          - `EXECUTING` - обрабатывается
          - `DONE` - завершена
          - `FAILED` - завершена с системной ошибкой
      enum: [ DONE, FAILED, PENDING, EXECUTING ]

    ProductCertificateJobItem:
      type: object
      additionalProperties: false
      required:
        - sku
        - type
      properties:
        sku:
          type: string
          description: SKU товара в Lamoda (размерный).
          example: "MP002XW0000CR320"
        type:
          $ref: '#/components/schemas/ProductCertificateType'
        number:
          type: string
          nullable: true
          description: Номер документа. Обязателен для типов CERTIFICATE, DECLARATION, SGR_CERTIFICATE и CERTIFICATE_MEDICAL_DEVICE.
          example: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
        startDate:
          type: string
          format: date
          nullable: true
          description: Дата начала действия. Обязательна для типов CERTIFICATE, DECLARATION, SGR_CERTIFICATE и CERTIFICATE_MEDICAL_DEVICE.
          example: "2025-01-01"
        endDate:
          type: string
          format: date
          nullable: true
          description: Дата окончания действия. Не указана — документ бессрочный.
          example: "2125-12-31"
        noDocumentReason:
          type: integer
          nullable: true
          enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
          description: |
            Идентификатор причины отсутствия документа. Обязателен для типа DOCUMENT_NOT_REQUIRED —
            и в задачах type=ADD, и в задачах type=REMOVE (при отвязке укажите ту же причину, что была при привязке).
            Значения:
            - `1` — Продукция, в отношении которой не распространяются действующие ТР ТС (ТР ЕЭАС) и прочие НПА
            - `2` — Детская спортивная обувь
            - `3` — Детская спортивная одежда, использующаяся при организации детских тренировок и спортивных соревнований
            - `4` — Одежда и обувь, СИЗ, используемые для снижения рисков производственной среды, не вошедшие в ТР ТС 019/2011
            - `5` — Аксессуары и предметы одежды, не являющиеся СИЗ, в отношении которых не распространяется ТР ТС 017/2011 и ТР ТС 007/2011
            - `6` — Изделия и аксессуары из материалов, в отношении которых отсутствует методика испытаний
            - `7` — Изделия, в отношении которых не распространяется действие ТР ТС 009/2011, постановление РФ 2425 от 23.12.2021, решение комиссии ТС 299 от 28.05.2011 и прочие действующие НПА
            - `8` — Игрушки, предназначенные для пользователей старше 14 лет
            - `9` — Игрушки, включенные в приложение N 1 ТР ТС 008/2011

    ProductCertificatesJobResponse:
      type: object
      additionalProperties: false
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
          description: Идентификатор созданной задачи импорта.
          example: "7f3a2b1c-9d4e-4f5a-b1c2-d3e4f5a6b7c8"

    ProductCertificatesJobStatusResponse:
      type: object
      additionalProperties: false
      required:
        - jobId
        - type
        - status
        - importErrors
        - meta
      properties:
        jobId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ProductCertificatesJobType'
        status:
          $ref: '#/components/schemas/ProductCertificatesJobStatus'
        totalItems:
          type: integer
          nullable: true
          description: Общее количество строк в задаче.
        failedItems:
          type: integer
          nullable: true
          description: Количество строк с ошибками.
        error:
          type: object
          nullable: true
          additionalProperties: false
          description: Системная ошибка задачи. Заполнена только при status=FAILED.
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum: [ INTERNAL ]
            message:
              type: string
        importErrors:
          type: array
          description: Страница построчных ошибок обработки.
          items:
            $ref: '#/components/schemas/ProductCertificateRowError'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProductCertificateRowError:
      type: object
      additionalProperties: false
      required:
        - rowIndex
        - code
        - message
      properties:
        rowIndex:
          type: integer
          description: Порядковый номер строки во входном массиве items (с 0).
        sku:
          type: string
          nullable: true
          description: SKU товара в Lamoda (размерный).
        number:
          type: string
          nullable: true
        code:
          type: string
          description: |
            Доменный код построчной ошибки.
              - `SKU_PARTNER_MISMATCH` - SKU не соответствует продавцу
              - `MISSING_REQUIRED_FIELD` - не заполнено обязательное поле
              - `INVALID_NO_DOCUMENT_REASON` - недопустимое noDocumentReason
              - `INVALID_END_DATE` - дата окончания раньше даты начала
              - `UNEXPECTED_FIELD_FOR_TYPE` - поле недопустимо для данного type
              - `DOWNSTREAM_ERROR` - ошибка при сохранении на стороне сервиса Разрешительных документов
          enum:
            - SKU_PARTNER_MISMATCH
            - MISSING_REQUIRED_FIELD
            - INVALID_NO_DOCUMENT_REASON
            - INVALID_END_DATE
            - UNEXPECTED_FIELD_FOR_TYPE
            - DOWNSTREAM_ERROR
        message:
          type: string

    ProductCertificatesJobsListResponse:
      type: object
      additionalProperties: false
      required:
