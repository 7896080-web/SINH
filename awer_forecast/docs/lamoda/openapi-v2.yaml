        - BY
        - KZ

    NomenclaturesPricesPostRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - country
        - prices
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        country:
          $ref: '#/components/schemas/Country'
        prices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NomenclaturesPricesPostRequestItem'
          description: Список цен, устанавливаемых по родительским идентификаторам товаров
        force:
          type: boolean
          description: |
            Флаг принудительного изменения цены при ошибке валидации акционных цен.
            При force=true товар будет удалён из акции по причине несоответствия условиям акции.
            Принудительно обновление цены возможно только в случае, если нарушение акционной цены имеет статус `WARNING`.
            В случае, если нарушение акционной цены имеет статус `RESTRICTION`, принудительное обновление цены невозможно.

    NomenclaturePricePostRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - country
        - parentSku
        - price
      description: |
        `price` - цена без скидки. Поле обязательно для включенной страны, в том числе при передаче скидочной цены.
        `salePrice` - цена со скидкой. Для установки скидки нужно передать все обязательные поля, а также `salePrice`, `saleStart` и `saleEnd`.
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца.
          example: "242541217"
        country:
          $ref: '#/components/schemas/Country'
        parentSku:
          type: string
          description: Родительский идентификатор товара Lamoda.
          example: 'MP002XW0J7E6R'
        price:
          $ref: '#/components/schemas/Price'
        salePrice:
          $ref: '#/components/schemas/Price'
        saleStart:
          type: string
          format: date-time
          description: |
            Дата и время начала скидки (ISO 8601 UTC с суффиксом Z).
        saleEnd:
          type: string
          format: date-time
          description: |
            Дата и время окончания скидки (ISO 8601 UTC с суффиксом Z).
        force:
          type: boolean
          description: |
            Флаг принудительного изменения цены при ошибке валидации акционных цен.
            При force=true товар будет удалён из акции по причине несоответствия условиям акции.
            Принудительно обновление цены возможно только в случае, если нарушение акционной цены имеет статус `WARNING`.
            В случае, если нарушение акционной цены имеет статус `RESTRICTION`, принудительное обновление цены невозможно.
          example: false

    NomenclaturesPricesPostRequestItem:
      type: object
      additionalProperties: false
      description: |
        `price` - цена без скидки. Для автоконвертации цены необходимо передать только `needAutoConversion` и `parentSku` без `price`.
        `salePrice` - цена со скидкой. Для установки скидки нужно передать все обязательные поля, а также `salePrice`, `saleStart` и `saleEnd`, `price`.
      required:
        - parentSku
      properties:
        parentSku:
          type: string
          description: Родительский идентификатор товара Lamoda
          example: "MP002XW0QCHC"
        price:
          $ref: '#/components/schemas/Price'
        salePrice:
          $ref: '#/components/schemas/Price'
        saleStart:
          type: string
          format: date-time
          description: |
            Дата и время начала скидки (ISO 8601 UTC с суффиксом Z).
        saleEnd:
          type: string
          format: date-time
          description: |
            Дата и время окончания скидки (ISO 8601 UTC с суффиксом Z).
        needAutoConversion:
          type: boolean
          description: |
            Требуется автоконвертация цены продажи. При передаче `needAutoConversion`, `price` не передается.
          example: false

    NomenclaturesPricesPostResponse:
      type: object
      additionalProperties: false
      required:
        - successCount
        - errorCount
        - errors
        - fraudValidationResults
      properties:
        successCount:
          type: integer
          description: Количество успешно обновлённых цен
        errorCount:
          type: integer
          description: Количество ошибок обновления цен
        errors:
          type: array
          items:
            $ref: '#/components/schemas/NomenclaturePriceUpdateError'
          description: |
            Ошибки обновления цен. Пустой массив если ошибок обновления цен нет.
        fraudValidationResults:
          type: array
          items:
            $ref: '#/components/schemas/FraudValidationResult'
          description: |
            Список объектов с подробной информацией об ошибках валидаций акционных цен товаров
            Заполняется только для `Country`=`RU`.

    NomenclaturePriceUpdateError:
      type: object
      additionalProperties: false
      description: |
        Ошибка обновления цены.
      properties:
        sku:
          type: string
          description: |
            Идентификатор товара Lamoda. Может быть пустой строкой, если товар не найден по parentSku.
          example: "MP002XW0QCHC"
        parentSku:
          type: string
          description: |
            Родительский идентификатор товара Lamoda, по которому произошла ошибка обновления цены.
          example: "MP002XW0QCHC"
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INTERNAL_ERROR
          description: |
            Код ошибки. Возможные значения:
            - `VALIDATION_ERROR` — ошибка валидации:
              - обновление цены по этому товару уже выполняется
              - товар не найден по переданному идентификатору `parentSku`
              - ошибки валидации полей (цена, скидка, даты и т.д.)
            - `INTERNAL_ERROR` — внутренняя ошибка при сохранении цен
          example: "VALIDATION_ERROR"
        messages:
          type: array
          items:
            type: string
          description: |
            Человекочитаемые сообщения с дополнительной информацией об ошибке.
          example: ["Validation error"]

    FraudValidationResult:
      type: object
      additionalProperties: false
      required:
        - parentSku
        - invalidValue
        - status
        - promotions
      description: |
        Описание ошибки валидации акционной цены.
        Объект возвращается в случае, если обновление цены нарушает условие существующей акции.
      properties:
        parentSku:
          type: string
          description: Родительский идентификатор товара Lamoda
        invalidValue:
          type: string
          enum: [BLACK_PRICE, RED_PRICE, SALE_PERIOD, RED_PRICE_AND_SALE_PERIOD]
          description: |
            Описывает, какое поле не прошло валидацию:
            `BLACK_PRICE` — цена без скидки,
            `RED_PRICE` — цена со скидкой,
            `SALE_PERIOD` — сроки действия скидки,
            `RED_PRICE_AND_SALE_PERIOD` — цена со скидкой и сроки одновременно.
        status:
          type: string
          enum: [WARNING, RESTRICTION]
          description: |
            `WARNING` — можно принудительно обновить цену с force=true (товар будет удалён из акции).
            `RESTRICTION` — принудительное обновление недоступно, изменить цену можно только после завершения акции.
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/NomenclaturesPricesPromoInfo'
          description: Акции, по которым не пройдена валидация цены

    NomenclaturePricePostResponse:
      type: object
      additionalProperties: false
      properties:
        fraudValidationResult:
          $ref: '#/components/schemas/FraudValidationResult'
        priceStatus:
          $ref: '#/components/schemas/PriceStatus'

    NomenclaturesPricesPromoInfo:
      type: object
      additionalProperties: false
      required:
        - promotionId
        - name
        - activeFrom
        - activeTo
        - discountPercent
      properties:
        promotionId:
          type: integer
          description: Идентификатор акции
        name:
          type: string
          description: Название акции
        activeFrom:
          type: string
          format: date
          example: "2025-06-01"
          description: Дата начала акции (включительно, ISO 8601)
        activeTo:
          type: string
          format: date
          example: "2025-06-01"
          description: Дата окончания акции (включительно, ISO 8601)
        discountPercent:
          type: integer
          description: Процент скидки по акции.
          minimum: 0
          maximum: 100

    NomenclaturesActivationStatusRequest:
      type: object
      additionalProperties: false
      required:
        - sellerId
        - status
        - country
      properties:
        sellerId:
          type: string
          description: Идентификатор продавца
        status:
          type: boolean
          description: |
            Статус активации товаров.
            - `true` - активировать продажу товаров
            - `false` - деактивировать продажу товаров
        country:
          type: string
          description: |
            Код страны. Возможные значения
            - `RU` - Российская Федерация
            - `BY` - Беларусь
            - `KZ` - Казахстан
          enum:
            ['RU', "BY", 'KZ']
        skus:
          type: array
          items:
            type: string
          description: Список размерных идентификаторов товара
          maxItems: 100
        externalSkus:
          type: array
          items:
            type: string
          description: Список размерных идентификаторов товара селлера
          maxItems: 100
        parentSkus:
          type: array
          items:
            type: string
          description: Список идентификатора товара
          maxItems: 100
        externalParentSkus:
          type: array
          items:
            type: string
          description: Список идентификаторов товара селлера
          maxItems: 100

    NomenclaturesActivationStatusResponse:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/NomenclatureActivationStatusError'
          description: Массив ошибок для товаров, для которых не удалось обновить статус активации.

    NomenclatureActivationStatusError:
      type: object
      additionalProperties: false
      required:
        - code
        - messages
      properties:
        sku:
          type: string
          nullable: true
          description: Идентификатор товара. null если для указанного фильтра не найден товар.
        code:
          type: integer
          description: Код ошибки
        messages:
          type: array
          items:
            type: string
          description: Массив сообщений об ошибках

    ReturnItemStatus:
      type: string
      enum: [CREATED, LEFT_TO_WH, ARRIVED_TO_WH, READY_TO_RETURN, SHIPPED, UTILIZATION]
      description: |
        Статус товара.
        CREATED - возврат создан.
        LEFT_TO_WH - едет на склад Lamoda.
        ARRIVED_TO_WH - на складе Lamoda.
        READY_TO_RETURN - готов к возврату.
        SHIPPED - отгружен.
        UTILIZATION - утилизация.

    DictionariesAttributesResponse:
      type: array
      description: |
        Список справочников атрибутов товара - каждый справочник содержит имя и объект соответствия допустимых значений
        атрибута товара к подробной информации о них.
      items:
        $ref: '#/components/schemas/DictionaryAttributeItem'

    DictionariesResponse:
      type: object
      additionalProperties: false
      required:
        - businessModels
        - partners
        - countries
      properties:
        businessModels:
          type: array
          description: Список доступных бизнес-моделей.
          items:
            $ref: '#/components/schemas/DictionariesBusinessModel'
          example: ["FBO"]
        partners:
          type: array
          description: Список доступных партнеров пользователя.
          items:
            $ref: '#/components/schemas/DictionariesPartner'
        countries:
          type: array
          description: Доступные страны.
          items:
            $ref: '#/components/schemas/Country'

    DictionariesPartner:
      type: object
      additionalProperties: false
      required:
        - code
        - sellerId
        - countriesEnabled
      properties:
        code:
          type: string
          example: "MX"
          description: Код партнера
        sellerId:
          type: integer
          format: int64
          example: 12345
          description: Идентификатор продавца
        shopName:
          type: string
          example: "MyShop"
          description: Название магазина
        businessModel:
          $ref: '#/components/schemas/DictionariesBusinessModel'
        countriesEnabled:
          type: array
          items:
            type: string
            enum:
              - RU
              - BY
              - KZ
          example:
            - "RU"
          description: Список стран, доступных партнеру

    DictionariesBusinessModel:
      type: string
      description: |
        Доступная бизнес-модель партнера.
        Возможные значения:
        - `FBS` - Партнер отвечает за закупку и хранение, Lamoda за доставку, партнер за возвраты.
        - `FBO` - Партнер отвечает за закупку, Lamoda за хранение и доставку, партнер за возвраты.
      enum:
        - FBS
        - FBO

    DictionaryAttributeItem:
      type: object
      additionalProperties: false
      required:
        - name
        - options
      properties:
        name:
          type: string
          description: Имя справочника атрибутов товара
          example: "gender"
        options:
          type: object
          description: Допустимые значения атрибута товара в формате соответствия идентификатора опции атрибута к объекту с
              подробной информацией о ней
          additionalProperties:
            $ref: '#/components/schemas/DictionaryAttributeOption'

    DictionaryAttributeOption:
      type: object
      additionalProperties: false
      required:
        - name
        - brandIds
      properties:
        name:
          type: string
          description: Название допустимого значения атрибута товара
          example: "kids"
        brandIds:
          type: array
          items:
            type: string
          description: |
            Список связанных идентификаторов брендов. Пустой в случае, если связанные идентификаторы отсутствуют.
          example: ["1", "2", "3"]

    NomenclatureAttributesMappingsResponse:
      type: object
      additionalProperties: false
      required:
        - siteCategories
        - tnVed
        - title
        - sizeScale
        - brandCountryMappings
      properties:
        siteCategories:
          type: array
          description: Список доступных категорий сайта
          items:
            $ref: '#/components/schemas/SiteCategoryWithPath'
        tnVed:
          type: array
          description: Список доступных кодов ТН ВЭД с ограничениями по полу
          items:
            $ref: '#/components/schemas/TnVedMapping'
        title:
          type: array
          description: Список доступных наименований
          items:
            $ref: '#/components/schemas/TitleMapping'
        sizeScale:
          type: array
          description: Список доступных размерных шкал
          items:
            $ref: '#/components/schemas/SizeScaleMapping'
        brandCountryMappings:
          type: array
          description: Маппинг брендов к доступным странам
          items:
            $ref: '#/components/schemas/BrandCountryMapping'

    Gender:
      type: string
      description: |
        Пол.
        Возможные значения:
        - `BOYS` - для мальчиков
        - `GIRLS` - для девочек
        - `KIDS` - для детей
        - `MEN` - для мужчин
        - `WOMEN` - для женщин
        - `UNISEX` - универсально
      enum: [BOYS, GIRLS, KIDS, MEN, WOMEN, UNISEX]

    SiteCategoryWithPath:
      type: object
      additionalProperties: false
      required:
        - id
        - path
        - name
        - isSport
      properties:
        id:
          type: string
          description: Идентификатор категории сайта
        path:
          type: array
          description: Полный путь категории
          items:
            type: string
        name:
          type: string
          description: Наименование категории
        isSport:
          type: boolean
          description: Признак спортивной категории
        isLeaf:
          type: boolean
          nullable: true
          description: Признак конечности категории
        gender:
            $ref: '#/components/schemas/Gender'

    TnVedMapping:
      type: object
      additionalProperties: false
      required:
        - id
        - gender
      properties:
        id:
          type: string
          description: Идентификатор ТН ВЭД - до 10 символов без разделителей
        gender:
          type: array
          description: Список допустимых значений пола для данного кода ТН ВЭД. Пустой список если доступны все значения пола.
          items:
            $ref: '#/components/schemas/Gender'

    TitleMapping:
      type: object
      additionalProperties: false
      required:
        - id
        - allowedRoomIds
      properties:
        id:
          type: string
          description: Идентификатор названия товара
        allowedRoomIds:
          type: array
          description: Список идентификаторов комнаты, с которыми доступна установка названия. Применяется для товаров, которым доступен выбор комнаты.
          items:
            type: integer

    SizeScaleMapping:
      type: object
      additionalProperties: false
      required:
        - code
        - sizeValue
        - oneSizeAllowed
        - genderMatching
        - brandSpecificGenderMatching
      properties:
        code:
          type: string
          description: Код размерной шкалы
        sizeValue:
          type: array
          description: Список доступных размерных значений
          items:
            type: string
        oneSizeAllowed:
          type: boolean
          description: Разрешен ли единственный размер (применяется для товаров без размерной модели)
        genderMatching:
          type: array
          description: Допустимые значения пола для данной размерной шкалы
          items:
            $ref: '#/components/schemas/Gender'
        brandSpecificGenderMatching:
          type: array
          items:
            type: object
            description: Дополнительные значения пола, которые можно установить данной размерной шкале для определенного бренда.
            required:
              - brandId
            properties:
              brandId:
                type: string
                description: Идентификатор бренда, которому для данной размерной шкалы доступны дополнительные значения пола.
              allowedGenders:
                type: array
                items:
                  $ref: '#/components/schemas/Gender'

    BrandCountryMapping:
      type: object
      additionalProperties: false
      required:
        - brandId
        - brandName
        - isSport
        - countriesEnabled
      properties:
        brandId:
          type: string
          description: Идентификатор бренда
        brandName:
          type: string
          description: Название бренда
        isSport:
          type: boolean
          description: Признак спортивного бренда
        countriesEnabled:
          type: array
          description: Список стран, в которых доступен бренд
          items:
            $ref: '#/components/schemas/Country'

    NomenclatureAttributesResponse:
      type: object
      additionalProperties: false
      required:
        - product
        - variation
      properties:
        product:
          type: array
          description: Список атрибутов товара.
          items:
            $ref: '#/components/schemas/NomenclatureAttributeWithValue'
        variation:
          type: array
          description: |
            Список размерных моделей товара.
            Каждая размерная модель содержит размерный идентификатор товара Lamoda и список атрибутов с текущими значениями.
          items:
            $ref: '#/components/schemas/NomenclatureVariation'

    NomenclatureVariation:
      type: object
      additionalProperties: false
      required:
        - sku
        - attributes
      properties:
        sku:
          type: string
          description: Идентификатор размерной модели товара Lamoda.
        attributes:
          type: array
          description: Список атрибутов размерной модели с текущими значениями.
          items:
            $ref: '#/components/schemas/NomenclatureAttributeWithValue'

    NomenclatureAttributeWithValue:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - type
        - requiredForShipmentTypes
        - requiredForGenders
        - requiredForTemplates
        - allowedForTemplates
        - comment
        - allowEditForSeller
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 255
          description: Код атрибута
          example: "season_wear"
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Название атрибута
        type:
          type: string
          enum:
            - NUMBER
            - STRING
            - BOOLEAN
            - DICTIONARY_ENTRY
            - ARRAY_OF_DICTIONARY_ENTRY
            - LOCALIZED_STRING
            - PRODUCT_COMPOSITION
            - IMAGE_PATH
            - ARRAY_OF_IMAGE_PATH
            - ARRAY_OF_SKU
            - MIXED
          description: |
            Тип данных атрибута:
            - `NUMBER` — числовое значение
            - `STRING` — строковое значение
            - `BOOLEAN` — булевое значение
            - `DICTIONARY_ENTRY` — одно значение из справочника (см. `dictionary`)
            - `ARRAY_OF_DICTIONARY_ENTRY` — список значений из справочника (см. `dictionary`)
            - `LOCALIZED_STRING` — локализуемая строка
            - `PRODUCT_COMPOSITION` — состав продукта
            - `IMAGE_PATH` — путь изображения
            - `ARRAY_OF_IMAGE_PATH` — список путей к изображениям
            - `ARRAY_OF_SKU` — список идентификаторов товара
            - `MIXED` — нестандартный тип атрибута из БД
          example: DICTIONARY_ENTRY
        dictionary:
          type: string
          maxLength: 255
          description: Имя связанного справочника, возвращается для атрибутов типа `DICTIONARY_ENTRY` и `ARRAY_OF_DICTIONARY_ENTRY`
        requiredForShipmentTypes:
          type: array
          description: |
            Бизнес-модели, для которых атрибут обязателен.
          items:
            $ref: '#/components/schemas/DictionariesBusinessModel'
        requiredForGenders:
          type: array
          description: |
            Пол/возрастная группа, для которых атрибут обязателен.
          items:
            type: string
            enum:
              - BOYS
              - GIRLS
              - KIDS
              - MEN
              - WOMEN
              - UNISEX
            description: |
