        type: string
        format: date
      description: "Дата заявки (не включительно, в формате ISO 8601). Пример: 2025-09-15"

    TransportRequestStatusesQuery:
      name: statuses
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransportRequestListStatus'
      description: Фильтр по статусам заявки.

    TransportRequestShipmentIdsQuery:
      name: shipmentIds
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Фильтр по идентификаторам отгрузок. У заявок типа RETURN отгрузки отсутствуют.

    TransportRequestTypesQuery:
      name: types
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransportRequestListType'
      description: Фильтр по типам заявки.

    TransportRequestDeliveryMethodsQuery:
      name: deliveryMethods
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransportRequestListDeliveryMethod'
      description: Фильтр по способам передачи товаров.

    TransportRequestSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [date, -date]
        default: -date
      description: "Сортировка по дате: date — по возрастанию, -date — по убыванию. По умолчанию: -date."

    PickupRequestDateToQuery:
      name: dateTo
      in: query
      required: false
      schema:
        type: string
        format: date
      description: "Дата заявки (включительно, в формате ISO 8601). Пример: 2025-09-15"

    PickupRequestDateQuery:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: "Дата заявки (в формате ISO 8601). Пример: 2025-09-11"

    PickupRequestTypeQuery:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PickupRequestType"
      description: |
        Тип заявки
        DELIVERY — доставка
        RETURN — возврат

    PickupRequestStatusesQuery:
      name: statuses
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PickupRequestStatus"
      description: |
        Тип заявки
        DELIVERY — доставка
        RETURN — возврат

    ReturnItemSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: returnDate
      description: "Сортировка. Формат: поле или -поле для сортировки по убыванию. Пример: returnDate или -returnDate. По умолчанию: returnDate"

    PickupRequestSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: date
      description: "Сортировка. Формат: поле или -поле для сортировки по убыванию. Пример: date или -date. По умолчанию: date"

    QuestionsSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: createdAt
      description: "Сортировка. Формат: поле или -поле для сортировки по убыванию. Пример: createdAt или -createdAt. По умолчанию: createdAt"

    WarehouseCodeQuery:
      name: warehouseCode
      in: query
      required: false
      schema:
        type: string
        enum: [BYKOVO, SOFINO]
        example: "BYKOVO"
      description: "Код склада FBO (BYKOVO или SOFINO)."

    SkuQuery:
      name: sku
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: string
      description: |
        Фильтр по Lamoda SKU. Можно передать до 100 значений,
        указав параметр несколько раз.
        Пример: sku=SKU1&sku=SKU2&sku=SKU3
        Если параметр не указан, возвращаем всю выдачу с пагинацией.

    ExternalSkuQuery:
      name: externalSku
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: string
      description: |
        Фильтр по внешнему SKU продавца. Можно передать до 100 значений,
        указав параметр несколько раз.
        Пример: externalSku=SKU1&externalSku=SKU2&externalSku=SKU3
        Если параметр не указан, возвращаем всю выдачу с пагинацией.

    WithZeroQuantityQuery:
      name: withZeroQuantity
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: |
        Включать ли позиции с нулевым остатком.
        `false` исключает нулевые остатки. Значение по умолчанию — `true`

    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Номер страницы (начиная с 1)

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Количество записей на странице (максимум 1000)

    FBOShipmentItemsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 25
      description: Количество товаров поставки на странице (максимум 1000)

    NomenclaturesLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 25
      description: Количество записей на странице (максимум 25)

    MinimalPricesLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 25
      description: Количество записей на странице (максимум 25)

    PickupRequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Идентификатор заявки на доставку/возврат товара.

    DropoffRequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Идентификатор drop-off заявки.

    TransportRequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Идентификатор заявки на доставку или возврат товара (pickup или dropoff).

    SellerIdQuery:
      name: sellerId
      in: query
      required: true
      schema:
        type: string
      description: Идентификатор продавца.

    FilterQuery:
      name: filter
      in: query
      required: false
      schema:
        type: string

    StatusGroupQuery:
      name: statusGroup
      in: query
      required: false
      schema:
        type: string
        enum:
          - PENDING
          - UNSPECIFIED
          - IN_TRANSIT
          - RETURNED
          - IN_DELIVERY
          - DELIVERED
          - FAILED
          - TO_DELIVERY
          - CLAIMED
          - CANCELLED
          - AWAITING_SHIPMENT
      description: |
        Фильтр по группе статуса заказа. Возможные значения:
        - `PENDING` - Ожидает подтверждения
        - `UNSPECIFIED` - Требуют уточнения
        - `IN_TRANSIT` - В пути
        - `RETURNED` - Возвращен на склад
        - `IN_DELIVERY` - В доставке
        - `DELIVERED` - Доставленные
        - `FAILED` - Недоставленные
        - `TO_DELIVERY` - Переданы в доставку
        - `CLAIMED` - Возвраты
        - `CANCELLED` - Отменены
        - `AWAITING_SHIPMENT` - Ждут отгрузки

    OrderIdQuery:
      name: orderId
      in: query
      required: false
      schema:
        type: string
      description: Фильтр по идентификатору заказа.

    ExternalOrderIdQuery:
      name: externalOrderId
      in: query
      required: false
      schema:
        type: string
      description: Фильтр по идентификатору заказа партнера.

    OrdersCountryQuery:
      name: country
      in: query
      required: false
      schema:
        type: string
        enum:
          - RU
          - BY
          - KZ
      description: |
        Фильтр по коду страны в формате ISO 3166-1 alpha-2.
        Возможные значения:
        - RU - Россия
        - BY - Беларусь
        - KZ - Казахстан

    HasDiscrepancyActsQuery:
      name: hasDiscrepancyActs
      in: query
      required: false
      schema:
        type: boolean
      description: Фильтр по наличию актов расхождений.

    DeliveryDateQuery:
      name: deliveryDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Точная дата доставки в формате ISO 8601 UTC с суффиксом Z.
      example: "2026-05-10T00:00:00Z"

    OrderCreatedAtFromQuery:
      name: createdAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Фильтр по дате создания заказа. Начало периода (включительно, ISO 8601, UTC).

    OrderCreatedAtToQuery:
      name: createdAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Фильтр по дате создания заказа. Конец периода (не включительно, ISO 8601, UTC).

    OrderUpdatedAtFromQuery:
      name: updatedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Фильтр по дате обновления заказа. Начало периода (включительно, ISO 8601, UTC).

    OrderUpdatedAtToQuery:
      name: updatedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Фильтр по дате обновления заказа. Конец периода (не включительно, ISO 8601, UTC).

    OrderSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: "Сортировка. Формат: допустимые поля — orderId, createdAt, updatedAt, cutOff, deliveryDate, customer, fullSum, status; формат с минусом и запятой (например, -createdAt); дефолт — по дате создания (новые первые)."

    ShipmentSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      description: "Сортировка. Формат: допустимые поля — shipmentId, plannedDate; формат с минусом и запятой (например, -plannedDate); дефолт — по дате создания (новые первые)."

    ShipmentStatusesQuery:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: |
        Фильтр по статусам поставок.
        Значения регистронезависимы.
        Возможные значения:
        - `NEW` — новая
        - `SENT` — отправлена
        - `CONFIRMED` — подтверждена
        - `DRAFT` — черновик
        - `CANCELLED` — отменено
        - `CHANGING_WAREHOUSE` — перевод на другой склад
        - `VALIDATION` — проверка
        - `VALIDATION_ERROR` — ошибка проверки
        - `READY_FOR_SHIPMENT` — готова к отгрузке
        - `UNLOADING_NEEDED` — требуется разгрузка
        - `UNLOADING` — разгрузка
        - `UNLOADED` — разгружена
        - `PROCESSING` — обработка
        - `CLOSED` — закрыта
        - `REJECTED` — отклонена
        - `RECEIVED` — получено
        - `CANCEL_PENDING` — ожидание отмены

    FromDateQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Фильтр по планируемой дате поставки. Начало периода  (включительно, ISO 8601, UTC).

    ToDateQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Фильтр по планируемой дате поставки. Конец периода (включительно, ISO 8601, UTC).

    ShipmentIdQuery:
      name: shipmentId
      in: query
      required: false
      schema:
        type: string
      description: Фильтр по идентификатору поставки (Lamoda code).

    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
      description: Идентификатор заказа
      example: "RU250122-636793-003C"

    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        maxLength: 30
      description: Идентификатор позиции заказа
      example: "ITEM-001"

    SellerOrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9-]{1,17}$'
      description: Идентификатор заказа
      example: "RU250122-636793-003C"

    PackNumberPath:
      name: packNumber
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
      description: Уникальный паковый код упаковки (получен из `POST /v2/orders/{orderId}/packs`).
      example: "FBS086D4F40P"

    LabelFormatQuery:
      name: labelFormat
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LabelFormat'
      description: |
        Формат паковой этикетки. Если не передан, используется `M` (средний).

    AttributeNamesQuery:
      name: attributeNames
      in: query
      required: true
      description: |
        Список имен атрибутов товара, по которым производится поиск справочников.
      schema:
        type: array
        minItems: 1
        items:
          type: string
        example: ["gender"]
      style: form
      explode: true

    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Идентификатор категории товара
      example: "5637156359"

    IncludeLinkedQuery:
      name: includeLinked
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Включить историю всех связанных ревизий поставки.

    CountryQuery:
      name: country
      in: query
      required: true
      schema:
        type: string
        enum:
          - RU
          - BY
          - KZ
      description: |
        Код страны по ISO 3166-1 alpha-2. Возможные значения:
        - RU - Россия
        - BY - Беларусь
        - KZ - Казахстан

    SkusQuery:
      name: sku
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      style: form
      explode: true
      description: Размерный SKU товара
      example: [ "MP002XW0QCHCR360", "MP002XW0QCHCR361" ]

    ExternalSkusQuery:
      name: externalSku
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      style: form
      explode: true
      description: Размерный SKU товара селлера
      example: ["sellerFullSku"]

    ParentSkusQuery:
      name: parentSku
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      style: form
      explode: true
      description: SKU товара
      example: ["MP002XW0QCHC"]

    ExternalParentSkusQuery:
      name: externalParentSku
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      explode: true
      description: SKU товара селлера
      example: ["parentSellerSku"]

    MinimalPricesCategoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      style: form
      explode: true
      description: |
        Список идентификаторов категорий.
        Ограничивает выборку категориями из заданного множества (семантика IN). Если параметр не передан — фильтр по категориям не применяется.
      example: ["5637156359", "5637156360"]

    MinimalPricesSubcategoryIdQuery:
      name: subcategoryId
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
        minItems: 1
      style: form
      explode: true
      description: |
        Список идентификаторов подкатегорий.
        Ограничивает выборку подкатегориями из заданного множества (семантика IN). Если параметр не передан — фильтр по подкатегориям не применяется.
      example: ["5637156400"]

    FBOShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор поставки (Lamoda code, поле `id` в ответе).
      example: "MPG197447"

    ItemSearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: |
        Строка поиска по товарам поставки.
        Поддерживает значения SKU и EAN.

    CategoryIdQuery:
      name: categoryId
      in: query
      required: false
      description: |
        Фильтр остатков по категориям
      schema:
        type: array
        minItems: 1
        items:
          type: string
        example: "1234"
      style: form
      explode: false

    BrandIdQuery:
      name: brandId
      in: query
      required: false
      schema:
        type: integer
      description: |
        Поиск по идентификатору бренда.

    StocksSearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: |
        Строка поиска по товарам поставки.
        Поддерживает значения SKU, externalSKU и name.

    SkuPath:
      name: sku
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор товара Lamoda
      example: "MP002XW0QCHCR360"

    FBSShipmentSearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: |
        Строка поиска поставки.
        Поиск по shipmentId и номеру упаковки и паллеты.

    FBSShipmentSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      description: "Сортировка. Формат: допустимые поля — createdAt; формат с минусом и запятой (например, -plannedDate); дефолт — по дате создания (новые первые)."


    FBSShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор отгрузки.
      example: "MPG197447"

    NomenclaturesSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: "createdAt"
        example: "-createdAt"
      description: |
        Порядок сортировки (префикс "-" сортирует по убыванию)
        Возможные значения:
        - sku
        - parentSku
        - externalSku
        - externalParentSku
        - createdAt

    PromotionsProductsSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: |
        Порядок сортировки.
        Без префикса "-" сортировка выполняется по возрастанию.
        Префикс "-" сортирует по убыванию.
        Возможные значения:
        - lamodaDiscountPercent
        Если sort не передан, применяется сортировка по умолчанию: по внутреннему идентификатору товара по убыванию.

    PromotionsFinishedQuery:
      name: finished
      in: query
      required: false
      schema:
        type: boolean
      description: |
        При включенном флаге возвращаются только завершенные акции в которых участвовал селлер
        Значение по умолчанию false

    PromotionIdPath:
      name: promotionId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор акции

    PromotionVariantIdPath:
      name: promotionVariantId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор варианта акции

    ContainerBarcodePath:
      name: containerBarcode
      in: path
      required: true
      schema:
        type: string
      description: |
        Штрихкод контейнера заказа. Принимается штрихкод как пака,
        так и паллеты. Тип определяется автоматически по содержимому.
      example: "PALIVO060"

    ShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
      description: Код FBS-отгрузки.
      example: "IVO060"

    ContainerBarcodeQuery:
      name: containerBarcode
      in: query
      required: false
      schema:
        type: string
      description: |
        Фильтр по штрихкоду контейнера. Ищет совпадение по баркоду паллеты
        ИЛИ баркоду упаковки (пака).
      example: "PALIVO060"

    OrderStatusFilterQuery:
      name: orderStatus
      in: query
      required: false
      schema:
        type: string
      description: |
        Фильтр по статусу заказа.
        Известные значения: CONFIRMED, SHIPPED, DELIVERED, RETURNED, CANCELLED, FAILED.
        Значение передаётся в CAPS и транслируется в группу статуса заказа partner'а
        (`order_represent_status_group.uri_name`). Фильтр повторяет семантику
        partner `/api/v1/goods` и не является точным фильтром по значению поля
        `orderStatus` в ответе.
      example: "CONFIRMED"

  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT токен для аутентификации. Формат: Authorization: Bearer <token>"

  responses:
    Response.EmptyJson:
      description: Ответ с пустым JSON объектом
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
          example: {}

    Response.400:
      description: Ошибка валидации данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            validationError:
              summary: Ошибка валидации данных
              value:
                error:
                  code: "VALIDATION_FAILED"
                  message: "Проверьте переданные данные"
                  details:
                    - field: "sellerId"
                      issue: "Обязательное поле"
                    - field: "images[0].index"
                      issue: "Должно быть положительным числом"
                    - field: "images"
                      issue: "Список изображений не может быть пустым"
            invalidImageFormat:
              summary: Неподдерживаемый формат изображения
              value:
                error:
                  code: "VALIDATION_FAILED"
                  message: "Проверьте переданные данные"
                  details:
                    - field: "images[0]"
                      issue: "Incorrect image format. Correct formats are jpg and jpeg"

    Response.401:
      description: Токен отсутствует или невалиден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Unauthorized"

    Response.403:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: "FORBIDDEN"
              message: "Forbidden"

    Response.404:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: "NOT_FOUND"
              message: "Not Found"

    Response.429:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: "TOO_MANY_REQUESTS"
              message: "Too Many Requests"

    Response.503:
      description: Сервис недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: "SERVICE_UNAVAILABLE"
              message: "Service Unavailable"
