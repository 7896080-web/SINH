        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionVariantsProductsChangeRequest"
            examples:
              basic:
                summary: Запрос со списком товаров на добавление в вариант акции
                value:
                  sellerId: "12345"
                  products:
                    - parentSku: "MP002XG033BD"
                      country: "RU"
      responses:
        "200":
          description: Ответ со списком товаров, не прошедших валидацию
          content:
