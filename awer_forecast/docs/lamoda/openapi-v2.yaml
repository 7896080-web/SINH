        - `SENT_BACK_TO_PARTNER` - Отправлен партнёру
        - `LEFT_LM_EXPRESS` - Отправлен из ТВХ
        - `ARRIVED_TO_LM_EXPRESS` - Прибыл на склад LM Express
        - `ON_SHELF` - Прибыл в пункт выдачи заказов
        - `CONFIRMED` - Подтверждён
        - `SHIPPED` - Отправлен со склада
        - `REFUND_INVESTIGATION` - Сбор информации для возврата денежных средств
        - `READY_TO_REFUND` - В процессе возврата денежных средств
        - `DELIVERED` - Доставлен
        - `GIVEN_TO_DELIVERY` - Передан в службу доставки
        - `IN_DELIVERY` - В доставке
        - `REFUNDED` - Денежные средства возвращены
        - `REFUND_NECESSARY` - Требуется возврат денежных средств
        - `REFUND_BY_PARTNER` - Возврат денежных средств партнёром
        - `ARRIVED_TO_WH` - Прибыл на основной склад
        - `SHIPPED_TO_WH` - Отправлен на основной склад
        - `AWAITING_SHIPMENT`
        - `NOT_BOUGHT` - Не выкуплен
        - `NOT_DELIVERED` - Не доставлен
        - `CANCELED` - Отменён
        - `CLAIMED_DEFECTIVE` - Принят к возврату как брак
        - `CLAIMED_OK` - Принят к возврату
        - `CLAIMED_USED` - Не подлежит возврату как использованный
      enum:
        - SENT_BACK_TO_PARTNER
        - LEFT_LM_EXPRESS
        - ARRIVED_TO_LM_EXPRESS
        - ON_SHELF
        - CONFIRMED
        - SHIPPED
        - REFUND_INVESTIGATION
        - READY_TO_REFUND
        - DELIVERED
        - GIVEN_TO_DELIVERY
        - IN_DELIVERY
        - REFUNDED
        - REFUND_NECESSARY
        - REFUND_BY_PARTNER
        - ARRIVED_TO_WH
        - SHIPPED_TO_WH
        - AWAITING_SHIPMENT
        - NOT_BOUGHT
        - NOT_DELIVERED
        - CANCELED
        - CLAIMED_DEFECTIVE
        - CLAIMED_OK
        - CLAIMED_USED

    OrderDetailsItemStatusChangeReasonEnum:
      type: string
