        Добавление товаров в вариант акции.
        Товар может находиться только в одном варианте акции,
        поэтому перед добавлением товара в целевой вариант нужно удалить его из варианта, в котором он находится сейчас.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/additional/07_promotions/">Акции: управление участием товаров</a>.
