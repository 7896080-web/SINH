        status:
          type: string
          description: |
            Статус отгрузки.
            Возможные значения:
            - `INITIAL` — начальный
            - `NEW` — новая
            - `SENT` — отправлена
            - `CONFIRMED` — подтверждена
            - `REJECTED` — отклонена
            - `CANCEL_PENDING` — ожидание отмены
            - `CANCELLED` — отменена
          enum:
            - INITIAL
            - NEW
            - SENT
            - CONFIRMED
            - REJECTED
            - CANCEL_PENDING
            - CANCELLED
          example: "NEW"
        baseWarehouse:
          type: string
          nullable: true
          description: Код базового склада.
          example: "BYKOVO"
        canBeCancelled:
          type: boolean
          description: Флаг возможности отмены отгрузки.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Время создания отгрузки (в формате ISO 8601 UTC с суффиксом Z).
          example: "2023-12-01T10:30:00Z"
        pallets:
          type: array
          description: Список паллетов в отгрузке.
          items:
