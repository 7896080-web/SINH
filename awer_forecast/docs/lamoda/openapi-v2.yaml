        NEED_ACTION - требуется действие над товаром после проверки модератором
        PHOTOSHOOT_PENDING - ожидает завершения работ на фотостудии
        MODERATION_PENDING - ожидает проверки модератором
      type: string
      enum: [ INACTIVE, ONLINE, OUT_OF_STOCK, NEED_ACTION, PHOTOSHOOT_PENDING, MODERATION_PENDING ]
      nullable: true
    NomenclatureImages:
      nullable: true
      type: object
      additionalProperties: false
      required:
        - default
        - img320x461
      description: |
        В ответе могут содержаться как фотографии прошедшие модерацию, так и нет.
        Не прошедшие модерацию фото (которые в названии содержат _draft и не ведут на cdn) не подвергаются ресайзу и представлены в изначальном размере.
        Фото подвергшиеся ресайзу содержат в url указание на их размер (img320x461).
      properties:
        default:
          type: array
          nullable: true
          description: Фотографии в исходном размере
          items:
            $ref: '#/components/schemas/NomenclatureImage'
        img320x461:
          type: array
          nullable: true
          description: Фотографии в размере 320x461
          items:
            $ref: '#/components/schemas/NomenclatureImage'
    NomenclatureImage:
      type: object
      additionalProperties: false
      required:
        - url
        - type
        - index
        - photoId
      properties:
        url:
          description: Ссылка на фотографию.
          type: string
          example:
            approvedDefault: https://pi.lmcdn.ru/img320x461/M/P/MP002XM08RDW_18344038_3_v2.jpg
            resized: https://a.lmcdn.ru/img320x461/M/P/MP002XG063ZY_32038577_1_v1_2x.jpg
            draft: https://storage.yandexcloud.net/content-draft/lamoda_seller/11.03.2025/MP002XW063ZY_1_2x_draft.jpg
        type:
          description: Тип фотографии MAIN - основная фотография, ADDITIONAL - дополнительная фотография
          type: string
          enum: [ MAIN, ADDITIONAL ]
        index:
          type: integer
          description: Порядковый номер фото. Нумерация начинается с 1
        photoId:
          description: Идентификатор фото
          type: integer
          nullable: true
    NomenclatureFilterItem:
      type: object
      required:
        - key
        - operator
        - value
      properties:
        key:
          type: string
          description: |
            Поле для фильтрации
            Возможные значения:
            - categoryLevel1 - имя категории первого уровня.
              Операторы [EQ, IN, NOT_EQ, LIKE]
            - sku - размерный SKU товара.
              Операторы [EQ, IN, NOT_EQ, LIKE, ILIKE]
            - parentSku - SKU товара.
              Операторы [EQ, IN, NOT_EQ, LIKE, ILIKE]
            - externalSku - размерный SKU селлера.
              Операторы [EQ, IN, NOT_EQ, LIKE, ILIKE]
            - externalParentSku - SKU селлера.
              Операторы [EQ, IN, NOT_EQ, LIKE, ILIKE]
            - brand - название бренда.
              Операторы [EQ, IN, NOT_EQ, LIKE, ILIKE]
            - quantity - количество.
              Операторы [EQ, GREATER]
            - status - статус товара.
              Операторы [EQ, IN, NOT_EQ]
            - priceQuarantineByCountry - признак попадания цены на карантин (нужно указать страну, например RU)
              Операторы [EQ, IN]
            - country - страна продажи.
              Операторы [EQ]
            - createdAt - дата создания
              Операторы [BETWEEN (требуется указать в value начало и конец периода), EQ, NOT_EQ, IN]
              Поддерживается datetime в формате:
                - YYYY-MM-DDTHH:mm:ssZ
                - YYYY-MM-DDTHH:mm:ss±HH:mm
                - YYYY-MM-DDTHH:mm:ss
              Семантика:
              - EQ / NOT_EQ / IN — сравнение точного момента времени.
              - BETWEEN — фильтрация по периоду, требуется ровно 2 значения.
              - Значение без timezone (YYYY-MM-DDTHH:mm:ss) интерпретируется как UTC.
        operator:
          type: string
          enum: [ 'BETWEEN', 'NOT_EQ', 'GREATER_OR_EQ', 'LESS_OR_EQ', 'LIKE', 'ILIKE', 'IN', 'EQ', 'GREATER', 'LESS' ]
          description: Операция над фильтруемыми данными
        value:
          type: array
          description: Искомые значения
          items:
            type: string

