  /v2/product-certificates:
    post:
      tags:
        - Product Certificates
      summary: Получить список разрешительных документов со статусами проверки
      description: |
        Возвращает страницу разрешительных документов продавца со статусами проверки.
        Параметры передаются в теле запроса. `sellerId` обязателен в теле и должен
        соответствовать JWT токену.

        Проверка выполняется по реестрам контролирующих органов: сертификаты и декларации —
        по данным Росаккредитации и реестров ЕАЭС, свидетельства о государственной
        регистрации (СГР) — по реестру свидетельств ЕАЭС.

        Статусы проверки: `IN_PROGRESS` — на проверке, `PASSED` — проверка пройдена,
        `FAILED` — проверка не пройдена. При `FAILED` в поле `statusText` возвращается
        расширенный статус проверки.

        Записи с типом `DOCUMENT_NOT_REQUIRED` (отметка «документ не требуется») входят в
        выдачу: у них `number` = null, заполнена причина `noDocumentReason`, статус `PASSED`.

        Чтобы проверить статус конкретного документа, передайте фильтр `number` —
        в ответе будут только документы с точным совпадением номера (обычно один;
        несколько — если документ переоформлялся с тем же номером). Для однозначной
        идентификации используйте фильтры `number` и `type`, а среди полученных
        документов сверьте даты действия: сочетание номера, типа, `startDate`
        и `endDate` уникально.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/product_certificates/">Работа с разрешительными документами</a>.
      operationId: v2.post.productCertificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCertificatesListRequest'
            example:
              sellerId: "242541217"
              type: "DECLARATION"
              number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
              page: 1
              limit: 100
      responses:
        "200":
          description: Страница разрешительных документов продавца
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCertificatesListResponse"
              examples:
                success:
                  summary: Список документов
                  value:
                    certificates:
                      - number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
                        type: "DECLARATION"
                        status: "FAILED"
                        statusText: "Прекращен"
                        startDate: "2025-01-01"
                        endDate: "2125-12-31"
                        skuCount: 3
                        parentSkuCount: 1
                      - number: null
                        type: "DOCUMENT_NOT_REQUIRED"
                        status: "PASSED"
                        noDocumentReason: 5
                        skuCount: 1
                        parentSkuCount: 1
                    meta:
                      total: 2
                      page: 1
                      limit: 100
                      totalPages: 1
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '503':
          $ref: '#/components/responses/Response.503'

  /v2/product-certificates/document:
    post:
      tags:
        - Product Certificates
      summary: Получить карточку разрешительного документа со списком привязанных товаров
      description: |
        Возвращает один разрешительный документ продавца: реквизиты, статус проверки
        и постраничный список привязанных товаров.
        Параметры передаются в теле запроса. `sellerId` обязателен в теле и должен
        соответствовать JWT токену.

        Идентификация документа зависит от `type` (тот же набор полей, что в задачах `REMOVE`,
        но отсутствие `endDate` здесь означает строго бессрочный документ, а не любую дату):
        - `CERTIFICATE`, `DECLARATION`, `SGR_CERTIFICATE`, `CERTIFICATE_MEDICAL_DEVICE`: обязательны `number` и `startDate`;
          `endDate` передавайте, если он есть у документа (отсутствие означает бессрочный документ);
          `noDocumentReason` не передаётся;
        - `DOCUMENT_NOT_REQUIRED`: обязателен `noDocumentReason`; `number`, `startDate`, `endDate` не передаются.

        Значения полей идентификации берите из ответа списка документов
        (`POST /api/v2/product-certificates`) без изменений.

        Если документ с такой идентификацией у продавца не найден — `404 NOT_FOUND`.

        Подробнее: <a href="https://academy.lamoda.ru/articles/api/catalog/product_certificates/">Работа с разрешительными документами</a>.
      operationId: v2.post.productCertificates.document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCertificateDocumentRequest'
            example:
              sellerId: "242541217"
              type: "DECLARATION"
              number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
              startDate: "2025-01-01"
              endDate: "2125-12-31"
              page: 1
              limit: 100
      responses:
        "200":
          description: Карточка документа со списком привязанных товаров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCertificateDocumentResponse"
              examples:
                declaration:
                  summary: Декларация с привязанными товарами
                  value:
                    number: "ЕАЭС N RU Д-FR.PA02.B.465283/23"
                    type: "DECLARATION"
                    status: "PASSED"
                    startDate: "2025-01-01"
                    endDate: "2125-12-31"
                    skuCount: 3
                    parentSkuCount: 1
                    products:
                      - sku: "MP002XW0000CR320"
                        parentSku: "MP002XW0000CR"
                        externalSku: "RBS0058XXXRU037"
                        externalParentSku: "RBS0058XXX"
                      - sku: "MP002XW0000CR340"
                        parentSku: "MP002XW0000CR"
                        externalSku: "RBS0058XXXRU039"
                        externalParentSku: "RBS0058XXX"
                      - sku: "MP002XW0000CR360"
                        parentSku: "MP002XW0000CR"
                        externalSku: "RBS0058XXXRU041"
                        externalParentSku: "RBS0058XXX"
                    meta:
                      total: 3
                      page: 1
                      limit: 100
                      totalPages: 1
                documentNotRequired:
                  summary: Отметка «документ не требуется»
                  value:
                    number: null
                    type: "DOCUMENT_NOT_REQUIRED"
                    status: "PASSED"
                    noDocumentReason: 5
                    skuCount: 1
                    parentSkuCount: 1
                    products:
                      - sku: "MP002XM0000BINS"
                        parentSku: "MP002XM0000BI"
                        externalSku: "AB1234CD"
                        externalParentSku: "AB1234"
                    meta:
                      total: 1
                      page: 1
                      limit: 100
                      totalPages: 1
        '400':
          $ref: '#/components/responses/Response.400'
        '401':
          $ref: '#/components/responses/Response.401'
        '403':
          $ref: '#/components/responses/Response.403'
        '404':
          $ref: '#/components/responses/Response.404'
        '503':
          $ref: '#/components/responses/Response.503'

