<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Синхронизация площадок{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- htmx лежит РЯДОМ, а не тянется из интернета. Раньше он грузился с
         cdnjs.cloudflare.com, и вся интерактивность админки зависела от того,
         доступен ли Cloudflare из браузера оператора. Если нет — страница
         открывалась как ни в чём не бывало, но переставала работать МОЛЧА:
         галочки кабинетов не сохранялись, поля не отправлялись, строки не
         перерисовывались, и никакой ошибки оператор не видел. Для системы,
         которая управляет остатками на площадках, «тихо не сработало» —
         худший из возможных отказов. -->
    <script src="/static/htmx.min.js"></script>
    <script>
        // Если файл всё же не загрузился (потеряли при обновлении, не тот путь),
        // об этом надо СКАЗАТЬ, а не оставлять мёртвую страницу.
        window.addEventListener("DOMContentLoaded", function () {
            if (typeof window.htmx !== "undefined") return;
            var warn = document.createElement("div");
            warn.className = "flash flash--warn";
            warn.textContent = "htmx не загрузился (/static/htmx.min.js) — галочки, " +
                "поля и кнопки на странице работать не будут. Данные при этом целы; " +
                "сообщите администратору.";
            document.body.prepend(warn);
        });
    </script>
</head>
<body>
    <div class="shell">
        <nav class="nav">
            <div class="nav__brand">Синхронизация площадок</div>
            <a class="nav__item {% if active_page == 'mapping' %}active{% endif %}" href="/mapping">Мэппинг</a>
            <a class="nav__item {% if active_page == 'platform-matching' %}active{% endif %}" href="/platform-matching">Сопоставление площадок</a>
            <a class="nav__item {% if active_page == 'products' %}active{% endif %}" href="/products">Товары и остатки</a>
            <a class="nav__item {% if active_page == 'anomalies' %}active{% endif %}" href="/anomalies">Аномалии</a>
            <a class="nav__item {% if active_page == 'stock-on-date' %}active{% endif %}" href="/stock-on-date">Остатки на дату</a>
            <a class="nav__item {% if active_page == 'diagnostics' %}active{% endif %}" href="/diagnostics">Диагностика</a>
            <a class="nav__item {% if active_page == 'testing' %}active{% endif %}" href="/testing">Тестирование</a>
            <a class="nav__item {% if active_page == 'api-keys' %}active{% endif %}" href="/api-keys">API-ключи</a>
            <div class="nav__footer">
                {{ current_user.username if current_user else '' }}<br>
                <a href="/logout">Выйти</a>
            </div>
        </nav>
        <main class="main">
            {% if flash %}
            <div class="flash flash--{{ flash.kind }}">{{ flash.message }}</div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
