[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awer-sales-bot"
version = "0.1.0"
description = "Индивидуальные планы продавцов AWER и ежедневные сообщения в мессенджер MAX"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "apscheduler>=3.10,<4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]  # httpx уже в зависимостях — нужен для TestClient

[project.scripts]
awer-bot = "awer_sales_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
