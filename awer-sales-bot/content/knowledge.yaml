# База знаний для продавцов AWER: ткани, утеплители, уход за вещами, посадка и размер,
# как рассказывать о бренде и цене. Продавец открывает статьи кнопками в разделе «Обучение»
# бота и читает их с телефона прямо в зале — поэтому коротко и по делу.
#
# СТАТУС: черновик (18.10.2026) по общеизвестным фактам о тканях и уходе. Перед запуском его
# должен просмотреть владелец.
#
# Зачем: в карточках 1С есть бренд и цвет, но почти нет состава. Знания о тканях и утеплителях
# продавец берёт отсюда и с ярлыка на самой вещи.
#
# Как править этот файл:
# - id — латиница, цифры и дефис, уникальный. НЕ МЕНЯЙТЕ id после запуска: на него ссылаются
#   тесты в content/tasks.yaml (article_ids). Новая статья — новый id; удалённый id не используйте снова.
# - section — раздел (кнопка в боте):
#     tkani     — ткани и волокна;
#     uteplitel — утеплители и мембраны;
#     uhod      — уход за вещами;
#     svoystva  — посадка, размер, катышки;
#     prodazha  — как рассказывать о бренде и о цене.
# - title — до 60 символов; text — до 1500 символов; tags — 3–8 слов для поиска, строчными буквами.
# - Порядок в статье о материале: что это; свойства (плюсы и минусы); как объяснить покупателю
#   1–2 фразами в «ёлочках»; уход.
# - Только общеизвестные и проверяемые факты. Никаких придуманных цифр: «до какой температуры» —
#   только по маркировке производителя. Никаких медицинских обещаний («не вызывает аллергию» — нельзя).
# - Статей о конкретных брендах не пишите: список брендов придёт из 1С. Страну и историю бренда
#   не выдумывайте.
# - Нельзя символы «звёздочка» и «подчёркивание» (сообщения уходят в разметке markdown) и прямые
#   кавычки внутри строк — только «ёлочки». Эмодзи — не больше одного на статью.
# - Обращение на «вы». Выход продавца на работу — «рабочий день»; «смена» — состав продавцов.
# - Ремень к джинсам не советуйте: почти все джинсы продаются с ремнём в комплекте. Ремень — к брюкам.
# - Правила и проверка: .claude/skills/prodazhi-v-magazine/SKILL.md

articles:

  # ---------- tkani: ткани и волокна ----------

  - id: tkan-hlopok
    section: tkani
    title: "Хлопок"
    text: |
      Натуральное растительное волокно из коробочек хлопчатника. Самая частая ткань в рубашках, футболках, поло, джинсах и брюках-чинос.

      Плюсы:
      • пропускает воздух и впитывает влагу — в тепле комфортно;
      • мягкий и приятный к телу;
      • выдерживает частые стирки.

      Минусы:
      • мнётся, особенно рубашки из 100 % хлопка;
      • может сесть при горячей стирке и сушке в машине;
      • намокнув, долго сохнет.

      Если на ярлыке указан особый хлопок (например, пима или египетский) — это хлопок с длинным волокном: ткань глаже и прочнее. Говорите об этом, только если так написано на ярлыке.

      Как сказать покупателю:
      «Это хлопок — ткань дышит, в ней не жарко, и она приятна к телу».
      «Хлопок немного мнётся — это нормально для натуральной ткани, он легко отпаривается».

      Уход: стирка по ярлыку, обычно 30–40 °C; не сушить в машине, если ярлык не разрешает; гладить чуть влажным. Хлопок выдерживает высокую температуру утюга (три точки), если ярлык не говорит иначе.
    tags: [хлопок, рубашка, футболка, поло, джинсы, чинос, натуральная ткань]

  - id: tkan-len
    section: tkani
    title: "Лён"
    text: |
      Натуральное волокно из стеблей льна. Летние рубашки, брюки, пиджаки; часто в смеси с хлопком или вискозой.

      Плюсы:
      • очень хорошо пропускает воздух и быстро сохнет — одна из самых удобных тканей для жары;
      • прочный;
      • со временем становится мягче.

      Минусы:
      • сильно мнётся — это свойство льна, а не брак;
      • может сесть при горячей стирке;
      • на ощупь суше и жёстче хлопка.

      Лён в смеси с хлопком или вискозой мнётся меньше и мягче на ощупь — смотрите проценты на ярлыке.

      Как сказать покупателю:
      «Лён — для жары: в нём прохладно, ткань дышит и быстро сохнет».
      «Лён мнётся — это его особенность, так его и носят. Если хочется меньше заломов, посмотрите лён с хлопком».

      Уход: стирка по ярлыку, обычно деликатный режим без высокой температуры; не пересушивать; гладить влажным. Лён выдерживает высокую температуру утюга, если ярлык не говорит иначе.
    tags: [лён, лето, жара, рубашка, брюки, натуральная ткань]

  - id: tkan-sherst
    section: tkani
    title: "Шерсть и мериносовая шерсть"
    text: |
      Натуральное волокно, чаще всего овечья шерсть. Свитеры, джемперы, костюмы, брюки, пальто.

      Плюсы:
      • хорошо держит тепло, в том числе когда немного намокла;
      • впитывает влагу из воздуха и при этом не ощущается сырой;
      • упругая: меньше мнётся, складки расправляются, если повесить вещь на плечики;
      • долго остаётся свежей — часто достаточно проветрить вместо стирки.

      Минусы:
      • грубая шерсть может колоться;
      • боится горячей воды и трения — может свалять и сесть;
      • в местах трения появляются катышки;
      • её портит моль.

      Мериносовая шерсть — от овец породы меринос. Волокно намного тоньше обычного, поэтому ткань мягче и колется гораздо меньше. Из неё делают тонкие джемперы, водолазки, кардиганы.

      Как сказать покупателю:
      «Это шерсть мериноса — тонкая и мягкая, тёплая, но не громоздкая».
      «Шерсть греет, даже если немного промокнет под дождём».

      Не обещайте, что вещь не будет колоться: ощущения у всех разные — предложите примерить.

      Уход — в статье «Шерсть и кашемир: стирка и хранение».
    tags: [шерсть, меринос, свитер, джемпер, костюм, пальто, натуральная ткань]

  - id: tkan-kashemir
    section: tkani
    title: "Кашемир"
    text: |
      Волокно из тонкого подшёрстка кашмирских коз. Оно очень тонкое и лёгкое, поэтому вещь получается мягкой и тёплой при небольшом весе. Джемперы, водолазки, шарфы, пальто — часто в смеси с шерстью.

      Плюсы:
      • очень мягкий и приятный на ощупь;
      • тёплый при малом весе и толщине.

      Минусы:
      • деликатный: в местах трения (локти, бока, под ремнём сумки) появляются катышки, особенно в первое время носки;
      • может вытянуться при неправильной сушке;
      • нужна бережная стирка;
      • дорогое сырьё — отсюда и цена.

      Честно о составе: «кашемировый» — только если кашемир основной в составе. Если его немного, например 5–10 %, говорите «шерсть с добавлением кашемира».

      Как сказать покупателю:
      «В составе кашемир — поэтому джемпер такой мягкий и лёгкий, но тёплый».
      «Кашемиру нужен бережный уход: ручная стирка или деликатный режим и сушка в разложенном виде. Небольшие катышки легко снимаются машинкой».

      Уход — в статье «Шерсть и кашемир: стирка и хранение».
    tags: [кашемир, джемпер, водолазка, шарф, пальто, катышки, натуральная ткань]

  - id: tkan-viskoza-modal
    section: tkani
    title: "Вискоза и модал"
    text: |
      Искусственные волокна из целлюлозы — природного сырья (чаще древесины), переработанного химически. Это не синтетика из нефти, но и не природное волокно, как хлопок. Модал — разновидность вискозного волокна: мягче, прочнее во влажном виде и меньше садится.

      Где встречаются: рубашки, футболки, джемперы, подкладка пиджаков и пальто, смеси с хлопком и шерстью.

      Плюсы:
      • мягкая, гладкая, приятная на ощупь;
      • хорошо впитывает влагу, в ней не душно;
      • красиво драпируется;
      • мало электризуется.

      Минусы:
      • вискоза мнётся;
      • во влажном виде становится менее прочной — её нельзя тереть и выкручивать;
      • может сесть при горячей стирке.

      Как сказать покупателю:
      «Вискоза делается из целлюлозы — она мягкая, гладкая и хорошо дышит».
      На вопрос «Это синтетика?»: «Нет, это волокно из целлюлозы, по ощущениям оно ближе к натуральным тканям».

      Уход: деликатная стирка при невысокой температуре (по ярлыку), не выкручивать, сушить расправленной на плечиках, гладить на средней температуре.
    tags: [вискоза, модал, рубашка, подкладка, целлюлоза, искусственная ткань]

  - id: tkan-poliester
    section: tkani
    title: "Полиэстер"
    text: |
      Синтетическое волокно из продуктов переработки нефти. Самое распространённое: верх курток, подкладка, флис, утеплители, а также смеси с хлопком, шерстью, вискозой. На иностранных ярлыках — PES или PL.

      Плюсы:
      • прочный и держит форму;
      • почти не мнётся и не садится;
      • быстро сохнет;
      • в смеси делает ткань износостойкой и менее мнущейся, снижает цену вещи.

      Минусы:
      • хуже пропускает воздух и впитывает влагу, чем хлопок или шерсть, — в жару может быть жарко;
      • может электризоваться;
      • на некоторых тканях со временем появляются катышки и держатся крепко: волокно прочное и не даёт им отпасть;
      • боится горячего утюга.

      Как сказать покупателю:
      «Полиэстер здесь для прочности — вещь меньше мнётся и быстро сохнет».
      Не называйте ткань с полиэстером натуральной, но и не стесняйтесь его: у него свои полезные свойства.

      Уход: стирка по ярлыку, обычно 30–40 °C; гладить на низкой или средней температуре — как указано на ярлыке; не сушить на батарее.
    tags: [полиэстер, синтетика, куртка, подкладка, смесовая ткань]

  - id: tkan-elastan
    section: tkani
    title: "Эластан (спандекс) в составе"
    text: |
      Эластан, спандекс и лайкра — названия одного вида синтетического волокна, которое сильно растягивается и возвращается обратно. Лайкра — торговая марка эластана. На иностранных ярлыках — EL или EA.

      Обычно его в составе немного — несколько процентов. Даже 1–3 % делают ткань заметно эластичнее; чем больше процент, тем сильнее вещь тянется.

      Плюсы:
      • свобода движений: удобно садиться, наклоняться, ходить весь день;
      • вещь лучше сидит по фигуре;
      • ткань лучше возвращает форму.

      Минусы:
      • эластан боится высокой температуры: горячая стирка, сушка на батарее или в машине и горячий утюг ускоряют его старение — ткань теряет упругость и начинает вытягиваться.

      Не обещайте, что стрейч «разносится»: подбирайте размер так, чтобы было удобно сразу.

      Как сказать покупателю:
      «В составе есть эластан — брюки тянутся, в них удобно сидеть и двигаться весь день».
      «Чтобы ткань дольше держала форму, стирайте в прохладной воде и не сушите на батарее».

      Уход: стирка не горячей водой, по ярлыку; без сушки на батарее; гладить на низкой температуре.
    tags: [эластан, спандекс, лайкра, стрейч, брюки, джинсы]

  - id: tkan-denim
    section: tkani
    title: "Деним: плотность и стрейч"
    text: |
      Деним — плотная хлопковая ткань с диагональным рубчиком (саржевое переплетение). Продольные нити окрашены (классика — индиго), поперечные — белые, поэтому изнанка джинсов светлее лица.

      Плотность пишут в унциях на квадратный ярд (oz). Общепринятые ориентиры:
      • до 12 oz — лёгкий деним, для тёплой погоды;
      • 12–16 oz — средний, на большую часть года;
      • больше 16 oz — тяжёлый, очень плотный.
      Если плотность указана в г/м²: 1 oz — это примерно 34 г/м².

      Состав:
      • 100 % хлопок — плотные, держат форму, поначалу жестковаты, со временем становятся мягче;
      • хлопок с эластаном (стрейч) — тянутся, удобнее, особенно в узких моделях.

      Тёмный индиго в первое время может оставлять синеву на светлых вещах, обивке и обуви — это свойство красителя, предупредите покупателя честно.

      Как сказать покупателю:
      «Это плотный деним — джинсы хорошо держат форму».
      «Здесь есть эластан — джинсы тянутся, в них удобно садиться и ходить весь день».

      Уход — в статье «Уход за джинсами».
    tags: [деним, джинсы, плотность, унции, стрейч, индиго]

  - id: tkan-trikotazh
    section: tkani
    title: "Трикотаж: джерси, пике, футер"
    text: |
      Трикотаж — не тканое, а вязаное полотно из петель. Поэтому он тянется даже без эластана.

      • Джерси (кулирная гладь) — тонкий гладкий трикотаж: футболки, лонгсливы. Лёгкий, мягкий, тянется.
      • Пике — трикотаж с мелким рельефным узором, классика для поло.
      • Футер — гладкий снаружи, с петлями на изнанке. С начёсом изнанка пушистая и теплее. Свитшоты, худи, спортивные брюки.

      Плюсы:
      • удобно, тянется, не сковывает движений;
      • мало мнётся;
      • приятен к телу.

      Минусы:
      • может вытянуться или сесть, если стирать горячей водой и сушить на батарее;
      • на начёсе и мягком трикотаже со временем могут появиться катышки.

      Как сказать покупателю:
      «Это футер с начёсом — внутри мягко и тепло, хорошо на прохладную погоду».
      «Пике — классическая ткань для поло: рельефная и дышит».

      Уход: стирка по ярлыку, наизнанку, без высокой температуры; сушить расправленным, плотные вещи — разложив на ровной поверхности, не на батарее.
    tags: [трикотаж, джерси, пике, футер, футболка, поло, свитшот, худи]

  - id: tkan-flis
    section: tkani
    title: "Флис"
    text: |
      Синтетическое трикотажное полотно, чаще всего из полиэстера, с мягким ворсом. Кофты, жилеты, подкладка курток.

      Плюсы:
      • лёгкий и тёплый для своего веса;
      • быстро сохнет;
      • мягкий, не мнётся;
      • хорош как средний слой под куртку.

      Минусы:
      • продувается: на ветру без верхней куртки холодно;
      • может электризоваться;
      • в местах трения со временем может скатываться;
      • боится высокой температуры — утюг и батарея ему вредят.

      Как сказать покупателю:
      «Флис лёгкий и тёплый, быстро сохнет. Под куртку — то, что нужно, а от ветра защитит сама куртка».

      Уход: стирка по ярлыку, обычно 30–40 °C, наизнанку; не гладить; сушить расправленным, вдали от батареи.
    tags: [флис, кофта, жилет, полиэстер, тепло]

  - id: tkan-kostyumnaya
    section: tkani
    title: "Твид и костюмная шерсть с добавками"
    text: |
      Костюмы, пиджаки и классические брюки чаще шьют из шерстяных тканей.

      • Костюмная (камвольная) шерсть — гладкая ткань из длинных расчёсанных волокон: держит форму, мало мнётся, выглядит строго.
      • Твид — плотная шерстяная ткань из толстой пряжи, с заметной фактурой и цветными вкраплениями. Тёплый и прочный, для осенне-зимних пиджаков и пальто.
      • Маркировка Super 100's, 120's и выше, если она есть на ярлыке, говорит о тонкости шерстяного волокна: чем больше число, тем тоньше волокно и мягче ткань, но тем она деликатнее.

      Добавки в составе:
      • полиэстер — меньше мнётся, прочнее, вещь доступнее, но дышит хуже чистой шерсти;
      • вискоза — мягче, лучше драпируется;
      • эластан — ткань тянется, удобнее двигаться;
      • кашемир — мягкость; лён — лёгкость для тёплой погоды.

      Как сказать покупателю:
      «Здесь шерсть с полиэстером — костюм меньше мнётся, его удобно носить каждый день и брать в поездки».
      «Твид плотный и тёплый — пиджак на осень и зиму».

      Уход: хранить на широких плечиках; после носки дать отвисеться, отпаривать, чистить щёткой; стирать только если разрешает ярлык, чаще — химчистка.
    tags: [твид, костюм, пиджак, шерсть, камвольная, брюки]

  - id: tkan-sostav
    section: tkani
    title: "Смесовые ткани: как читать состав на ярлыке"
    text: |
      В карточке 1С состава обычно нет — смотрите ярлык на самой вещи.

      • Состав пишут в процентах. Обычно первым идёт волокно, которого больше всего.
      • Строк бывает несколько: верх, подкладка, утеплитель, отделка. Отвечайте по нужной строке — подкладка не равна ткани верха.
      • Частые сокращения на иностранных ярлыках: CO — хлопок, LI — лён, WO — шерсть, WS — кашемир, CV — вискоза, CMD — модал, PES или PL — полиэстер, PA — полиамид (нейлон), EL или EA — эластан, PAN — акрил.

      Как читать:
      • хлопок 98 %, эластан 2 % — хлопковая ткань с небольшим стрейчем;
      • шерсть 50 %, полиэстер 50 % — смесь: меньше мнётся и прочнее, но это не чистая шерсть;
      • вискоза 70 %, полиэстер 30 % — мягкая гладкая ткань, полиэстер добавляет прочности.

      Честность:
      • Называйте вещь по составу: «шерсть с полиэстером», а не «шерстяная», если шерсти меньше половины.
      • Ярлыка нет или он не читается — скажите «Сейчас уточню» и спросите администратора. Не угадывайте состав на ощупь.

      Как сказать покупателю:
      «Давайте посмотрим ярлык: здесь 80 % шерсти и 20 % полиэстера — тепло от шерсти, а полиэстер помогает держать форму».
    tags: [состав, ярлык, смесовая ткань, сокращения, честность]

  # ---------- uteplitel: утеплители и мембраны ----------

  - id: utepl-puh
    section: uteplitel
    title: "Натуральный пух и перо"
    text: |
      Пуховой утеплитель — смесь пуха и пера водоплавающих птиц, чаще гуся или утки. Что именно — смотрите на ярлыке.

      Соотношение пишут через дробь: 90/10 — 90 % пуха и 10 % пера; бывает 80/20, 70/30 и другие. Чем больше пуха, тем вещь легче и теплее при том же весе. Перо добавляет упругости, но оно тяжелее и чаще выходит наружу.

      Fill power (FP, упругость пуха) — какой объём занимает порция пуха определённого веса. Чем выше число (например, 600, 700, 800), тем пух пышнее и лучше держит тепло при меньшем весе. FP не указан — не придумывайте.

      Плюсы:
      • очень тёплый при малом весе;
      • хорошо сжимается и восстанавливает объём;
      • при правильном уходе служит долго.

      Минусы:
      • боится влаги: намокший пух слипается, хуже греет и долго сохнет;
      • нужна бережная стирка и полная сушка;
      • отдельные пёрышки могут выходить через ткань — немного это нормально.

      Как сказать покупателю:
      «Здесь 90 % пуха и 10 % пера — куртка лёгкая и тёплая».
      «Пух лучше всего греет в сухой мороз; в сырую погоду важен верх, который не пропускает воду».

      До какой температуры — только по маркировке производителя (статья «До какой температуры?»). Спрашивают про аллергию — ничего не обещайте; можно показать модели на синтетическом утеплителе.
    tags: [пух, перо, пуховик, fill power, куртка, утеплитель]

  - id: utepl-sintepon-hollofayber
    section: uteplitel
    title: "Синтепон и холлофайбер"
    text: |
      Оба — синтетические утеплители из полиэстеровых волокон.

      • Синтепон — нетканое полотно из скреплённых между собой волокон. Лёгкий, недорогой, быстро сохнет. Со временем и после частых стирок может сминаться и терять объём — тогда греет хуже.
      • Холлофайбер — полые (с пустотой внутри) извитые волокна, которые удерживают воздух. Упругий: лучше восстанавливает форму после сжатия и стирки.

      Плюсы синтетических утеплителей:
      • продолжают греть, даже если немного намокли, и быстро сохнут;
      • легко стираются;
      • вариант для тех, кто не хочет натуральный пух.

      Минусы:
      • при одинаковом тепле обычно тяжелее и объёмнее пуха.

      Количество утеплителя пишут в г/м² (например, 100, 200, 300). Чем больше, тем теплее — но только при сравнении одного и того же утеплителя. Разные утеплители по граммам напрямую не сравнить.

      Как сказать покупателю:
      «Утеплитель синтетический — куртка спокойно переносит сырую погоду, быстро сохнет и легко стирается».

      Уход: стирка по ярлыку, обычно деликатный режим при 30–40 °C; хорошо прополоскать; сушить расправленной на плечиках, не на батарее.
    tags: [синтепон, холлофайбер, утеплитель, куртка, синтетика]

  - id: utepl-tinsulate
    section: uteplitel
    title: "Thinsulate (тинсулейт) и аналоги"
    text: |
      Thinsulate — торговая марка синтетического утеплителя компании 3M. Он сделан из очень тонких микроволокон, которые удерживают много воздуха в тонком слое. Отсюда и название: thin — тонкий, insulate — утеплять.

      Плюсы:
      • тепло при небольшой толщине — куртка не выглядит громоздкой;
      • намокнув, сохраняет тепло лучше пуха;
      • быстро сохнет, легко стирается.

      Количество тоже указывают в граммах (например, 100, 150, 200 г): больше — теплее в пределах одной линейки утеплителя.

      Аналоги — другие микроволоконные утеплители, например PrimaLoft. Свойства у разных производителей разные, сравнивать их напрямую нельзя.

      Честность:
      • Называйте утеплитель тинсулейтом, только если это написано на ярлыке. Названия нет — говорите «синтетический утеплитель».
      • Цифры тепла — только из маркировки производителя.

      Как сказать покупателю:
      «Здесь тинсулейт — тонкий утеплитель: куртка не громоздкая, но тёплая и лучше пуха переносит сырость».

      Уход: как у синтетики — по ярлыку, деликатный режим, сушить расправленной.
    tags: [thinsulate, тинсулейт, primaloft, утеплитель, куртка, микроволокно]

  - id: utepl-temperatura
    section: uteplitel
    title: "«До какой температуры?» — честный ответ"
    text: |
      Самый частый вопрос о куртках. Единой шкалы нет. Тепло зависит от утеплителя и его количества, кроя, капюшона, защиты от ветра, того, что надето под низ, от того, много ли человек двигается, от влажности и ветра — и от того, мёрзнет ли он сам по себе.

      Как отвечать:
      • Производитель указал температуру на ярлыке или бирке — назовите её как есть и скажите, что это ориентир: «Производитель указывает такую температуру — это ориентир, многое зависит от того, что надето под куртку».
      • Не указал — цифру не придумывайте: «Производитель температуру не указывает, гадать не буду. Расскажу, какой здесь утеплитель, и давайте примерим с тем, что вы обычно носите под низ».
      • Спросите, как будет носить: много пешком или на машине, мёрзнет ли обычно, что надевает под низ.
      • Покажите детали, которые реально влияют на тепло: капюшон, высокий воротник, манжеты, ветрозащитная планка на молнии, длина.

      Нельзя:
      • обещать «точно не замёрзнете»;
      • называть цифры наугад или переносить их с другой модели;
      • сравнивать модели по температуре, если у них нет маркировки производителя.
    tags: [температура, куртка, пуховик, утеплитель, маркировка]

  - id: utepl-membrana
    section: uteplitel
    title: "Мембраны: водонепроницаемость и паропроницаемость"
    text: |
      Мембрана — тонкий слой на изнанке ткани верха. Она не пропускает воду снаружи, но выпускает водяной пар (испарения тела) изнутри. Известная торговая марка — Gore-Tex, есть и много других.

      Два показателя на ярлыке:
      • Водонепроницаемость — в миллиметрах водяного столба (мм): какое давление воды выдерживает ткань. Чем больше число, тем лучше ткань держит воду — в сильный дождь, на ветру, если сесть на мокрое.
      • Паропроницаемость — сколько пара ткань выпускает наружу, обычно в г/м² за 24 часа. Чем больше, тем меньше «парника» при ходьбе. Иногда указывают индекс RET — у него наоборот: чем меньше, тем лучше ткань дышит.

      Важно:
      • Воду держат не только ткань, но и швы: у серьёзных моделей швы проклеены. Непроклеенные швы могут пропускать воду.
      • Водоотталкивающая пропитка (вода собирается на ткани в капли) со временем и после стирок слабеет — её обновляют специальным средством.
      • Цифры называйте только по маркировке производителя.

      Как сказать покупателю:
      «Здесь мембрана: вода снаружи не проходит внутрь, а пар от тела выходит — под курткой не так душно».

      Уход: стирка по ярлыку специальным средством для мембран, без кондиционера и отбеливателя — они могут испортить мембрану.
    tags: [мембрана, водонепроницаемость, паропроницаемость, куртка, дождь, gore-tex]

  # ---------- uhod: уход за вещами ----------

  - id: uhod-simvoly
    section: uhod
    title: "Символы ухода на ярлыке"
    text: |
      На ярлыке обычно пять групп значков. Перечёркнутый значок — нельзя.

      • Таз с водой — стирка. Цифра — наибольшая температура воды; иногда вместо цифры точки: одна — 30 °C, две — 40 °C, три — 50 °C, четыре — 60 °C. Черта под тазом — деликатный режим, две черты — очень деликатный. Рука в тазу — только ручная стирка.
      • Треугольник — отбеливание. Пустой — можно; с двумя косыми линиями — только без хлора.
      • Квадрат — сушка. Круг в квадрате — сушильная машина (одна точка — пониженная температура, две — обычная). Горизонтальная черта в квадрате — сушить разложив; вертикальные черты или дуга сверху — сушить в подвешенном виде.
      • Утюг — глажка: одна точка — низкая температура (около 110 °C), две — средняя (около 150 °C), три — высокая (около 200 °C).
      • Круг — профессиональная чистка: буквы P и F — химчистка, W — профессиональная аквачистка. Перечёркнутый круг — химчистка запрещена.

      Как сказать покупателю:
      «Посмотрим ярлык: стирка при 30 градусах, деликатный режим, гладить на средней температуре — уход простой».

      Значок непонятен — не угадывайте, скажите «Сейчас уточню».
    tags: [уход, ярлык, символы, стирка, глажка, химчистка]

  - id: uhod-sherst-kashemir
    section: uhod
    title: "Шерсть и кашемир: стирка и хранение"
    text: |
      • Чаще проветривайте, чем стирайте: шерсти и кашемиру часто достаточно повисеть на свежем воздухе.
      • Стирка — только как разрешает ярлык: ручная или программа для шерсти, прохладная вода, средство для шерсти. Не тереть, не выкручивать, не замачивать надолго: от трения и перепада температуры шерсть сваливается и садится.
      • Отжим — слегка: завернуть в махровое полотенце и промокнуть.
      • Сушка — в расправленном виде на горизонтальной поверхности, вдали от батареи и солнца. На плечиках мокрый джемпер вытянется.
      • Хранение — трикотаж сложенным на полке, а не на плечиках. Пиджаки и пальто — на широких плечиках.
      • На сезон убирайте только чистые вещи: моль охотнее портит грязную шерсть. Используйте дышащий чехол и средство от моли.
      • Катышки снимайте машинкой для катышков или специальной щёткой, не отрывайте руками.
      • Шерстяные костюмы и пальто обычно не стирают — химчистка по ярлыку; между носками дайте вещи отвисеться на плечиках, отпарьте, почистите щёткой.

      Как сказать покупателю:
      «Шерсти часто хватает проветривания. Стирать — вручную или на программе для шерсти, сушить разложив на полотенце».
    tags: [уход, шерсть, кашемир, стирка, хранение, моль, катышки]

  - id: uhod-dzhinsy
    section: uhod
    title: "Уход за джинсами"
    text: |
      • Стирайте по мере загрязнения, а не после каждой носки — так дольше сохраняется цвет.
      • Перед стиркой выверните наизнанку и застегните молнию и пуговицу: меньше потёртостей и потери цвета.
      • Температура — по ярлыку, обычно не выше 30–40 °C. Горячая вода — риск усадки и потери цвета, у стрейча — ещё и потери упругости.
      • Новые и тёмные джинсы первые разы стирайте отдельно или с тёмными вещами: индиго может окрашивать.
      • Сушите в расправленном виде, не на батарее. Сушильная машина — только если разрешает ярлык: возможна усадка.
      • Гладьте наизнанку, на температуре по ярлыку.
      • Новые тёмные джинсы могут оставлять синеву на светлой обивке и обуви — это свойство красителя.

      Как сказать покупателю:
      «Стирайте наизнанку в прохладной воде и не сушите на батарее — так цвет и посадка сохранятся дольше».
      «Первые стирки — отдельно от светлых вещей: тёмный деним может немного красить».
    tags: [джинсы, деним, уход, стирка, индиго, усадка]

  - id: uhod-puhovik
    section: uhod
    title: "Пуховик: стирка, сушка, хранение"
    text: |
      • Сначала ярлык: можно ли стирать или нужна только химчистка.
      • Стирка: застегните молнии и кнопки, выверните наизнанку. Деликатная программа (во многих машинах есть режим для пуховиков), прохладная вода, жидкое средство для пуха. Обычный порошок плохо вымывается из пуха; кондиционер и отбеливатель не нужны.
      • Добавьте лишнее полоскание, отжим — на низких оборотах.
      • В барабан можно положить теннисные мячики или специальные шарики — они разбивают комки пуха.
      • Сушка: пух должен высохнуть полностью, иначе слипнется и может появиться неприятный запах. Сушите расправленным, время от времени взбивая. Сушильная машина — только если разрешает ярлык, на низкой температуре, с шариками. Не на батарее.
      • Хранение: только чистым и сухим, на плечиках или свободно сложенным, в дышащем чехле. Не держите долго сжатым в вакуумном пакете — пух теряет упругость.
      • Куртки на синтетическом утеплителе стирать проще — тоже по ярлыку.

      Как сказать покупателю:
      «Если ярлык разрешает, пуховик можно стирать: деликатный режим, средство для пуха, потом хорошо высушить и взбить».
    tags: [пуховик, пух, стирка, сушка, хранение, уход]

  - id: uhod-remen
    section: uhod
    title: "Кожаный ремень: подбор и уход"
    text: |
      Ремень предлагаем к брюкам. К джинсам — нет: почти все джинсы уже продаются с ремнём в комплекте.

      Подбор:
      • Цвет — под обувь: к чёрной обуви чёрный ремень, к коричневой — коричневый.
      • Удобно, когда ремень застёгивается на среднее отверстие: остаётся запас в обе стороны.
      • Кожаный ремень или нет — только по ярлыку или маркировке. Не называйте ремень кожаным, если это не указано.

      Уход:
      • Храните подвешенным за пряжку или свободно свёрнутым; не перегибайте в одном месте.
      • Не мочите. Намок — сушите при комнатной температуре, не на батарее и не феном: кожа пересыхает и трескается.
      • Время от времени протирайте слегка влажной салфеткой и обрабатывайте кремом для гладкой кожи — бесцветным или в тон.
      • Пряжку протирайте сухой мягкой тканью.
      • Если носить два ремня по очереди, каждый меньше деформируется.

      Как сказать покупателю:
      «Обувь будете носить чёрную или коричневую? Подберу ремень в тон».
      «Ремень лучше хранить подвешенным и не сушить на батарее — так кожа дольше не потрескается».
    tags: [ремень, кожа, уход, брюки, пряжка, обувь]

  # ---------- svoystva: посадка, размер, катышки ----------

  - id: svoystva-posadka
    section: svoystva
    title: "Посадка: slim, regular, relaxed и другие"
    text: |
      Посадка (fit) — как вещь сидит по фигуре. Её пишут на ярлыке или в названии модели. У разных брендов одна и та же посадка может сидеть по-разному — точный ответ даёт примерка.

      Брюки и джинсы:
      • Skinny — очень узкие, плотно облегают ногу.
      • Slim — зауженные, по фигуре, без лишнего объёма.
      • Regular, classic — классические, прямые, свободные в меру.
      • Straight — прямая штанина от бедра до низа.
      • Tapered — свободнее в бёдрах, сужаются к низу.
      • Relaxed, loose — свободные, с запасом в бёдрах и по ноге.
      Посадку на талии (rise) — низкую, среднюю, высокую — тоже иногда указывают на ярлыке.

      Рубашки и пиджаки:
      • Slim — приталенные.
      • Regular — прямой силуэт, свободнее в талии.

      Как подобрать:
      • Спросите: «Как любите, чтобы сидело — по фигуре или свободнее?»
      • Принесите две посадки и сравните: «Давайте сравним — посмотрите, в какой удобнее».
      • Не оценивайте фигуру покупателя вслух. Говорите о вещи: «Эта модель сидит свободнее в бёдрах».
    tags: [посадка, slim, regular, relaxed, джинсы, брюки, рубашка]

  - id: svoystva-razmer
    section: svoystva
    title: "Размер и «маломерит / большемерит»"
    text: |
      Размер на ярлыке бывает в разных системах:
      • российский — 46, 48, 50 и т. д.;
      • буквенный — S, M, L, XL;
      • у джинсов — W и L: W — обхват талии в дюймах, L — длина по внутреннему шву в дюймах, например W32 L34;
      • у рубашек часто — обхват шеи в сантиметрах (39, 40, 41…).

      Таблицы соответствия у брендов разные, поэтому один и тот же размер сидит по-разному. Точный ответ — только примерка.

      Как подбирать:
      • Спросите, какой размер покупатель обычно носит и как любит, чтобы сидело.
      • Принесите этот размер и соседний — сравнить.
      • Проверьте посадку: брюки — присесть и шагнуть; пиджак — плечи и рукав; рубашка — палец в воротник.

      «Маломерит» и «большемерит»:
      • Говорите только по факту примерки этой модели: «В этой модели вам лучше подошёл 50, хотя обычно вы берёте 48».
      • Не говорите заранее, что «бренд маломерит», если сами не проверяли.
      • Не обещайте, что вещь «разносится» или «сядет по фигуре».
      • Заметили, что модель многим сидит не по их обычному размеру, — скажите администратору и коллегам по смене, чтобы все советовали точнее.
    tags: [размер, примерка, маломерит, большемерит, джинсы, рубашка]

  - id: svoystva-katyshki
    section: svoystva
    title: "Катышки: почему появляются и что сказать"
    text: |
      Катышки — маленькие комочки из коротких волокон, которые выходят на поверхность ткани и скручиваются от трения.

      Почему появляются:
      • трение: локти, бока, места под ремнём сумки, внутренняя сторона бёдер;
      • короткие и тонкие волокна — кашемир, мягкая шерсть, начёс;
      • рыхлая вязка или пряжа;
      • смеси с синтетикой: прочное синтетическое волокно удерживает катышек, и он не отпадает сам.

      Что сказать честно:
      «На мягком трикотаже в местах трения со временем могут появиться катышки — это свойство мягких волокон. Их легко снять машинкой для катышков, и вещь снова выглядит аккуратно».
      • Не обещайте, что катышков «не будет никогда».
      • Покупатель пришёл с претензией — не спорьте и не решайте сами, брак это или нет: позовите администратора.

      Как уменьшить:
      • стирать наизнанку на деликатном режиме, отдельно от джинсов и вещей с молниями и липучками;
      • не тереть, сушить разложив;
      • снимать машинкой или щёткой, не отрывать руками.
    tags: [катышки, трикотаж, шерсть, кашемир, уход, претензия]

  # ---------- prodazha: как рассказывать о бренде и цене ----------

  - id: prodazha-brend
    section: prodazha
    title: "Как рассказывать о бренде, если о нём мало известно"
    text: |
      В карточке 1С есть бренд и цвет, но нет ни истории бренда, ни, как правило, состава. Это нормально: говорите только о том, что проверено.

      Что можно говорить:
      • то, что написано на ярлыке и бирке: бренд, страна производства, состав, уход, посадка;
      • то, что сказал администратор.

      Чего нельзя:
      • придумывать историю бренда, называть его «итальянским» или «премиальным», сравнивать с известными марками, если вы этого точно не знаете;
      • путать страну производства со страной бренда: на ярлыке указано, где вещь сшита, а бренд может быть из другой страны.

      Спрашивают, а вы не знаете:
      «Про историю бренда точно не скажу — могу уточнить у администратора. А вот что видно по самой вещи…» — и переходите к ткани, посадке, швам, фурнитуре.

      Говорите о вещи, а не о громком имени: состав, посадку, ровные швы, качество фурнитуры покупатель проверит руками и на примерке — это убеждает лучше.

      Узнали проверенный факт о бренде от администратора — расскажите коллегам по смене.
    tags: [бренд, ярлык, страна производства, честность, презентация]

  - id: prodazha-cena-tkan
    section: prodazha
    title: "Как говорить о цене через свойства ткани"
    text: |
      Цена понятна, когда покупатель видит, за что платит. Переводите состав с ярлыка в пользу: свойство → что это даёт покупателю.

      Примеры:
      • Шерсть: «Шерсть греет, даже если немного промокнет, и её часто достаточно проветрить вместо стирки».
      • Меринос, кашемир: «Тонкое волокно — мягко, тепло и без лишнего объёма».
      • Лён: «Лён для жары: дышит и быстро сохнет».
      • Эластан в брюках: «Брюки тянутся — удобно сидеть и двигаться весь день».
      • Плотный деним: «Плотная ткань — джинсы дольше держат форму».
      • Пух 90/10: «Много пуха — куртка лёгкая и тёплая».
      • Мембрана: «Вода снаружи не проходит, а пар от тела выходит — под курткой не душно».

      Сравнение: покажите рядом две вещи — доступнее и дороже — и объясните разницу по ярлыкам: «В этой — шерсть с полиэстером, в этой — чистая шерсть: она лучше дышит и держит тепло. Выбирайте, что для вас важнее».

      Правила:
      • Только то, что написано на ярлыке. Состава нет — не угадывайте.
      • Не преувеличивайте: «вечная», «совсем не мнётся», «никогда не будет катышков».
      • Никаких обещаний о здоровье: «не вызывает аллергию», «полезно для кожи» — нельзя.
      • Названный бюджет уважайте: внутри него тоже можно показать лучший вариант.
    tags: [цена, ценность, состав, ткань, возражения, дорого]
