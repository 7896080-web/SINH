# Задания продавцам AWER, которые бот рассылает по расписанию: тесты, опросы и чек-листы.
#
# СТАТУС: черновик (18.10.2026). Перед запуском его должен просмотреть владелец.
#
# Как править этот файл:
# - id — латиница, цифры и дефис, уникальный во всём файле. НЕ МЕНЯЙТЕ id после запуска: по нему
#   бот помнит, что уже отправлял и какие ответы получил. Новое задание — новый id.
# - title — до 60 символов; текст вопроса q — до 200 символов.
# - tests — тест с правильными ответами:
#     4–6 вопросов, у каждого ровно 3 варианта до 60 символов (они станут кнопками);
#     correct — номер верного варианта, считая с 0 (0 — первый, 1 — второй, 2 — третий);
#     верный ответ ставьте на разные позиции; explain — до 200 символов: почему верно и чем плохи остальные;
#     article_ids — id статей из content/knowledge.yaml, которые нужно прочитать перед тестом.
# - surveys — опрос без правильных ответов: 2–4 вопроса; options — кнопки (до 60 символов);
#     free_text: true — можно ответить своими словами вместо кнопки.
# - checklists — чек-лист: 5–10 пунктов до 60 символов, продавец отмечает их кнопками.
# - Нельзя символы «звёздочка» и «подчёркивание» (разметка markdown) и прямые кавычки внутри строк —
#   только «ёлочки». Обращение на «вы».
# - Выход продавца на работу — «рабочий день»; «смена» — состав продавцов одного магазина.
# - Ремень к джинсам не советуйте: почти все джинсы продаются с ремнём в комплекте. Ремень — к брюкам.
# - Не выдумывайте факты о магазине: цены, бренды, акции, условия карты, правила кассы.
# - Правила и проверка: .claude/skills/prodazhi-v-magazine/SKILL.md

tests:

  - id: test-tkani-1
    title: "Ткани: основы"
    article_ids: [tkan-len, tkan-poliester, tkan-flis, tkan-elastan, tkan-viskoza-modal, tkan-sherst, tkan-kashemir, tkan-sostav]
    questions:
      - q: "Покупатель ищет рубашку на жаркое лето. Какая ткань прохладнее?"
        options: ["Лён", "Полиэстер", "Флис"]
        correct: 0
        explain: "Лён хорошо пропускает воздух и быстро сохнет. Полиэстер дышит хуже натуральных тканей, а флис — тёплый материал для холода."
      - q: "На ярлыке брюк: хлопок 97 %, эластан 3 %. Что даёт эластан?"
        options: ["Брюки совсем не мнутся", "Ткань тянется, удобно сидеть и двигаться", "Брюки теплее зимой"]
        correct: 1
        explain: "Эластан делает ткань эластичной: свобода движений и посадка по фигуре. От мятости и холода он не спасает."
      - q: "Покупатель спрашивает, синтетика ли вискоза. Что ответить?"
        options: ["Да, это синтетика из нефти", "Это природное волокно, как хлопок", "Нет, это волокно из целлюлозы"]
        correct: 2
        explain: "Вискозу делают из целлюлозы, чаще древесины, с химической обработкой. Это не синтетика из нефти, но и не природное волокно, как хлопок."
      - q: "В джемпере 90 % шерсти и 10 % кашемира. Как честно его назвать?"
        options: ["«Кашемировый джемпер»", "«Шерсть с добавлением кашемира»", "«Чистый кашемир»"]
        correct: 1
        explain: "Называйте вещь по составу: основа здесь — шерсть. Преувеличение подрывает доверие, а покупатель может прочитать ярлык сам."
      - q: "Чем мериносовая шерсть отличается от обычной?"
        options: ["Это синтетика, похожая на шерсть", "Её можно стирать горячей водой", "Волокно тоньше — мягче, меньше колется"]
        correct: 2
        explain: "Меринос — порода овец с очень тонкой шерстью. Ткань мягче и колется меньше, но это та же шерсть: горячая вода и трение ей вредят."
      - q: "Покупатель спрашивает состав, а ярлыка на вещи нет. Что делать?"
        options: ["Сказать «Сейчас уточню» и спросить администратора", "Определить состав на ощупь", "Сказать, что это хлопок"]
        correct: 0
        explain: "Состава в карточке 1С обычно нет, а на ощупь его не определить. Честное «сейчас уточню» лучше ответа наугад."

  - id: test-uteplitel-1
    title: "Утеплители и мембраны"
    article_ids: [utepl-puh, utepl-sintepon-hollofayber, utepl-tinsulate, utepl-temperatura, utepl-membrana]
    questions:
      - q: "На ярлыке пуховика: пух/перо 90/10. Что это значит?"
        options: ["90 % пера и 10 % пуха", "Утеплителя 90 г/м²", "90 % пуха и 10 % пера"]
        correct: 2
        explain: "Первое число — доля пуха, второе — пера. Чем больше пуха, тем куртка легче и теплее при том же весе."
      - q: "Что показывает fill power (FP) пуха?"
        options: ["Упругость пуха: выше — теплее при том же весе", "Долю пера в смеси", "До какой температуры греет куртка"]
        correct: 0
        explain: "FP — насколько пух пышный. Чем выше число, тем лучше он держит тепло при меньшем весе. Температуру FP не показывает."
      - q: "Спрашивают: «До скольки градусов эта куртка?» На ярлыке температуры нет. Ваш ответ?"
        options: ["Назвать цифру по своему опыту", "Сказать честно и рассказать об утеплителе", "«До минус 30, как у всех курток»"]
        correct: 1
        explain: "Без маркировки производителя цифру называть нельзя: тепло зависит от утеплителя, кроя и того, что надето под низ. Расскажите об утеплителе и предложите примерить."
      - q: "Чем синтетический утеплитель удобнее пуха в сырую погоду?"
        options: ["Он всегда теплее пуха", "Ему не нужен никакой уход", "Греет, даже немного намокнув, быстро сохнет"]
        correct: 2
        explain: "Намокший пух слипается и хуже греет, а синтетика продолжает греть и быстро сохнет. Но при том же тепле она обычно тяжелее, а уход — по ярлыку."
      - q: "Водонепроницаемость мембраны указана в миллиметрах. Что это значит?"
        options: ["Больше число — лучше ткань держит воду", "Это толщина мембраны", "Сколько пара выходит наружу"]
        correct: 0
        explain: "Миллиметры водяного столба — давление воды, которое выдерживает ткань. Пар указывают отдельно, обычно в г/м² за 24 часа."
      - q: "На ярлыке куртки нет слова Thinsulate. Можно назвать утеплитель тинсулейтом?"
        options: ["Да, если куртка тонкая и тёплая", "Нет, сказать «синтетический утеплитель»", "Да, все тонкие утеплители так зовут"]
        correct: 1
        explain: "Thinsulate — торговая марка компании 3M. Называйте утеплитель так, только если это написано на ярлыке."

  - id: test-uhod-1
    title: "Уход за вещами"
    article_ids: [uhod-simvoly, uhod-sherst-kashemir, uhod-dzhinsy, uhod-puhovik, svoystva-katyshki]
    questions:
      - q: "На ярлыке утюг с тремя точками. Что это значит?"
        options: ["Гладить только на низкой температуре", "Можно гладить при высокой температуре", "Гладить нельзя"]
        correct: 1
        explain: "Три точки — высокая температура, около 200 °C: так обычно гладят хлопок и лён. Одна точка — низкая, перечёркнутый утюг — гладить нельзя."
      - q: "Как сушить шерстяной джемпер после стирки?"
        options: ["На плечиках у батареи", "В сушильной машине на максимуме", "Разложить на ровной поверхности"]
        correct: 2
        explain: "Мокрая шерсть на плечиках вытягивается, а от жара садится. Сушите разложив, вдали от батареи и солнца."
      - q: "Как посоветовать стирать новые тёмные джинсы?"
        options: ["Наизнанку, отдельно от светлых вещей", "С белыми рубашками — так быстрее", "Горячей водой, чтобы сели по фигуре"]
        correct: 0
        explain: "Индиго в первое время может окрашивать, а горячая вода даёт усадку и потерю цвета. Наизнанку и в прохладной воде цвет держится дольше."
      - q: "Что означает перечёркнутый круг на ярлыке?"
        options: ["Нельзя сушить в машине", "Химчистка запрещена", "Нельзя отбеливать"]
        correct: 1
        explain: "Круг — профессиональная чистка, перечёркнутый — химчистка запрещена. Сушку обозначает квадрат, отбеливание — треугольник."
      - q: "Покупатель спрашивает, как хранить пуховик летом. Что посоветовать?"
        options: ["Плотно сжать в вакуумном пакете", "Убрать, даже если чуть влажный", "Чистым и сухим, в дышащем чехле"]
        correct: 2
        explain: "Влажный пух слипается, может появиться запах, а в сжатом виде пух теряет упругость. Храните пуховик чистым, сухим и свободно."
      - q: "Что сказать о катышках на мягком джемпере?"
        options: ["Честно: от трения бывают, снимаются машинкой", "Обещать, что катышков не будет", "Сказать, что это всегда брак"]
        correct: 0
        explain: "Катышки — свойство мягких волокон. Не обещайте невозможного и не решайте сами, брак ли это: при претензии позовите администратора."

  # Вопросы — по урокам content/lessons.yaml: kontakt-1, potrebnost-1, obraz-2, vozvrat-1, vozrazheniya-1, zavershenie-1.
  - id: test-prodazhi-1
    title: "Этапы продажи"
    article_ids: [svoystva-razmer, prodazha-cena-tkan]
    questions:
      - q: "Покупатель только вошёл в магазин. Как лучше начать?"
        options: ["«Вам что-нибудь подсказать?»", "«Понадобится размер или совет — я рядом»", "Сразу идти за ним по залу"]
        correct: 1
        explain: "На «Вам что-нибудь подсказать?» почти всегда отвечают «нет». Фраза «я рядом» оставляет дверь открытой, а ходить следом — давление."
      - q: "Какой вопрос помогает выявить потребность?"
        options: ["«Для какого случая подбираете?»", "«Брать будете?»", "«Вам чёрные подойдут?»"]
        correct: 0
        explain: "На открытый вопрос отвечают развёрнуто: повод, стиль, с чем носить. На закрытые отвечают «да» или «нет», и разговор быстро заканчивается."
      - q: "Покупатель берёт джинсы. Что уместно предложить к ним?"
        options: ["Ремень в тон обуви", "Галстук", "Футболку, поло или рубашку"]
        correct: 2
        explain: "Почти все джинсы уже продаются с ремнём в комплекте, а галстук с ними обычно не носят. К джинсам — футболка, поло, рубашка, в холод — свитшот или джемпер."
      - q: "Покупатель сомневается между двумя размерами. Что делать?"
        options: ["Принести оба и сравнить на примерке", "Посоветовать меньший — разносится", "Посоветовать больший — с запасом"]
        correct: 0
        explain: "Точный ответ даёт только примерка. «Разносится» и «с запасом» — советы наугад, которые часто заканчиваются возвратом."
      - q: "Покупатель говорит «дорого». Что сделать первым?"
        options: ["Сразу предложить скидку", "Уточнить, что смущает — цена или вещь", "Согласиться и отойти"]
        correct: 1
        explain: "Сначала поймите причину: сомнение в пользе или бюджет. Покажите ценность или вариант доступнее; скидка — последний аргумент."
      - q: "Когда предлагать дисконтную карту?"
        options: ["При входе в магазин", "Только если покупатель спросит", "На кассе каждому, у кого её нет"]
        correct: 2
        explain: "На кассе предложение уместно: покупка сделана, и понятно, зачем карта. Если ждать вопроса, многие о карте так и не узнают."

surveys:

  - id: opros-den-1
    title: "Как прошёл рабочий день"
    questions:
      - q: "Как прошёл ваш рабочий день?"
        options: ["Хорошо", "Нормально", "Тяжело"]
        free_text: false
      - q: "Что больше всего мешало продавать? Можно выбрать кнопку или написать своими словами."
        options: ["Не было нужных размеров", "Не было нужных моделей", "Мало покупателей", "Ничего не мешало"]
        free_text: true
      - q: "Чего не хватило из ассортимента или размеров? Напишите модель, размер или цвет, о которых спрашивали покупатели."
        options: ["Всего хватило"]
        free_text: true

  - id: opros-pokupateli-1
    title: "Вопросы покупателей без ответа"
    questions:
      - q: "Были ли сегодня вопросы покупателей, на которые вы не смогли ответить?"
        options: ["Да, несколько", "Да, один", "Нет"]
        free_text: false
      - q: "О чём чаще всего спрашивали?"
        options: ["Состав и ткань", "Утеплитель и температура", "Бренд и страна", "Размер и посадка", "Уход за вещью"]
        free_text: true
      - q: "Напишите вопрос покупателя своими словами — так мы поймём, что добавить в обучение."
        options: ["Пропустить"]
        free_text: true

  - id: opros-bot-1
    title: "Сообщения бота: удобно ли"
    questions:
      - q: "Удобно ли вам получать сообщения бота?"
        options: ["Да, всё удобно", "В целом да, но много текста", "Неудобно"]
        free_text: false
      - q: "Что в сообщениях бота для вас полезнее всего?"
        options: ["План и сколько осталось", "Советы и уроки", "Новые поступления", "Рекорды и цель недели"]
        free_text: false
      - q: "Что улучшить в боте? Напишите своими словами."
        options: ["Всё устраивает"]
        free_text: true

checklists:

  - id: check-otkrytie
    title: "Открытие магазина"
    items:
      - "Внешний вид — по стандарту магазина"
      - "Прочитано утреннее сообщение бота: план и совет"
      - "Зал: вещи сложены, размеры на своих местах"
      - "Манекены одеты, образы собраны полностью"
      - "Примерочные чистые и свободные"
      - "Ценники на месте и хорошо читаются"
      - "Новые поступления из сообщения бота найдены в зале"
      - "Касса готова к работе — по правилам магазина"
      - "С коллегами по смене распределены зоны зала"

  - id: check-zakrytie
    title: "Закрытие магазина"
    items:
      - "Вещи из примерочных возвращены на места"
      - "Зал: вещи сложены, размеры разложены по порядку"
      - "Примерочные проверены: покупатели ничего не забыли"
      - "Во всех продажах за день указан продавец"
      - "Касса закрыта по правилам магазина"
      - "Нехватка размеров и вопросы покупателей — администратору"
      - "Отложенные вещи, если есть, подписаны и убраны"
      - "Свет и техника выключены по правилам магазина"

  - id: check-postuplenie
    title: "Новое поступление"
    items:
      - "Вещи распакованы, при необходимости отпарены"
      - "Выложены в зале по категориям и размерам"
      - "На каждой вещи есть ценник"
      - "Сомнения в ценах уточнены у администратора"
      - "Размеры проверены: каких нет — сказано администратору"
      - "Изучены ярлыки: состав, уход, страна производства"
      - "Непонятные ткани и утеплители прочитаны в базе знаний"
      - "К каждой новинке придумано сочетание из того, что есть"
