    title: "Рабочий день 7. Возражения"
    text: |
      «Дорого» и «я подумаю» — не отказ, а сомнение. Выясните, в чём оно, не споря и не давя.

      «Дорого»:
      • «Понимаю. Что смущает — цена или сама вещь?»
      • Расскажите о пользе: ткань, посадка, срок службы.
      • Предложите вариант доступнее: «Есть похожая модель дешевле — показать?»

      «Я подумаю»:
      • «Конечно. Что понравилось, а в чём сомневаетесь?»
      • Помогите снять сомнение: другой размер, цвет, сочетание.

      Нельзя: спорить, говорить «последний размер» или «завтра подорожает», если это неправда, и первым делом предлагать скидку. Отпустите покупателя с хорошим впечатлением — он вернётся.
    try_today: "Сегодня на каждое «дорого» или «я подумаю» задайте один уточняющий вопрос и выслушайте ответ до конца."

  - shift: 8
    title: "Рабочий день 8. Касса и дисконтные карты"
    text: |
      Касса — последнее впечатление о магазине. Здесь всё должно быть быстро, точно и честно.

      • Попросите администратора показать, как оформлять продажу, оплату и дисконтную карту. Первые продажи проводите под его присмотром.
      • Узнайте точные условия дисконтной карты, чтобы объяснять их без ошибок.
      • Всегда спрашивайте: «У вас есть наша дисконтная карта? Если нет — могу оформить».
      • Ручные скидки — только по правилам магазина. Сначала предлагайте карту.
      • Убедитесь, что в продаже продавцом указаны вы: продажа без продавца не попадёт ни в чей план.
      • Выдайте чек, поблагодарите и пригласите снова.
    try_today: "Сегодня узнайте у администратора условия дисконтной карты и предложите её каждому покупателю, у которого её ещё нет."

  - shift: 9
    title: "Рабочий день 9. Возвраты — вежливо и по закону"
    text: |
      Возврат и обмен — права покупателя по Закону о защите прав потребителей. Наша задача — оформить их спокойно и вежливо, без споров и уговоров.

      • Встречайте так же доброжелательно, как при покупке: «Здравствуйте! Давайте посмотрим, чем могу помочь».
      • Вещь надлежащего качества, не подошедшую по размеру, фасону или цвету, можно обменять в течение 14 дней, не считая дня покупки, если её не носили и сохранены товарный вид и ярлыки. Если подходящей замены нет, покупатель вправе получить деньги. Для вещей с браком правила свои.
      • Как оформлять — покажет администратор. Сомневаетесь — позовите его, а не отказывайте сами.
      • Обмен можно предложить, но не навязывать.
    try_today: "Узнайте у администратора, как оформляются обмен и возврат и к кому обращаться, если случай непростой."

  - shift: 10
    title: "Рабочий день 10. Ваши цифры в утреннем сообщении"
    text: |
      Каждое утро бот присылает итоги вчерашнего дня. Как их читать:

      • Базовый план — сколько нужно продать за месяц с учётом ваших рабочих дней.
      • До базы осталось — сколько ещё продать до плана и сколько это в среднем за рабочий день.
      • До ступени — сумма до следующей ступени (115%, 130% …) и ставка на ней. Каждые +15% сверх плана — прибавка к ставке.
      • Ваш темп — сколько вы продаёте в среднем за рабочий день и каким будет выполнение и ставка, если так продолжать.
      • Вы / команда — ваши показатели рядом со средними по команде. Это подсказка, где расти.
      • Совет — над чем поработать в первую очередь.

      Раз в неделю бот пришлёт урок по теме, где у вас больше всего возможностей для роста.
    try_today: "Откройте сегодняшнее сообщение бота и сравните «Ваш темп» с суммой за рабочий день в строке «До базы осталось»: вы впереди или догоняете?"
