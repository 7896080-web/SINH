  - shift: 3
    title: "Рабочий день 3. Приветствие"
    text: |
      Сегодня тренируем первый контакт. Цель — чтобы покупатель почувствовал: ему рады и на него не давят.

      • Здоровайтесь с каждым в первые секунды: взгляд, улыбка, «Здравствуйте!».
      • Вместо «Вам что-нибудь подсказать?» скажите: «Если понадобится размер или совет — я рядом».
      • Дайте осмотреться. Подходите, когда покупатель задержался у вещи, взял её в руки или ищет продавца.
      • Начинайте с вещи: «Хорошая модель. Подобрать ваш размер?»
      • Услышали «я просто смотрю» — ответьте «Конечно, смотрите, я рядом» и действительно отойдите.

      Постоянных покупателей узнавайте и приветствуйте особенно тепло.
    try_today: "Поздоровайтесь с каждым, кто войдёт в магазин, в первые секунды и хотя бы пять раз скажите «Если понадобится размер или совет — я рядом»."

  - shift: 4
    title: "Рабочий день 4. Выявление потребности"
    text: |
      Хороший продавец сначала спрашивает, потом показывает. Задавайте открытые вопросы — на них нельзя ответить «да» или «нет».

      • Повод: «Для какого случая подбираете?»
      • Стиль: «Что обычно носите — классику или посвободнее?»
      • Гардероб: «С чем будете носить? Что у вас уже есть?»
      • Размер и посадка: «Какой размер обычно берёте? Как любите, чтобы сидело — свободнее или по фигуре?»

      Слушайте внимательно и повторите главное: «Значит, нужны тёмные брюки в офис, к серому пиджаку, верно?»

      Не задавайте все вопросы подряд, как по анкете: это разговор, а не допрос.
    try_today: "Сегодня с каждым покупателем выясните повод и с чем он будет носить вещь, прежде чем что-то показывать."

  - shift: 5
    title: "Рабочий день 5. Примерочная"
    text: |
      В примерочной принимается решение о покупке. Здесь же можно предотвратить большинство возвратов.

      • Предлагайте примерить всегда: «Давайте примерим — сразу будет видно посадку».
      • Проводите покупателя, покажите, куда повесить вещи, заранее принесите соседний размер.
      • Пока покупатель переодевается, будьте рядом, но не стойте у шторки. Спросите: «Как по размеру? Принести другой?»
      • Проверьте посадку: брюки — присесть и сделать шаг; пиджак — плечи и длина рукава; рубашка — воротник.
      • Говорите честно: если сидит плохо, предложите другой размер или модель.
      • После примерки верните вещи на место.
    try_today: "Сегодня каждому, кто идёт в примерочную, заранее принесите соседний размер, а после примерки спросите, как сидит."

  - shift: 6
    title: "Рабочий день 6. Образ и допродажа"
    text: |
      Покупатель носит не одну вещь, а образ. Помогите его собрать — это и забота о покупателе, и рост ваших продаж.

      • К брюкам — ремень: «Обувь будете носить чёрную или коричневую? Подберу ремень в тон». И носки в тон.
      • К пиджаку и костюму — рубашка и галстук.
      • К джинсам — футболка, поло, рубашка или свитшот; на холодное время — джемпер. Ремень к джинсам не предлагайте: почти все джинсы уже продаются с ремнём в комплекте.
      • Приносите вторую вещь в примерочную, чтобы покупатель увидел сочетание.

      Правила: одно-два предложения, только то, что действительно подходит, отказ принимаем спокойно. В утреннем сообщении бот покажет, сколько у вас вещей за рабочий день или в чеке по сравнению с командой.
    try_today: "Сегодня к каждой основной покупке предложите одно дополнение или вторую вещь для образа."

