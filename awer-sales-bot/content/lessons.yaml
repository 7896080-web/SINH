# Учебный контент для продавцов AWER: «урок недели», квизы и программа первых 10 рабочих дней новичка.
#
# СТАТУС: черновик по общей практике розничных продаж одежды. Перед запуском его должен
# просмотреть владелец. Если у магазина появится свой стандарт обслуживания — он главнее,
# уроки нужно привести в соответствие с ним.
#
# Как править этот файл:
# - id урока — латиница, цифры и дефис, уникальный. НЕ МЕНЯЙТЕ id после запуска: по нему бот
#   помнит, какие уроки уже отправлял. Новый урок — новый id. Удалённый id не используйте снова.
# - topic — тема, по которой бот выбирает урок недели:
#     items     — мало вещей в чеке / за рабочий день (образ, вторая вещь, дополнения);
#     avg_price — низкая средняя цена проданной вещи;
#     discount  — доля скидок выше, чем у команды;
#     returns   — много возвратов (только о подборе вещи, никогда об отказе в возврате);
#     general   — этапы продажи, для всех.
# - Длина: title — до 60 символов, text — до 900, try_today — до 200.
# - Квиз: ровно 2 вопроса, у каждого 3 варианта до 60 символов (они станут кнопками);
#   correct — номер верного варианта, считая с 0 (0 — первый, 1 — второй, 2 — третий);
#   верный ответ ставьте на разные позиции; explain — до 200 символов.
# - onboarding — уроки для новичка на первые 10 рабочих дней, без квизов. shift — номер рабочего
#   дня (1–10); поле так называется в коде, его и номера НЕ МЕНЯЙТЕ. Заголовок: «Рабочий день 1. …».
# - ТЕРМИНЫ (решение владельца 18.10.2026): «смена» — это СОСТАВ продавцов, который работает
#   в одном магазине (каждую среду смены меняются магазинами). Выход продавца на работу —
#   «рабочий день»: «в начале рабочего дня», «за рабочий день», «сегодня». Не пишите «за смену»,
#   «в начале смены», «перед сменой» в значении рабочего времени. Слово «смена» — только о составе:
#   «коллеги по смене».
# - РЕМЕНЬ К ДЖИНСАМ НЕ ПРЕДЛАГАЙТЕ (решение владельца 18.10.2026): почти все джинсы (около 98 %)
#   уже продаются с ремнём в комплекте. Ремень — к брюкам. К джинсам — футболка, поло, рубашка,
#   свитшот, на холодное время — джемпер.
# - Нельзя использовать символы «звёздочка» и «подчёркивание» в текстах: сообщения уходят
#   в разметке markdown и текст исказится. Эмодзи — не больше одного на урок.
# - Фразы для покупателя — в кавычках-ёлочках «…». Обращение к продавцу и к покупателю — на «вы».
# - Не пишите конкретных цен, брендов, акций и условий дисконтной карты — только общие приёмы.
# - Строки в двойных кавычках: внутри не ставьте прямые кавычки ", используйте «ёлочки».
# - Подробные правила и чек-лист: .claude/skills/prodazhi-v-magazine/SKILL.md
# - После правки проверьте, что файл читается (команда в SKILL.md, раздел «Проверка»).

lessons:

  # ---------- items: вещей в чеке / за рабочий день ----------

  - id: obraz-1
    topic: items
    title: "Собирайте образ, а не одну вещь"
    text: |
      Покупатель пришёл за брюками, но носить он будет не брюки, а образ: брюки, рубашку, ремень, иногда пиджак или джемпер. Помогите ему увидеть картину целиком.

      • Узнав, за чем пришли, спросите, с чем человек будет это носить: «С чем планируете носить брюки — с рубашкой или со свитером?»
      • Пока покупатель в примерочной, подберите одну-две вещи к основной и принесите: «Вот рубашка в тон к брюкам — посмотрите, как смотрится вместе».
      • Предлагайте то, что действительно подходит по стилю, цвету и поводу, а не просто вещь подороже.
      • Отказ — это нормально. «Конечно, без проблем» — и продолжайте помогать с основной покупкой.

      Вторая вещь — это забота: покупатель уходит с готовым решением, а не с вопросом «а с чем это носить?».
    try_today: "К каждой основной покупке сегодня предложите одну вещь, которая собирает образ, и принесите её в примерочную вместе с основной."
    quiz:
      - q: "Покупатель меряет брюки. Когда лучше предложить к ним рубашку?"
        options: ["После оплаты, у кассы", "Пока он в примерочной — принести вместе", "Не предлагать, если сам не спросил"]
        correct: 1
        explain: "В примерочной покупатель видит вещи вместе и сразу оценивает образ. У кассы решение уже принято, а без предложения он может не узнать о хорошем сочетании."
      - q: "Покупатель отказался от второй вещи. Что делать?"
        options: ["Спокойно принять отказ и помогать дальше", "Предложить ту же вещь ещё раз позже", "Сразу предложить на неё скидку"]
        correct: 0
        explain: "Отказ нужно уважать. Повторные уговоры портят впечатление, а скидка без причины снижает выручку."

  - id: obraz-2
    topic: items
    title: "Дополнения: ремень, носки, галстук"
    text: |
      Дополнения — небольшие вещи, без которых образ выглядит незаконченным. Покупатель часто о них не думает, и ваша подсказка экономит ему время.

      Что к чему предлагать:
      • к брюкам — ремень; спросите про обувь: «Обувь будете носить чёрную или коричневую? Подберу ремень в тон»;
      • к брюкам — носки в тон брюкам или обуви;
      • к пиджаку и костюму — рубашку и галстук: «Давайте подберём к костюму рубашку и галстук — посмотрите, как меняется образ»;
      • к джинсам — футболку, поло или рубашку, на холодное время — свитшот или джемпер. Ремень к джинсам не нужен: почти все джинсы уже продаются с ремнём в комплекте.

      Предлагайте одно-два дополнения, а не весь список сразу. Заранее знайте, где лежат ремни, носки и галстуки, чтобы показать их без поиска.
    try_today: "Сегодня ко всем брюкам предлагайте ремень, к джинсам — футболку, поло или рубашку, а к костюмам — рубашку или галстук. Вечером вспомните, сколько раз согласились."
    quiz:
      - q: "Покупатель берёт классические брюки. Какое дополнение уместнее?"
        options: ["Футболка с принтом", "Свитшот", "Ремень в тон обуви"]
        correct: 2
        explain: "Ремень — естественное дополнение к брюкам, без него образ не закончен. Вопрос про цвет обуви помогает подобрать точно."
      - q: "Сколько дополнений лучше предложить за один раз?"
        options: ["Все, какие есть в магазине", "Одно-два самых подходящих", "Ни одного, пока не спросят"]
        correct: 1
        explain: "Одно-два точных предложения звучат как совет. Длинный список утомляет и выглядит как давление."

  - id: obraz-3
    topic: items
    title: "Покажите образ целиком"
    text: |
      Людям проще купить то, что они увидели собранным. Одна вещь на вешалке — это «просто брюки», а брюки с рубашкой и ремнём — уже готовое решение.

      • В начале рабочего дня посмотрите на манекены: если образ разобран или неполный, соберите его или скажите администратору.
      • В примерочную приносите не одну вещь, а комплект: основную вещь в двух соседних размерах и подходящую к ней вторую вещь.
      • Покупатель вышел к зеркалу — предложите накинуть пиджак или джемпер: «Давайте посмотрим вместе с пиджаком — так понятнее, как это будет смотреться».
      • Спрашивают про вещь с манекена — покажите весь комплект, а не только её. Покупатель сам решит, что взять.
    try_today: "Сегодня хотя бы трём покупателям принесите в примерочную вторую вещь к основной, чтобы они увидели готовый образ."
    quiz:
      - q: "Покупатель спрашивает про рубашку с манекена. Что лучше сделать?"
        options: ["Показать весь образ с манекена", "Дать рубашку и отойти", "Сказать, что с манекена не продаём"]
        correct: 0
        explain: "Покупателю понравился образ целиком. Покажите, из чего он собран, — и он сам решит, что взять."
      - q: "Что принести в примерочную вместе с брюками?"
        options: ["Ничего, чтобы не отвлекать", "Брюки во всех размерах сразу", "Соседний размер и подходящую рубашку"]
        correct: 2
        explain: "Соседний размер экономит время на примерке, а рубашка показывает образ. Все размеры сразу только запутают."

  # ---------- avg_price: средняя цена проданной вещи ----------

  - id: cena-1
    topic: avg_price
    title: "Начинайте показ со среднего и верхнего сегмента"
    text: |
      Если первой показать самую дешёвую модель, покупатель может так и не узнать, что есть вариант, который подойдёт ему лучше.

      • Начинайте с подходящей под запрос модели среднего или верхнего ценового сегмента и честно расскажите, чем она хороша.
      • Сразу дайте понять, что выбор есть: «Есть модели и доступнее — покажу, чтобы было с чем сравнить».
      • Не решайте за покупателя, что ему «дорого». По одежде и возрасту бюджет не угадать.
      • Если покупатель назвал бюджет — уважайте его и подбирайте в этих пределах, без уговоров.

      Задача не в том, чтобы продать дороже любой ценой, а в том, чтобы показать весь выбор, начиная с лучшего.
    try_today: "Сегодня каждому покупателю первой показывайте подходящую модель среднего или верхнего сегмента и предлагайте сравнить с вариантом доступнее."
    quiz:
      - q: "Покупатель просит «просто джинсы». С чего начать показ?"
        options: ["С самой дешёвой модели", "С подходящей модели среднего сегмента", "С самой дорогой модели в магазине"]
        correct: 1
        explain: "Средний сегмент — удобная точка отсчёта: от него легко показать и дешевле, и лучше. Самая дорогая без повода выглядит как давление."
      - q: "Покупатель назвал свой бюджет. Как поступить?"
        options: ["Всё равно показать модели дороже", "Сразу показать самое дешёвое", "Подбирать в пределах бюджета"]
        correct: 2
        explain: "Названный бюджет — это просьба, а не повод для уговоров. Внутри бюджета тоже можно начать с лучшего варианта."

  - id: cena-2
    topic: avg_price
    title: "Рассказывайте о ценности: ткань, посадка, срок службы"
    text: |
      Цена кажется высокой, когда покупатель не видит, за что платит. Ваша задача — перевести характеристики вещи в пользу для него.

      • Ткань. Посмотрите состав на ярлыке и объясните просто: «Здесь есть эластан — брюки не сковывают движений, в них удобно сидеть весь день».
      • Посадка. Покажите на примерке: плечо пиджака на месте, брюки не тянут в поясе. «Посмотрите, как держит форму плечо».
      • Срок службы и уход. Плотная ткань, ровные швы, надёжная фурнитура — вещь дольше выглядит аккуратно. Подскажите уход по ярлыку.
      • Говорите только то, что знаете точно. Не уверены — посмотрите ярлык или уточните у администратора.

      Одна точная фраза о пользе работает лучше общего «хорошее качество».
    try_today: "В начале рабочего дня выберите три вещи разных категорий, прочитайте ярлыки и придумайте для каждой одну фразу о пользе для покупателя."
    quiz:
      - q: "Какая фраза лучше объясняет ценность брюк?"
        options: ["«В составе эластан — удобно весь день»", "«Это очень хорошее качество»", "«Эти брюки сейчас все берут»"]
        correct: 0
        explain: "Конкретная польза, подтверждённая ярлыком, убеждает. «Хорошее качество» ничего не объясняет, а «все берут» может быть неправдой."
      - q: "Спрашивают, не сядет ли вещь после стирки, а вы не уверены. Как быть?"
        options: ["Сказать, что точно не сядет", "Посмотреть ярлык по уходу и ответить", "Перевести разговор на другую вещь"]
        correct: 1
        explain: "Ярлык подскажет, как ухаживать за вещью. Обещание наугад может обернуться разочарованием и возвратом."

  # ---------- discount: доля скидок ----------

  - id: skidka-1
    topic: discount
    title: "Сначала ценность, скидка — в конце"
    text: |
      Скидка, предложенная первой, как будто говорит: «сама по себе вещь того не стоит». К тому же она уменьшает выручку — и магазина, и вашу.

      • Сначала помогите выбрать: потребность, примерка, польза вещи.
      • Не начинайте разговор со скидки и не предлагайте её, если покупатель уже решил купить.
      • Сомневается из-за цены — уточните, что смущает, покажите ценность или вариант доступнее.
      • Скидка — последний аргумент, только по правилам магазина и только когда именно она решает покупку.
      • Будьте честны: не придумывайте «только сегодня» или «последняя скидка», если это неправда.
    try_today: "Сегодня не упоминайте скидку первыми. Если покупатель сомневается из-за цены, сначала спросите, что смущает, и расскажите о пользе вещи."
    quiz:
      - q: "Покупатель уже решил взять пиджак. Предлагать ему скидку?"
        options: ["Да, чтобы он точно вернулся", "Да, но только небольшую", "Нет, он уже сделал выбор"]
        correct: 2
        explain: "Скидка нужна, когда она решает покупку. Если решение принято, уместнее предложить дисконтную карту по правилам программы."
      - q: "Покупатель говорит «дорого». Что сделать первым?"
        options: ["Уточнить, что смущает, и рассказать о пользе", "Сразу предложить скидку", "Согласиться и отойти"]
        correct: 0
        explain: "За словом «дорого» часто стоит сомнение в пользе вещи или ограниченный бюджет. Сначала разберитесь, что именно смущает."

  - id: skidka-2
    topic: discount
    title: "Дисконтная карта вместо ручной скидки"
    text: |
      Ручная скидка — разовая уступка. Дисконтная карта — программа с одинаковыми для всех условиями: покупатель получает выгоду честно и возвращается к нам снова.

      • Просят скидку — сначала предложите карту: «Могу оформить вам нашу дисконтную карту и рассказать, какие по ней условия».
      • Заранее узнайте у администратора точные условия карты, чтобы объяснять их без ошибок.
      • Ручную скидку давайте только по правилам магазина — не из жалости и не ради быстрой продажи.
      • Никогда не обещайте того, чего нет: несуществующих акций, «скидки для своих», будущего снижения цены.

      Честность в разговоре о ценах — основа доверия. Покупатель, которого не обманули, приходит снова.
    try_today: "Сегодня на каждую просьбу о скидке сначала предлагайте дисконтную карту. Если не знаете её условий точно — спросите администратора в начале рабочего дня."
    quiz:
      - q: "Покупатель просит скидку на рубашку. Лучший первый шаг?"
        options: ["Дать ручную скидку, чтобы не ушёл", "Предложить оформить дисконтную карту", "Пообещать скидку в следующий раз"]
        correct: 1
        explain: "Карта даёт выгоду по понятным правилам и приводит покупателя снова. Ручная скидка — только по правилам магазина, а пустое обещание подрывает доверие."
      - q: "Можно сказать «завтра цена вырастет», чтобы ускорить покупку?"
        options: ["Да, это обычный приём продаж", "Да, если покупатель долго думает", "Только если это правда"]
        correct: 2
        explain: "Ложная срочность — это обман. Узнав правду, покупатель больше не придёт. Говорите о ценах только то, что знаете точно."

  # ---------- returns: доля возвратов ----------

  - id: vozvrat-1
    topic: returns
    title: "Примерка, после которой не хочется возвращать"
    text: |
      Частая причина возврата одежды — «не тот размер» или «не так сидит». Внимательная примерка решает это ещё в магазине.

      • Всегда предлагайте примерить: «Давайте примерим — так сразу будет видно посадку».
      • Брюки и джинсы: попросите присесть и сделать шаг. «Присядьте, пожалуйста, — так видно, не тянет ли в поясе». Длину оценивайте с той обувью, с которой будут носить.
      • Пиджак: плечо не свисает и не тянет, из рукава немного видна манжета рубашки, пиджак застёгивается без складок.
      • Рубашка: в застёгнутый воротник проходит палец, рукав не становится коротким, когда руки вытянуты вперёд.
      • Сомневаетесь в размере — принесите соседний и сравните.
    try_today: "Сегодня каждому, кто меряет брюки или пиджак, предложите проверить посадку: присесть, поднять руки, посмотреть в зеркало сбоку."
    quiz:
      - q: "Зачем просить покупателя присесть, когда он меряет брюки?"
        options: ["Проверить, не тянет ли в поясе и бёдрах", "Чтобы он дольше побыл в примерочной", "Так положено, без особой причины"]
        correct: 0
        explain: "Стоя брюки могут сидеть хорошо, а сидя — тянуть. Лучше заметить это в примерочной, чем дома."
      - q: "Покупатель сомневается между двумя размерами. Что делать?"
        options: ["Посоветовать меньший — разносится", "Принести оба и сравнить на примерке", "Предложить взять оба и вернуть лишний"]
        correct: 1
        explain: "Сравнение на примерке даёт точный ответ. Совет «разносится» часто не сбывается и приводит к возврату."

  - id: vozvrat-2
    topic: returns
    title: "Честный совет лучше лишней продажи"
    text: |
      Вещь, которая не подошла, скорее всего вернётся, а покупатель уйдёт разочарованным. Честный совет сохраняет доверие и снижает возвраты.

      • Сидит плохо — скажите об этом мягко и предложите другой вариант: «Мне кажется, в плечах великовато. Давайте попробуем размер меньше или другую модель».
      • Не говорите «разносится» или «сядет по фигуре», если не уверены.
      • Покупка в подарок: уточните размер и рост, предложите сохранить чек и ярлыки, честно расскажите об условиях обмена.
      • Если покупатель всё же решит вернуть вещь — это его право по Закону о защите прав потребителей. Оформите спокойно и вежливо, без уговоров и упрёков: так он вернётся к вам за новой покупкой.
    try_today: "Сегодня, если вещь сидит неидеально, скажите об этом честно и предложите другой размер или модель до того, как покупатель пойдёт на кассу."
    quiz:
      - q: "Пиджак велик в плечах, но покупатель готов его взять. Ваши действия?"
        options: ["Промолчать, раз он доволен", "Сказать, что сейчас так носят", "Мягко сказать и предложить размер меньше"]
        correct: 2
        explain: "Честное замечание экономит покупателю время и деньги, а магазину — возврат. Решение всё равно остаётся за покупателем."
      - q: "Покупатель пришёл вернуть вещь, которая не подошла. Как правильно?"
        options: ["Спокойно оформить по закону и правилам", "Уговорить оставить вещь себе", "Предложить скидку, чтобы не возвращал"]
        correct: 0
        explain: "Возврат — законное право покупателя. Вежливое оформление сохраняет доверие, а уговоры его разрушают."

  # ---------- general: этапы продажи для всех ----------

  - id: kontakt-1
    topic: general
    title: "Приветствие без давления"
    text: |
      Первые секунды задают тон всей покупке. Покупатель должен почувствовать, что ему рады, но на него не давят.

      • Поздоровайтесь, как только человек вошёл: взгляд, улыбка, «Здравствуйте!».
      • Не спрашивайте «Вам что-нибудь подсказать?» — на это почти всегда отвечают «нет, я просто смотрю».
      • Лучше дайте понять, что вы рядом: «Здравствуйте! Если понадобится размер или совет по образу — я здесь».
      • Дайте осмотреться. Подходите, когда покупатель задержался у вещи, взял её в руки или ищет глазами продавца.
      • Начните с вещи, а не с продажи: «Хорошая модель. Подобрать ваш размер?»
    try_today: "Сегодня здоровайтесь с каждым входящим в первые секунды и вместо «Вам что-нибудь подсказать?» говорите «Если понадобится размер или совет — я рядом»."
    quiz:
      - q: "Почему лучше не начинать с «Вам что-нибудь подсказать?»"
        options: ["Это звучит невежливо", "На него почти всегда отвечают «нет»", "Так говорить запрещено"]
        correct: 1
        explain: "Закрытый вопрос легко отклонить, и разговор заканчивается. Фраза «я рядом, если понадобится» оставляет дверь открытой."
      - q: "Когда лучше подойти к покупателю после приветствия?"
        options: ["Сразу и ходить за ним по залу", "Только если он сам позовёт", "Когда он задержался у вещи"]
        correct: 2
        explain: "Вещь в руках или взгляд в поисках продавца — знак, что помощь нужна. Ходить следом — давление, а ждать зова — упустить покупателя."

  - id: potrebnost-1
    topic: general
    title: "Выявление потребности: открытые вопросы"
    text: |
      Чтобы предложить нужное, сначала узнайте, что нужно. Открытые вопросы — те, на которые нельзя ответить «да» или «нет».

      Три главные темы:
      • Повод: «Для какого случая подбираете — на работу, на праздник, на каждый день?»
      • Стиль: «Что вы обычно носите — классику или что-то посвободнее?»
      • Гардероб: «С чем планируете носить? Что у вас уже есть из пиджаков и рубашек?»

      Слушайте больше, чем говорите. Повторите главное своими словами: «Значит, нужен тёмный костюм на свадьбу, и чтобы было не жарко, верно?» Так покупатель видит, что его услышали, а вы не ошибётесь с выбором.

      Ответ про гардероб подскажет, что ещё предложить к образу.
    try_today: "Сегодня с каждым покупателем задайте минимум два открытых вопроса — о поводе и о том, с чем он будет носить вещь, — прежде чем что-то показывать."
    quiz:
      - q: "Какой из вопросов открытый?"
        options: ["«Для какого случая подбираете?»", "«Вам нужны брюки?»", "«Тёмные подойдут?»"]
        correct: 0
        explain: "На открытый вопрос отвечают развёрнуто, и вы узнаёте больше. Вопросы, на которые отвечают «да» или «нет», быстро заканчивают разговор."
      - q: "Зачем спрашивать, что уже есть в гардеробе?"
        options: ["Чтобы просто поддержать разговор", "Чтобы подобрать вещи, которые сочетаются", "Чтобы понять, сколько у него денег"]
        correct: 1
        explain: "Зная гардероб, вы предложите вещь, которую будет с чем носить, и подскажете, чего не хватает для образа."

  - id: vozrazheniya-1
    topic: general
    title: "«Дорого» и «я подумаю»: как отвечать"
    text: |
      Возражение — не отказ, а сомнение. Цель — понять его, а не «победить» покупателя.

      «Дорого»:
      • Не спорьте, признайте чувство: «Понимаю, сумма заметная».
      • Уточните: «Скажите, что смущает — цена или сама вещь?»
      • Покажите пользу или предложите вариант доступнее: «Могу показать похожую модель дешевле — сравним?»

      «Я подумаю»:
      • Примите спокойно: «Конечно, вещь должна нравиться».
      • Мягко уточните: «Что понравилось, а в чём сомневаетесь? Может, подберём другой размер или цвет».
      • Если в магазине можно отложить вещь — предложите. Не торопите и не придумывайте, что «завтра не будет».

      Покупатель, который ушёл без покупки, но с хорошим впечатлением, часто возвращается.
    try_today: "Сегодня на каждое «дорого» или «я подумаю» задайте уточняющий вопрос — «Что смущает?» или «В чём сомневаетесь?» — и выслушайте ответ."
    quiz:
      - q: "Что лучше ответить на «дорого»?"
        options: ["«Да нет, это совсем недорого»", "«Тогда давайте сделаю скидку»", "«Понимаю. Что смущает — цена или вещь?»"]
        correct: 2
        explain: "Спор вызывает сопротивление, скидка сразу — потерю выручки. Уточняющий вопрос помогает понять настоящую причину."
      - q: "Покупатель говорит «я подумаю». Лучший ответ?"
        options: ["«Конечно. А в чём сомневаетесь?»", "«Подумайте, но завтра может не быть»", "«Хорошо» — и сразу отойти"]
        correct: 0
        explain: "Мягкий вопрос помогает снять сомнение, например подобрать другой размер. «Завтра может не быть» без оснований — давление и обман."

  - id: zavershenie-1
    topic: general
    title: "Завершение продажи и дисконтная карта"
    text: |
      Когда примерка прошла хорошо, покупателю нужна небольшая помощь, чтобы принять решение.

      • Замечайте сигналы: снова смотрится в зеркало, спрашивает про уход, обсуждает, с чем будет носить.
      • Подведите итог: «Брюки и рубашка сидят хорошо, ремень в тон обуви. Оформляем?»
      • Сомневается между двумя вещами — помогите сравнить, но выбор оставьте ему.
      • На кассе спросите про карту: «У вас есть наша дисконтная карта? Если нет — могу оформить и расскажу об условиях».
      • После оплаты поблагодарите, подскажите по уходу и пригласите снова: «Приходите, будем рады подобрать что-нибудь к этому образу».
    try_today: "Сегодня каждому покупателю без дисконтной карты предложите её на кассе, а после оплаты дайте один совет по уходу за вещью."
    quiz:
      - q: "Какой сигнал говорит, что покупатель готов купить?"
        options: ["Быстро оглядывает зал", "Спрашивает, как ухаживать за вещью", "Смотрит на часы"]
        correct: 1
        explain: "Вопрос об уходе значит, что человек уже представляет вещь своей. Самое время мягко подвести итог."
      - q: "Когда лучше предложить дисконтную карту?"
        options: ["Сразу при входе в магазин", "Только если покупатель спросит", "При оформлении покупки на кассе"]
        correct: 2
        explain: "На кассе предложение звучит уместно: покупка сделана, и понятно, зачем карта. Если ждать вопроса, многие о карте так и не узнают."

  - id: assortiment-1
    topic: general
    title: "Знайте новинки и ассортимент"
    text: |
      Покупатель доверяет продавцу, который быстро находит нужный размер и знает, что с чем носить.

      • Каждое утро бот присылает новые поступления: категории и количество моделей. В начале рабочего дня найдите эти вещи в зале.
      • Пройдите по залу: где какие модели, какие размеры есть, каких нет. Лучше знать заранее, чем искать при покупателе.
      • Для каждой новинки придумайте сочетание из того, что уже есть в магазине.
      • Рассказывайте о новинках постоянным покупателям: «На этой неделе пришли новые джемперы — показать?» (если они действительно пришли).

      Если чего-то не знаете — скажите честно: «Сейчас уточню». Это лучше, чем ответ наугад.
    try_today: "В начале рабочего дня откройте в сообщении бота «Новые поступления», найдите эти вещи в зале и придумайте к каждой одно сочетание."
    quiz:
      - q: "Где продавцу узнать о новых поступлениях за вчера?"
        options: ["В утреннем сообщении бота", "В итогах месяца 1-го числа", "Только от покупателей"]
        correct: 0
        explain: "Бот каждое утро присылает новые поступления: категории, количество моделей и штук. Это быстрый способ быть в курсе."
      - q: "Покупатель спрашивает о вещи, а вы не знаете ответа. Что делать?"
        options: ["Ответить наугад, чтобы не молчать", "Честно сказать «Сейчас уточню» и узнать", "Сказать, что такого у нас нет"]
        correct: 1
        explain: "Честное «сейчас уточню» вызывает доверие. Ответ наугад может оказаться неправдой и привести к разочарованию или возврату."

