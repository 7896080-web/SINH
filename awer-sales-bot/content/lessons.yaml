      • Узнайте у администратора стандарт внешнего вида, принятый в магазине, и следуйте ему.
      • Общие правила: чистая выглаженная одежда, аккуратная обувь, без резкого парфюма. Хорошо, если вы одеты в стиле магазина.
      • Зоны: вход, торговый зал, примерочные, касса. Узнайте у администратора, за какую зону вы отвечаете.
