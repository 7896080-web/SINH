# Скопируйте в config.yaml и поправьте под себя. Секреты — в .env (см. .env.example).
db_path: data/awer.db
timezone: Europe/Moscow
stores: ["Город", "МСЛ"]        # день закрыт, когда пришла выгрузка по всем этим магазинам (как в 1С)
norm_shifts: 18                 # смен в полном месяце (решение владельца 18.10.2026); график — админка → «График смен»

params:                          # значения по умолчанию; помесячно меняются в админке
  base_rate: 25000               # базовая ставка
  admin_bonus: 13000             # админ. доплата старшим — фиксированная, схемой не меняется
  step: 0.15                     # шаг перевыполнения плана: +5 000 за каждые полные +15 %
  step_bonus: 5000               # надбавка за шаг
  max_rate: 45000                # потолок ставки без админ. доплаты
  min_fte: 1.0                   # меньше 1 полного отработанного месяца за 12 мес. — план новичка
  window: 3                      # окно тренда и среднего месяца магазина, мес.
  personal_window: 12            # личный план — доля продавца в выручке магазина за столько месяцев
  sales_percent: 0.04            # % от продаж — только для ведомости
  stabilizer: none               # none | one_step (ставка меняется не больше чем на 1 ступень за месяц)

onec:
  inbox: data/inbox              # сюда обработка 1С кладёт sales_*, orp_docs_*, stock_*, arrivals_*.csv
  archive: data/archive
  columns:                       # строки «Отчета о розничных продажах»
    date: "Дата"
    store: "Склад"
    seller: "Продавец"
    doc: "Документ"
    item: "Номенклатура"
    category: "Номенклатурная группа"
    qty: "Количество"
    amount: "Сумма"
    discount: "Скидка"
  doc_columns:                   # шапки ОРП
    date: "Дата"
    store: "Магазин"
    kassa: "Касса"
    doc: "Документ"
    checks: "Чеков"
    return_checks: "Чеков возврата"
    revenue: "Выручка"
  store_map:                     # склад / касса из 1С → магазин (по части названия, без учёта регистра)
    "ГОРОД": "Город"
    "МСЛ": "МСЛ"
  exclude_sellers: ["Wildberries", "Ozon", "Lamoda"]   # пустого продавца сюда НЕ добавлять: это «(без продавца)», он входит в выторг
  service_sellers: ["Одежда сотрудникам", "Одежда сотрудникам Город", "Стажер", "Татьяна"]  # не продавцы (имя целиком): в выторге, без плана
  seller_store_suffixes: {" МСЛ": "МСЛ"}
  ignore_brands: ["МСЛ"]         # «Бренд» в 1С, который не марка: у всех моделей стоит «МСЛ», бренд — в наименовании
  default_store: "Город"

schedule:
  daily_send_time: "09:30"       # отправка за вчерашний день
  retry_minutes: 30              # повтор, если выгрузка ещё не пришла
  deadline_time: "13:00"         # после — отправка по имеющимся данным + предупреждение владельцу

max:
  base_url: https://platform-api2.max.ru   # с 19.07.2026; сертификат Минцифры встроен в бота
  ca_file: ""                    # свой корневой сертификат — только если MAX сменит цепочку
  owners: []                     # user_id владельца/управляющего в MAX (узнать: написать боту, см. журнал)
  poll_timeout: 30
  bot_link: ""                   # https://max.ru/<имя_бота> — для ссылок-приглашений

max_training:                    # второй бот — «Обучение» (токен MAX_TRAINING_BOT_TOKEN в .env)
  bot_link: ""                   # https://max.ru/<имя бота обучения> — для кнопки «Подключить обучение»

recommendations:
  lookback_days: 90
  add_ons: ["Ремень", "Футболка", "Рубашка", "Носки", "Галстук", "Свитшот", "Джемпер"]  # запасной список
                                 # «дополнений», пока в 1С нет чеков; в советах — только то, что есть на остатке
  included: {"Джинсы": ["Ремень"]}   # что уже идёт в комплекте (98 % джинсов — с ремнём): такие связки не советуем
  llm: false                     # true — советы переформулирует Claude API (ANTHROPIC_API_KEY)
  llm_model: claude-sonnet-5-5

motivation:                      # мотивация без денег: на ставку не влияет (docs/SPEC.md)
  records: true                  # личные рекорды и серии в утреннем сообщении
  weekly_goal: true              # цель недели по самому слабому показателю
  store_goal: true               # «магазины вместе: X из плана» — только в сводке владельца
  coach_sheet: true              # по понедельникам старшим и владельцу — листок для разговоров 1:1

training:
  lessons_path: content/lessons.yaml   # уроки, квизы, программа новичка (правит владелец)
  weekly_lesson: true            # урок недели по теме цели недели
  quizzes: true                  # 2 вопроса с кнопками после урока (нужны входящие события MAX)
  onboarding_shifts: 10          # новичок — первые N смен: уроки программы новичка вместо урока недели
