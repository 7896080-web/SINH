<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Репрайсер{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.ico">
<script src="/static/busy.js" defer></script>
</head>
<body>
<header>
  <span class="brand">Репрайсер</span>
  {% if current_user %}
  <nav>
    {% for key, href, label in nav_items %}
    <a href="{{ href }}" class="{{ 'active' if active_page == key else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
  <form method="post" action="/logout"><button type="submit">{{ current_user.username }} · выйти</button></form>
  {% endif %}
</header>
<main>
  {% if flash %}<div class="flash {{ flash.level }}">{{ flash.text }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
